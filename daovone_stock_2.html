  }
  main.innerHTML = `
    <button class="btn" id="addModelBtn"><svg class="dv-icon"><use href="#i-box"></use></svg>ເພີ່ມສິນຄ້າ/ຮຸ່ນໃໝ່</button>
    ${isAdmin ? `<button class="btn secondary" id="adjHistoryBtn"><svg class="dv-icon"><use href="#i-gear"></use></svg>ປະຫວັດການປรับສะຕັອก</button>` : ''}
    ${isAdmin ? `<button class="btn secondary" id="checkDupBtn"><svg class="dv-icon"><use href="#i-alert"></use></svg>ກວດເລກເຄື່ອງຊ້ຳ</button>` : ''}
    <button class="btn secondary" id="exportStockBtn"><svg class="dv-icon"><use href="#i-receipt"></use></svg>ສົ່ງອອກໃບນັບສະຕັອກ (CSV)</button>
    <div class="card">
      <h3><svg class="dv-icon"><use href="#i-box"></use></svg>ລາຍການສິນຄ້າ (<span id="prod_count">${models.length}</span>)</h3>
      <input id="prod_search" placeholder="ຄົ້ນຫາສິນຄ້າ (ຊື່ / ລະຫັດ / ໝວດໝູ່)..." style="margin-bottom:10px;">
      <div id="prod_list">${rowsHtml(models)}</div>
    </div>
  `;
  document.getElementById('addModelBtn').addEventListener('click', ()=> openModelModal());
  if(isAdmin){
    document.getElementById('adjHistoryBtn').addEventListener('click', ()=> openAdjustHistoryModal());
    document.getElementById('checkDupBtn').addEventListener('click', ()=> openDuplicateSerialsModal(models));
  }
  document.getElementById('exportStockBtn').addEventListener('click', ()=> exportStockCount(currentList));
  bindRowEvents();
  const searchEl = document.getElementById('prod_search');
  searchEl.addEventListener('input', ()=>{
    const q = searchEl.value.trim().toLowerCase();
    const filtered = q ? models.filter(m=>
      (m.name||'').toLowerCase().includes(q) ||
      (m.code||'').toLowerCase().includes(q) ||
      (m.category||'').toLowerCase().includes(q)
    ) : models;
    currentList = filtered;
    document.getElementById('prod_list').innerHTML = rowsHtml(filtered);
    document.getElementById('prod_count').textContent = filtered.length;
    bindRowEvents();
  });

  /* ສ້າງໃບນັບສະຕັອກ (CSV) ໃຫ້ພະນັກງານພິມ/ເປີດ Excel ໄປນັບກັບຂອງຈິງ:
     ສິນຄ້າມີເລກເຄື່ອງ → 1 ແຖວ/1 ເລກເຄື່ອງ (ຈຳນວນ 1), ສິນຄ້າບໍ່ມີເລກເຄື່ອງ → 1 ແຖວ (ຈຳນວນຕາມສະຕັອກ)
     ຄໍລຳ "ຈຳນວນນັບຈິງ / ຜົນຕ່າງ / ໝາຍເຫດ" ວ່າງໄວ້ ໃຫ້ພະນັກງານຕື່ມເອງຕອນນັບ */
  async function exportStockCount(list){
    if(!list || !list.length){ toast('ບໍ່ມີສິນຄ້າໃຫ້ສົ່ງອອກ'); return; }
    let units = [];
    try{
      units = await sb('stock_product_units?select=model_id,serial_no&status=eq.in_stock');
    }catch(err){ toast('ດຶງເລກເຄື່ອງບໍ່ໄດ້: '+err.message); return; }
    const serialsByModel = {};
    units.forEach(u=>{ (serialsByModel[u.model_id] = serialsByModel[u.model_id] || []).push(u.serial_no || ''); });

    const header = ['ລຳດັບ','ໝວດໝູ່','ລະຫັດ','ຊື່ສິນຄ້າ','ເລກເຄື່ອງ','ຈຳນວນໃນລະບົບ','ຈຳນວນນັບຈິງ','ຜົນຕ່າງ','ໝາຍເຫດ'];
    const sorted = [...list].sort((a,b)=> (a.category||'').localeCompare(b.category||'') || (a.name||'').localeCompare(b.name||''));
    const rows = [];
    let n = 0;
    sorted.forEach(m=>{
      if(m.has_serial){
        const serials = (serialsByModel[m.id] || []).slice().sort((x,y)=> String(x).localeCompare(String(y)));
        if(serials.length) serials.forEach(sn=> rows.push([++n, m.category||'', m.code||'', m.name||'', sn, 1, '', '', '']));
        else rows.push([++n, m.category||'', m.code||'', m.name||'', '', 0, '', '', '']);
      } else {
        rows.push([++n, m.category||'', m.code||'', m.name||'', '', (balMap[m.id]||0), '', '', '']);
      }
    });
    const totalQty = rows.reduce((s,r)=> s + (Number(r[5])||0), 0);
    /* ແຖວສະຫຼຸບທ້າຍໄຟລ໌ */
    rows.push([]);
    rows.push(['','','','','ລວມ', totalQty, '', '', `${n} ແຖວ · ວັນທີ ${todayStr()}`]);

    const esc = v=>{ const s = String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
    const csv = '﻿' + [header, ...rows].map(r=> r.map(esc).join(',')).join('\r\n'); /* BOM ໃຫ້ Excel ອ່ານພາສາລາວຖືກ */
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    /* ຊື່ໄຟລ໌ເປັນ ASCII (stock-count-YYYY-MM-DD) — Safari ບໍ່ຮັບ download attribute ຖ້າຊື່ເປັນພາສາລາວ ຈະເປີດເປັນໜ້າເວັບແທນການດາວໂຫລດ */
    a.download = `stock-count-${todayStr()}.csv`;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    /* ຢ່າ revoke ທັນທີ! Safari ດາວໂຫລດແບບ async ຖ້າລຶບ blob ໄວເກີນ ຈະຂຶ້ນ error "WebKitBlobResource error 1" — ລໍຖ້າໃຫ້ດາວໂຫລດແລ້ວຄ່ອຍລຶบ */
    setTimeout(()=> URL.revokeObjectURL(url), 60000);
    toast(`ສ້າງໃບນັບສະຕັອກແລ້ວ · ${n} ລາຍການ`);
  }
}

/* ປรับສະຕັອກສິນຄ້າ (ບໍ່ມີເລກເຄື່ອງ) ໃຫ້ເປັນຈຳນວນທີ່ຖືກຕ້ອງ — ສະເພາະແອດມິນ
   ບໍ່ໄດ້ໄປລົບບິນ/ຮັບເຂົ້າເກົ່າ ແຕ່ບັນທຶກ movement ‘adjust’ ຊົດເຊີຍໃຫ້ຍອດເທົ່າທີ່ຕ້ອງການ (stock_balance ຄິດໃໝ່ໃຫ້ເອງ) */
function openAdjustStockModal(model, currentQty){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3><svg class="dv-icon"><use href="#i-gear"></use></svg>ປรับສะຕັອກ</h3>
      <div style="font-weight:600;margin-bottom:2px;">${model.name}</div>
      <div class="muted" style="font-size:12px;margin-bottom:10px;">ຕອນນີ້ໃນລະບົບ: <span class="mono" style="font-weight:700;">${fmtMoney(currentQty)}</span> ${model.unit||''}</div>
      <label>ຈຳນວນຄົງເຫຼືອທີ່ຖືກຕ້ອງ</label>
      <input id="adj_qty" type="number" min="0" step="1" value="${currentQty}">
      <label>ເຫດຜົນ (ຖ້າມີ)</label>
      <input id="adj_note" placeholder="ເຊັ່ນ ນັບສະຕັອກຈິງ / ພິມຮັບເຂົ້າຜິດ">
      <div class="grid2" style="margin-top:12px;">
        <button class="btn secondary" id="adj_cancel">ຍົກເລີກ</button>
        <button class="btn" id="adj_save"><svg class="dv-icon"><use href="#i-check-circle"></use></svg>ບັນທຶກ</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click', (e)=>{ if(e.target === bg) bg.remove(); });
  bg.querySelector('#adj_cancel').addEventListener('click', ()=> bg.remove());
  bg.querySelector('#adj_save').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    const raw = document.getElementById('adj_qty').value;
    const target = Math.round(Number(raw));
    if(raw === '' || !Number.isFinite(target) || target < 0){ toast('ໃສ່ຈຳນວນທີ່ຖືກຕ້ອງ (0 ຂຶ້ນໄປ)'); return; }
    const delta = target - currentQty;
    if(delta === 0){ toast('ຈຳນວນບໍ່ປ່ຽນແປງ'); bg.remove(); return; }
    const note = document.getElementById('adj_note').value.trim();
    btn.disabled = true;
    try{
      await sb('stock_movements', { method:'POST', body:{
        id: uid(), model_id: model.id, unit_id: null,
        movement_type: delta > 0 ? 'in' : 'out', quantity: Math.abs(delta),
        ref_type: 'adjust', note: `ປรับ ${currentQty}→${target}` + (note ? ' · ' + note : ''), created_by: currentUsername
      }});
      toast(`ປรับสะຕັອກ ${model.name} → ${fmtMoney(target)} ${model.unit||''}`);
      bg.remove();
      renderTab();
    }catch(err){ toast('ຜິດພາດ: ' + err.message); btn.disabled = false; }
  });
}

/* ລົບເລກເຄື່ອງ (serial) ທີ່ເພີ່ມຜິດອອກເປັນຊິ້ນ — ສະເພາະແອດມິນ
   ບັນທຶກ movement ‘adjust’ ໄວ້ເປັນປະຫວັດກ່ອນ (ບໍ່ໃຫ້ຫາຍງຽບໆ) ແລ້ວຄ່ອຍລົບໜ່ວຍ+movement ເກົ່າ
   ໃຊ້ສຳລັບກໍລະນີ "ຮັບເຂົ້າ/ພິມເລກເຄື່ອງຜິດ" ໂດຍບໍ່ຕ້ອງລົບບິນທັງໃບ */
async function adjustRemoveUnit(unit){
  await sb('stock_movements', { method:'POST', body:{
    id: uid(), model_id: unit.model_id, unit_id: null,
    movement_type:'out', quantity:1, ref_type:'adjust',
    note:'ລົບເລກເຄື່ອງ ' + (unit.serial_no||''), created_by: currentUsername
  }});
  await sb(`stock_movements?unit_id=eq.${unit.id}`, { method:'DELETE' });
  await sb(`stock_product_units?id=eq.${unit.id}`, { method:'DELETE' });
}
/* ແກ້ໄຂເລກເຄື່ອງ (serial) ທີ່ພິມຜິດ — ສະເພາະແອດມິນ ແລະ ສະເພາະເຄື່ອງທີ່ຍັງຄົງຄັງ (in_stock, ຍັງບໍ່ຂາຍ)
   ກັນເລກຊ້ຳກ່ອນບັນທຶກ. ໜ່ວຍ (unit) ຄືອັນດຽວກັນ ບໍ່ໄດ້ສ້າງໃໝ່ → ປະຫວັດ movement/receipt ອ້າງດ້ວຍ unit_id ຈຶ່ງຕິດຕາມກັນຄືເກົ່າ */
async function editUnitSerial(unit, newSerial){
  const clean = (newSerial||'').trim();
  if(!clean) throw new Error('ເລກເຄື່ອງວ່າງບໍ່ໄດ້');
  if(clean === unit.serial_no) return false; /* ບໍ່ໄດ້ປ່ຽນ */
  const dup = await sb(`stock_product_units?select=id&serial_no=eq.${encodeURIComponent(clean)}`);
  if(dup.length) throw new Error(`ເລກເຄື່ອງ ${clean} ມີໃນລະບົບແລ້ວ`);
  await sb(`stock_product_units?id=eq.${unit.id}`, { method:'PATCH', body:{ serial_no: clean } });
  return true;
}
/* ເບິ່ງລາຍລະອຽດເລກເຄື່ອງ (serial) ຂອງສິນຄ້າທີ່ຕ້ອງເກັບເລກແຍກແຕ່ລະໜ່ວຍ */
async function openUnitsModal(model){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><div class="empty">ກຳລັງໂຫລດ...</div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click', (e)=>{ if(e.target === bg) bg.remove(); });
  const isAdmin = currentRole === 'admin';
  let stockChanged = false;
  async function paint(){
    const units = await getInStockUnits(model.id);
    bg.querySelector('.modal').innerHTML = `
      <h3><svg class="dv-icon"><use href="#i-box"></use></svg>${model.name}</h3>
      <div class="muted" style="font-size:12px;margin-bottom:8px;">ເລກເຄື່ອງທີ່ຍັງຄົງເຫຼືອໃນສະຕັອກ (${units.length} ${model.unit||'ໜ່ວຍ'})${isAdmin ? ' · ກົດ ✎ ເພື່ອແກ້ເລກເຄື່ອງ · ກົດ ✕ ເພື່ອລົບເລກເຄື່ອງທີ່ເພີ່ມຜິດ' : ''}</div>
      <hr class="sep">
      ${units.length ? units.map((u,idx)=> `
        <div class="row">
          <span class="mono">${u.serial_no}</span>
          <span class="row-actions">
            <span style="text-align:right;">
              <div class="muted" style="font-size:11px;">${fmtDateDMY(u.received_at)}</div>
              ${isAdmin ? `<div class="gold mono" style="font-size:12px;">${u.cost_lak!=null ? fmtMoney(u.cost_lak)+' ກີບ' : '-'}</div>` : ''}
            </span>
            ${isAdmin ? `<button class="icon-btn" data-edit="${idx}" style="color:var(--orange);border-color:var(--orange);">✎</button>` : ''}
            ${isAdmin ? `<button class="icon-btn" data-rm="${idx}" style="color:var(--danger);border-color:var(--danger);">✕</button>` : ''}
          </span>
        </div>`).join('') : '<div class="empty">ບໍ່ມີເຄື່ອງເຫຼືອໃນສະຕັອກ</div>'}
      <button class="btn secondary" id="unitsClose" style="margin-top:12px;">ປິດ</button>
    `;
    bg.querySelector('#unitsClose').addEventListener('click', ()=>{ bg.remove(); if(stockChanged) renderTab(); });
    if(isAdmin){
      bg.querySelectorAll('[data-edit]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const u = units[Number(btn.dataset.edit)];
          if(!u) return;
          const nv = prompt(`ແກ້ເລກເຄື່ອງ (serial)\nເລກເກົ່າ: ${u.serial_no}\n\nປ້ອນເລກເຄື່ອງໃໝ່:`, u.serial_no);
          if(nv === null) return; /* ກົດຍົກເລີກ */
          btn.disabled = true;
          try{
            const changed = await editUnitSerial(u, nv);
            if(changed){
              stockChanged = true;
              toast(`ແກ້ເລກເຄື່ອງເປັນ ${nv.trim()} ແລ້ວ`);
              await paint();
            } else { btn.disabled = false; }
          }catch(err){ toast('ຜິດພາດ: ' + err.message); btn.disabled = false; }
        });
      });
      bg.querySelectorAll('[data-rm]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const u = units[Number(btn.dataset.rm)];
          if(!u) return;
          if(!await confirmDelete(`ລົບເລກເຄື່ອງ ${u.serial_no} ອອກຈາກສະຕັອກ?`, 'ໃຊ້ເມື່ອເພີ່ມ/ພິມຜິດເທົ່ານັ້ນ')) return;
          btn.disabled = true;
          try{
            await adjustRemoveUnit(u);
            stockChanged = true;
            toast(`ລົບເລກເຄື່ອງ ${u.serial_no} ແລ້ວ`);
            await paint();
          }catch(err){ toast('ຜິດພາດ: ' + err.message); btn.disabled = false; }
        });
      });
    }
  }
  try{
    await paint();
  }catch(err){
    bg.querySelector('.modal').innerHTML = `<div class="empty">ຜິດພາດ: ${err.message}</div><button class="btn secondary" id="unitsClose2">ປິດ</button>`;
    bg.querySelector('#unitsClose2').addEventListener('click', ()=> bg.remove());
  }
}
/* ກວດເລກເຄື່ອງທີ່ຊ້ຳກັນຢູ່ໃນລະບົບ (ສຳລັບລ້າງຂໍ້ມູນເກົ່າກ່ອນຈະມີການກັນຊ້ຳ) — ອ່ານຢ່າງດຽວ ບໍ່ລົບຫຍັງໃຫ້ອັດຕະໂນມັດ */
async function openDuplicateSerialsModal(models){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><div class="empty">ກຳລັງກວດ...</div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click', (e)=>{ if(e.target === bg) bg.remove(); });
  try{
    const units = await sb('stock_product_units?select=id,model_id,serial_no,status,received_at&order=serial_no.asc');
    const modelName = id => (models.find(m=>m.id===id)||{}).name || '-';
    const groups = {};
    units.forEach(u=>{
      const key = (u.serial_no||'').trim().toUpperCase();
      if(!key) return;
      (groups[key] = groups[key] || []).push(u);
    });
    const dupGroups = Object.values(groups).filter(g=> g.length > 1);
    bg.querySelector('.modal').innerHTML = `
      <h3><svg class="dv-icon"><use href="#i-alert"></use></svg>ກວດເລກເຄື່ອງຊ້ຳ</h3>
      <div class="muted" style="font-size:12px;margin-bottom:8px;">${dupGroups.length ? `ພົບເລກເຄື່ອງຊ້ຳ ${dupGroups.length} ຊຸດ — ລາຍການລຸ່ມນີ້ຄື 2 (ຫຼືຫຼາຍກວ່າ) ໜ່ວຍທີ່ໃຊ້ເລກເຄື່ອງດຽວກັນ, ໄປແກ້ໄຂ/ລົບອັນທີ່ຜິດໃນ Supabase ໄດ້ເລີຍ` : 'ບໍ່ພົບເລກເຄື່ອງຊ້ຳໃນລະບົບ ✓'}</div>
      <hr class="sep">
      ${dupGroups.length ? dupGroups.map(g=> `
        <div style="margin-bottom:10px;">
          <div class="mono" style="font-weight:700;color:var(--danger);">${g[0].serial_no}</div>
          ${g.map(u=> `<div class="row" style="padding:4px 0;"><span style="font-size:12px;">${modelName(u.model_id)}</span><span class="muted" style="font-size:11px;">${u.status==='in_stock'?'ຄົງຄັງ':(u.status==='transferred'?'ໂອນສາຂາແລ້ວ':'ຂາຍແລ້ວ')} · ${fmtDateDMY(u.received_at)}</span></div>`).join('')}
        </div>`).join('') : ''}
      <button class="btn secondary" id="dupClose" style="margin-top:8px;">ປິດ</button>
    `;
    bg.querySelector('#dupClose').addEventListener('click', ()=> bg.remove());
  }catch(err){
    bg.querySelector('.modal').innerHTML = `<div class="empty">ຜິດພາດ: ${err.message}</div><button class="btn secondary" id="dupClose2">ປິດ</button>`;
    bg.querySelector('#dupClose2').addEventListener('click', ()=> bg.remove());
  }
}

   ============================================================ */
let receiveCart = [];
/* ถ้ากด Enter ตอนที่ไม่ได้อยู่ในช่องพิมพ์ไหนเลย (เช่น เพิ่งกด X ลบรายการ หรือคลิกออกจากช่องไปแล้ว) แล้วอยู่แท็บຮับเข้า+มีรายการในตะกร้าแล้ว = บันทึกรับเข้าทันที กันปัญหากด Enter ไม่ติดตอนโฟกัสหลุดจากช่อง */
document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Enter') return;
  const submitBtn = document.getElementById('r_submit');
  if(!submitBtn) return; // ไม่ได้อยู่แท็บຮับเข้าตอนนี้
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return; // ปล่อยให้ตัวจัดการเฉพาะช่องทำงานแทน
  if(!receiveCart.length) return;
  e.preventDefault();
  submitBtn.click();
});

      <select id="r_model">
        <option value="">-- ເລືອກສິນຄ້າ --</option>
        ${models.map(m=> `<option value="${m.id}" data-serial="${m.has_serial}" data-cost="${m.cost_price||0}" data-cost-thb="${m.cost_price_thb||0}" data-code="${(m.code||'').replace(/"/g,'&quot;')}" data-cat="${(m.category||'').replace(/"/g,'&quot;')}">${m.name}</option>`).join('')}
      </select>
      <div id="r_qtyBlock">
        <label>ຈຳນວນ</label>
        <input id="r_qty" type="number" value="1" min="1">
      </div>
      <div id="r_serialBlock" style="display:none;">
        <label>ເລກເຄື່ອງ (ພິມແລ້ວກົດ Enter ເພື່ອເພີ່ມເຂົ້າລາຍການທັນທີ)</label>
        <textarea id="r_serials" rows="3" placeholder="W95TD-00011&#10;W95TD-00012"></textarea>
      </div>
      ${canSeeCost ? `
      <label>ຊື້ເປັນສະກຸນ</label>
      <select id="r_currency">
        <option value="LAK">ກີບ (LAK)</option>
        <option value="THB">ບາດ (THB)</option>
      </select>
      <label id="r_cost_lbl">ຕົ້ນທຶນ/ໜ່ວຍ (ກີບ)</label>
      <input id="r_cost" type="text" value="0">
      <div id="r_rateBlock" style="display:none;">
        <label>ອັດຕາແລກປ່ຽນ (1 ບາດ = ? ກີບ)</label>
        <input id="r_rate" type="text" placeholder="ເຊັ່ນ 620">
        <div class="muted" style="font-size:11px;margin-top:3px;" id="r_lockedPreview"></div>
      </div>` : ''}
      <button class="btn secondary" id="r_addItem"><svg class="dv-icon"><use href="#i-box"></use></svg>ເພີ່ມເຂົ້າລາຍການ</button>
    </div>
    <div class="card">
      <h3><svg class="dv-icon"><use href="#i-receipt"></use></svg>ລາຍການທີ່ຈະຮັບເຂົ້າ <span id="r_count" class="rcv-count-badge">${receiveCartCountText()}</span></h3>
      <div id="r_cartList">${renderReceiveCart()}</div>
      ${canSeeCost ? `<div class="invoice-total mono">ລວມ: ${fmtMoney(receiveCart.reduce((s,i)=>s+i.amount,0))}</div>` : ''}
      <button class="btn" id="r_submit"><svg class="dv-icon"><use href="#i-check-circle"></use></svg>ບັນທຶກຮັບເຂົ້າ</button>
    </div>
    <div class="card">
      <h3><svg class="dv-icon"><use href="#i-truck"></use></svg>ປະຫວັດການຮັບເຂົ້າ <span class="muted" style="font-weight:400;font-size:11px;">(ກົດເພື່ອເບິ່ງລາຍການ)</span></h3>
      <label>ເລືອກເດືອນ</label>
      <input type="month" id="rcv_month" value="${historyMonth}">
      <div id="rcv_history" style="margin-top:8px;"><div class="empty">ກຳລັງໂຫລດ...</div></div>
    </div>
  `;
  document.getElementById('rcv_month').addEventListener('change', (e)=>{
    main.dataset.rcvMonth = e.target.value;
    loadReceiveHistory(e.target.value);
  });
  loadReceiveHistory(historyMonth);
  if(canSeeCost) attachMoneyInput('r_cost', 0);
  const modelSel = document.getElementById('r_model');
  enableSearchableSelect(modelSel);
  /* ອັດຕາຕ້ອງພິມໃໝ່ທຸກຄັ້ງທີ່ຮັບເຂົ້າ (ບໍ່ຈື່ອັດຕາເກົ່າໄວ້) ​ຕົ້ນທຶນກີບຈະລ໋ອກຕາມມື້ນີ້ ບໍ່ປ່ຽນຕາມພາຍຫຼັງ */
  /* ດຶງຕົ້ນທຶນທີ່ເຄີຍບັນທຶກໄວ້ຂອງສິນຄ້ານີ້ (ຕາມສະກຸນທີ່ເລືອກ: ບາດ→cost_price_thb, ກີບ→cost_price) ມາເຕີມໃຫ້ ບໍ່ຕ້ອງພິມໃໝ່ທຸກຄັ້ງ */
  function fillReceiveCostFromModel(){
    if(!canSeeCost) return;
    const opt = modelSel.selectedOptions[0];
    const currency = document.getElementById('r_currency').value;
    const saved = opt ? (currency === 'THB' ? (opt.dataset.costThb||0) : (opt.dataset.cost||0)) : 0;
    attachMoneyInput('r_cost', saved);
  }
  function updateReceiveCostLabel(){
    if(!canSeeCost) return;
    const currency = document.getElementById('r_currency').value;
    const rateBlock = document.getElementById('r_rateBlock');
    const lbl = document.getElementById('r_cost_lbl');
    rateBlock.style.display = currency === 'THB' ? 'block' : 'none';
    lbl.textContent = currency === 'THB' ? 'ຕົ້ນທຶນ/ໜ່ວຍ (ບາດ)' : 'ຕົ້ນທຶນ/ໜ່ວຍ (ກີບ)';
    fillReceiveCostFromModel();
    updateReceiveCostPreview();
  }
  function updateReceiveCostPreview(){
    const preview = document.getElementById('r_lockedPreview');
    if(!preview) return;
    const currency = document.getElementById('r_currency').value;
    if(currency !== 'THB'){ preview.textContent=''; return; }
    const costThb = moneyValue('r_cost');
    const rate = Number((document.getElementById('r_rate').value||'').replace(/,/g,''));
    if(costThb && rate) preview.textContent = `≈ ${fmtMoney(costThb*rate)} ກີບ/ໜ່ວຍ (ລ໋ອກຕົ້ນທຶນນີ້ໄວ້)`;
    else preview.textContent = 'ໃສ່ອັດຕາແລກປ່ຽນເພື່ອລ໋ອກຕົ້ນທຶນເປັນກີບ';
  }
  if(canSeeCost){
    document.getElementById('r_currency').addEventListener('change', updateReceiveCostLabel);
    document.getElementById('r_cost').addEventListener('input', updateReceiveCostPreview);
    document.getElementById('r_rate').addEventListener('input', updateReceiveCostPreview);
  }
  modelSel.addEventListener('change', ()=>{
    const opt = modelSel.selectedOptions[0];
    const isSerial = opt && opt.dataset.serial === 'true';
    document.getElementById('r_qtyBlock').style.display = isSerial ? 'none' : 'block';
    document.getElementById('r_serialBlock').style.display = isSerial ? 'block' : 'none';
    if(canSeeCost){
      /* ຄົງສະກຸນທີ່ເລືອກໄວ້ (ບໍ່ບັງຄັບກັບເປັນກີບ) ແລ້ວດຶງຕົ້ນທຶນທີ່ເຄີຍບັນທຶກໄວ້ຕາມສະກຸນນັ້ນມາເຕີມ */
      updateReceiveCostLabel();
    }
  });
  document.getElementById('r_addItem').addEventListener('click', async ()=>{
    const opt = modelSel.selectedOptions[0];
    if(!opt || !opt.value){ toast('ເລືອກສິນຄ້າກ່ອນ'); return; }
    const isSerial = opt.dataset.serial === 'true';
    const currency = canSeeCost ? document.getElementById('r_currency').value : 'LAK';
    const costInput = canSeeCost ? moneyValue('r_cost') : 0;
    let cost = costInput; // locked LAK unit cost, used everywhere below
    let costThb = null, exchangeRate = null;
    if(canSeeCost && currency === 'THB'){
      exchangeRate = Number((document.getElementById('r_rate').value||'').replace(/,/g,''));
      if(!exchangeRate){ toast('ໃສ່ອັດຕາແລກປ່ຽນ (1 ບາດ = ? ກີບ)'); return; }
      costThb = costInput;
      cost = costThb * exchangeRate; // ລ໋ອກເປັນກີບຕາມອັດຕາມື້ນີ້
    }
    let addedCount = 0;
    if(isSerial){
      const rawSerials = document.getElementById('r_serials').value.split('\n').map(s=>s.trim()).filter(Boolean);
      if(!rawSerials.length){ toast('ໃສ່ເລກເຄື່ອງຢ່າງໜ້ອຍ 1 ຕົວ'); return; }

      /* ກັນເລກເຄື່ອງຊ້ຳກັນເອງໃນລາຍການທີ່ພິມ/ວາງເຂົ້າມາຄັ້ງນີ້ */
      const seen = new Set();
      const dupInInput = [];
      const serials = [];
      rawSerials.forEach(sn=>{
        const key = sn.toUpperCase();
        if(seen.has(key)){ dupInInput.push(sn); } else { seen.add(key); serials.push(sn); }
      });
      if(dupInInput.length){ toast(`ເລກເຄື່ອງຊ້ຳກັນເອງ: ${[...new Set(dupInInput)].join(', ')}`); return; }

      /* ກັນຊ້ຳກັບລາຍການທີ່ຄ້າງຢູ່ໃນກະຕ່າ (ຍັງບໍ່ທັນບັນທຶກຮັບເຂົ້າ) */
      const cartSerials = new Set(receiveCart.filter(i=>i.serial_no).map(i=>i.serial_no.toUpperCase()));
      const dupInCart = serials.filter(sn=> cartSerials.has(sn.toUpperCase()));
      if(dupInCart.length){ toast(`ເລກເຄື່ອງນີ້ຢູ່ໃນລາຍການແລ້ວ: ${dupInCart.join(', ')}`); return; }

      /* ກັນຊ້ຳກັບເລກເຄື່ອງທີ່ມີຢູ່ແລ້ວໃນລະບົບ (ຮັບເຂົ້າໄປແລ້ວກ່ອນໜ້ານີ້ ບໍ່ວ່າຈະຄົງຄັງ ຫຼື ຂາຍໄປແລ້ວ) */
      try{
        const list = serials.map(sn=> encodeURIComponent(sn)).join(',');
        const existing = await sb(`stock_product_units?select=serial_no&serial_no=in.(${list})`);
        if(existing.length){
          toast(`ເລກເຄື່ອງນີ້ມີໃນລະບົບແລ້ວ: ${existing.map(e=>e.serial_no).join(', ')}`);
          return;
        }
      }catch(err){ toast('ກວດເລກເຄື່ອງຊ້ຳບໍ່ໄດ້: '+err.message); return; }

      serials.forEach(sn=>{
        receiveCart.push({ model_id: opt.value, model_name: opt.textContent, serial_no: sn, quantity:1, unit_cost:cost, amount:cost, cost_currency:currency, unit_cost_thb:costThb, exchange_rate:exchangeRate });
      });
      addedCount = serials.length;
      document.getElementById('r_serials').value = '';
    } else {
      const qty = Number(document.getElementById('r_qty').value)||1;
      receiveCart.push({ model_id: opt.value, model_name: opt.textContent, serial_no:null, quantity:qty, unit_cost:cost, amount: qty*cost, cost_currency:currency, unit_cost_thb:costThb, exchange_rate:exchangeRate });
      addedCount = qty;
    }
    document.getElementById('r_cartList').innerHTML = renderReceiveCart();
    const totalEl = main.querySelector('.invoice-total');
    if(totalEl) totalEl.textContent = 'ລວມ: ' + fmtMoney(receiveCart.reduce((s,i)=>s+i.amount,0));
    const countEl = document.getElementById('r_count');
    if(countEl) countEl.textContent = receiveCartCountText();
    bindReceiveCartRemove();
    toast(`ເພີ່ມ ${opt.textContent} ແລ້ວ (ລວມ ${receiveCartCountText()})`);
  });
  /* Enter ในแต่ละช่อง = ไล่ลงช่องถัดไปตามลำดับจริงในฟอร์ม (เลขเครื่อง/จำนวน → สกุลເງິນ → ต้นทุน → อัตราแลกเปลี่ยน[ถ้าเป็นบาท]) พอถึงช่องสุดท้ายค่อยเพิ่มเข้ารายการ แล้วต้องกดปุ่ม "บันทึกรับเข้า" (r_submit) เองเสมอ เพื่อกันบันทึกค้างๆ โดยไม่ตั้งใจ */
  function handleReceiveEnter(){
    document.getElementById('r_addItem').click();
  }
  /* หลังเพิ่มเข้ารายการแล้ว โฟกัสกลับไปช่องที่เหมาะสมเพื่อพิมพ์/สแกนตัวถัดไปได้ทันที */
  function focusBackAfterAdd(){
    const serialBlock = document.getElementById('r_serialBlock');
    const isSerialVisible = serialBlock && serialBlock.style.display !== 'none';
    if(isSerialVisible){
      const serialsEl = document.getElementById('r_serials');
      if(serialsEl) serialsEl.focus();
    } else {
      const qtyEl = document.getElementById('r_qty');
      if(qtyEl) qtyEl.focus();
    }
  }
  /* ลำดับช่องจริงของฟอร์ม ณ ขณะนั้น (ขึ้นกับว่ามีเลขเครื่องไหม / เห็นต้นทุนไหม / เลือกสกุลบาทไหม) */
  function getReceiveFieldChain(){
    const canSeeCost2 = currentRole === 'admin';
    const serialBlock = document.getElementById('r_serialBlock');
    const isSerialVisible = serialBlock && serialBlock.style.display !== 'none';
    const chain = [isSerialVisible ? 'r_serials' : 'r_qty'];
    if(canSeeCost2){
      chain.push('r_currency', 'r_cost');
      const currencyEl = document.getElementById('r_currency');
      if(currencyEl && currencyEl.value === 'THB') chain.push('r_rate');
    }
    return chain;
  }
  function focusReceiveField(id){
    const el = document.getElementById(id);
    if(!el) return;
    el.focus();
    if(el.select) el.select();
  }
  /* กด Enter จากช่อง id นี้ → ถ้ายังไม่ใช่ช่องสุดท้ายในลำดับ ให้ลงไปช่องถัดไป, ถ้าเป็นช่องสุดท้ายแล้วให้เพิ่มเข้ารายการเลย */
  function handleReceiveFieldEnter(currentId){
    const chain = getReceiveFieldChain();
    const idx = chain.indexOf(currentId);
    if(idx === -1) return;
    if(idx < chain.length - 1){
      focusReceiveField(chain[idx+1]);
    } else {
      handleReceiveEnter();
      focusBackAfterAdd();
    }
  }
  ['r_qty','r_currency','r_cost','r_rate'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); handleReceiveFieldEnter(id); }
    });
  });
  bindEnterAdvance(['r_supplier','r_date'], 'r_model_search');
  document.getElementById('r_serials').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      e.preventDefault();
      const val = e.target.value.trim();
      if(!val){
        /* ไม่มีเลขเครื่องเหลือให้เพิ่มแล้ว = พิมพ์เสร็จหมดแล้ว กด Enter ครั้งนี้จึงบันทึกเข้าระบบทั้งใบ */
        document.getElementById('r_submit').click();
      } else {
        /* พิมพ์เลขเครื่องแล้วกด Enter ครั้งแรก = ไล่ลงช่องถัดไปตามลำดับจริง (สกุลเงิน → ต้นทุน → อัตราแลกเปลี่ยน → เพิ่มเข้ารายการ) */
        handleReceiveFieldEnter('r_serials');
      }
    }
  });
  bindReceiveCartRemove();
  document.getElementById('r_submit').addEventListener('click', async (e)=>{
    if(!receiveCart.length){ toast('ຍັງບໍ່ມີລາຍການ'); return; }
    const btn = e.currentTarget;
    if(btn.disabled) return; // กันกดซ้ำระหว่างกำลังบันทึก
    btn.disabled = true;
    try{
      const receiptId = uid();
      const total = receiveCart.reduce((s,i)=>s+i.amount,0);
      const receiptNo = await nextReceiptNo();
      await sb('stock_purchase_receipts', { method:'POST', body:{
        id: receiptId,
        receipt_no: receiptNo,
        supplier_name: document.getElementById('r_supplier').value.trim(),
        receipt_date: document.getElementById('r_date').value || todayStr(),
        total_amount: total,
        created_by: currentUsername
      }});
      /* ບັນທຶກທັງໝົດເປັນຊຸດ (bulk) ແທນທີລະລາຍການ: ສ້າງເລກເຄື່ອງ (unit) ກ່ອນ (ຖ້າມີ) ເພາະ movement ຕ້ອງອ້າງອີງ unit ທີ່ມີແລ້ວ ຈາກນັ້ນບັນທຶກລາຍການ/ການເຄື່ອນໄຫວ/ຕົ້ນທຶນພ້ອມກັນ */
      const receiptDate = document.getElementById('r_date').value || todayStr();
      const unitsBody = receiveCart.filter(item=> item.serial_no).map(item=> ({
        id: uid(), model_id: item.model_id, serial_no: item.serial_no, status:'in_stock',
        received_at: receiptDate, cost_lak: item.unit_cost
      }));
      if(unitsBody.length) await sb('stock_product_units', { method:'POST', body: unitsBody });
      const unitIdBySerial = {};
      unitsBody.forEach(u=> unitIdBySerial[u.serial_no] = u.id);
      const receiptItemsBody = receiveCart.map(item=> ({
        id: uid(), receipt_id: receiptId, model_id: item.model_id, serial_no: item.serial_no,
        quantity: item.quantity, unit_cost: item.unit_cost, amount: item.amount,
        cost_currency: item.cost_currency||'LAK', unit_cost_thb: item.unit_cost_thb, exchange_rate: item.exchange_rate
      }));
      const movementsBody = receiveCart.map(item=> ({
        id: uid(), model_id: item.model_id, unit_id: item.serial_no ? unitIdBySerial[item.serial_no] : null, movement_type:'in',
        quantity: item.quantity, ref_type:'purchase', ref_id: receiptId, created_by: currentUsername
      }));
      /* ອັບເດດຕົ້ນທຶນອ້າງອິງຂອງແຕ່ລະຮຸ່ນສິນຄ້າ (ໜຶ່ງຄຳຂໍຕໍ່ 1 ຮຸ່ນ ເຖິງຈະມີຫຼາຍລາຍການຂອງຮຸ່ນດຽວກັນ) */
      const costPatchByModel = {};
      if(currentRole==='admin'){
        receiveCart.forEach(item=> {
          const patch = costPatchByModel[item.model_id] || (costPatchByModel[item.model_id] = {});
          patch.cost_price = item.unit_cost; /* ຕົ້ນທຶນກີບ (ລ໋ອກຕາມອັດຕາມື້ນີ້) */
          /* ຖ້າຊື້ເປັນບາດ ໃຫ້ຈື່ຕົ້ນທຶນບາດທີ່ຫາກໍຊື້ໄວ້ນຳ ເພື່ອຄັ້ງໜ້າຊື້ຮຸ່ນເກົ່າຈະດຶງມາເຕີມໃຫ້ອັດຕະໂນມັດ */
          if(item.cost_currency === 'THB' && item.unit_cost_thb){
            patch.cost_price_thb = item.unit_cost_thb;
          }
        });
      }
      await Promise.all([
        sb('stock_purchase_receipt_items', { method:'POST', body: receiptItemsBody }),
        sb('stock_movements', { method:'POST', body: movementsBody }),
        ...Object.entries(costPatchByModel).map(([modelId, patch])=>
          sb(`stock_product_models?id=eq.${modelId}`, { method:'PATCH', body: patch }))
      ]);
      toast(`ຮັບເຂົ້າສະຕັອກສຳເລັດ · ${receiptNo}`);
      receiveCart = [];
      tabDrafts.receive = {};
      renderTab();
    }catch(err){ toast('ຜິດພາດ: '+err.message); btn.disabled = false; }
  });
}
/* ຂໍ້ຄວາມສະຫຼຸບຈຳນວນລາຍການທີ່ຈະຮັບເຂົ້າ: ນັບຈຳນວນແຖວ (ລາຍການ) ແລະ ຈຳນວນໜ່ວຍລວມ ຖ້າບໍ່ເທົ່າກັນ */
function receiveCartCountText(){
  const lines = receiveCart.length;
  if(!lines) return '';
  const units = receiveCart.reduce((s,i)=>s+(Number(i.quantity)||0),0);
  return units !== lines ? `${lines} ລາຍການ · ${units} ໜ່ວຍ` : `${lines} ລາຍການ`;
}
function renderReceiveCart(){
  if(!receiveCart.length) return '<div class="empty">ຍັງບໍ່ມີລາຍການ</div>';
  const canSeeCost = currentRole === 'admin';
  /* ຮຽງລຳດັບ 1, 2, 3 ... ໃຫ້ ບໍ່ຕ້ອງນັບເອງ */
  return receiveCart.map((it,idx)=> `
    <div class="cart-item">
      <span><span class="rcv-seq mono">${idx+1}.</span> ${it.model_name}${it.serial_no?(' · '+it.serial_no):(' × '+it.quantity)}${it.cost_currency==='THB' ? ' <span class="muted" style="font-size:11px;">(ຊື້ ' + fmtMoney(it.unit_cost_thb) + ' ບາດ @' + it.exchange_rate + ')</span>' : ''}</span>
      <span>${canSeeCost ? fmtMoney(it.amount)+' ກີບ ' : ''}<span class="x" data-idx="${idx}">✕</span></span>
    </div>`).join('');
}
function bindReceiveCartRemove(){
  document.querySelectorAll('#r_cartList .x').forEach(el=>{
    el.addEventListener('click', ()=>{
      receiveCart.splice(Number(el.dataset.idx),1);
      renderTab();
    });
  });
}

/* ປະຫວັດການຮັບເຂົ້າ (ເບິ່ງຍ້ອນຫຼັງລາຍເດືອນ) */
async function getPurchaseReceipts(start, end){
  /* receipt_no ເປັນ text ("RCV-9","RCV-10") ຖ້າຮຽງແບບ text ຈະໄດ້ RCV-9 ກ່ອນ RCV-10 (ຍ້ອນ '9'>'1')
     ຈຶ່ງດຶງມາແລ້ວຮຽງເອງ: ວັນທີໃໝ່ກ່ອນ ຕໍ່ດ້ວຍເລກໃບຫຼາຍກ່ອນ (ຕົວເລກແທ້ ບໍ່ແມ່ນ text) */
  const rows = await sb(`stock_purchase_receipts?select=*&receipt_date=gte.${start}&receipt_date=lt.${end}`);
  const rcvNum = r=>{ const m = String(r.receipt_no||'').match(/(\d+)/); return m ? Number(m[1]) : 0; };
  return rows.sort((a,b)=> a.receipt_date < b.receipt_date ? 1 : a.receipt_date > b.receipt_date ? -1 : rcvNum(b)-rcvNum(a));
}
async function getPurchaseReceiptItems(receiptId){
  return await sb(`stock_purchase_receipt_items?select=*,stock_product_models(name,unit)&receipt_id=eq.${receiptId}`);
}
async function loadReceiveHistory(month){
  const el = document.getElementById('rcv_history');
  if(!el) return;
  const canSeeCost = currentRole === 'admin';
  try{
    const start = month + '-01';
    const endDate = new Date(start); endDate.setMonth(endDate.getMonth()+1);
    const end = endDate.toISOString().slice(0,10);
    const receipts = await getPurchaseReceipts(start, end);
    el.innerHTML = `
      ${canSeeCost && receipts.length ? `
        <div class="row" style="padding:6px 0;">
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);margin:0;">
            <input type="checkbox" id="rcv_selectAll" style="width:17px;height:17px;margin:0;">ເລືອກທັງໝົດ
          </label>
          <button class="btn danger" id="rcv_deleteSelected" style="display:none;padding:6px 12px;font-size:12px;"><svg class="dv-icon"><use href="#i-trash"></use></svg>ລົບທີ່ເລືອກ (<span id="rcv_selectedCount">0</span>)</button>
        </div>
      ` : ''}
      ${receipts.length ? receipts.map(r=> `
      <div class="row clickable" data-rcv="${r.id}">
        <span style="display:flex;align-items:center;gap:10px;">
          ${canSeeCost ? `<input type="checkbox" class="rcv-check" value="${r.id}" style="width:17px;height:17px;flex:none;margin:0;" onclick="event.stopPropagation()">` : ''}
          <span>
            <div class="mono">${r.receipt_no || '-'} <span style="font-family:var(--font-body);">${r.supplier_name ? '· '+r.supplier_name : ''}</span></div>
            <div class="muted" style="font-size:11px;">${fmtDateDMY(r.receipt_date)}</div>
          </span>
        </span>
        ${canSeeCost ? `<span class="gold mono">${fmtMoney(r.total_amount)}</span>` : ''}
      </div>`).join('') : '<div class="empty">ບໍ່ມີການຮັບເຂົ້າໃນເດືອນນີ້</div>'}`;
    el.querySelectorAll('.row[data-rcv]').forEach(row=>{
      row.addEventListener('click', (e)=>{
        if(e.target.closest('.rcv-check')) return;
        openReceiptDetail(row.dataset.rcv, receipts.find(r=>r.id===row.dataset.rcv));
      });
    });
    if(canSeeCost && receipts.length){
      const selectAllEl = document.getElementById('rcv_selectAll');
      const deleteBtn = document.getElementById('rcv_deleteSelected');
      const countEl = document.getElementById('rcv_selectedCount');
      const checks = ()=> Array.from(el.querySelectorAll('.rcv-check'));
      function refreshSelection(){
        const selected = checks().filter(c=> c.checked);
        countEl.textContent = selected.length;
        deleteBtn.style.display = selected.length ? 'inline-flex' : 'none';
        selectAllEl.checked = selected.length === checks().length;
      }
      selectAllEl.addEventListener('change', ()=>{
        checks().forEach(c=> c.checked = selectAllEl.checked);
        refreshSelection();
      });
      checks().forEach(c=> c.addEventListener('change', refreshSelection));
      deleteBtn.addEventListener('click', async ()=>{
        const ids = checks().filter(c=> c.checked).map(c=> c.value);
        if(!ids.length) return;
        if(!await confirmDelete(`ລົບການຮັບເຂົ້າ ${ids.length} ໃບທີ່ເລືອກ?`, 'ສະຕັອກທີ່ຮັບເຂົ້າຈະຖືກຫັກຄືນທັງໝົດ')) return;
        if(deleteBtn.disabled) return;
        deleteBtn.disabled = true;
        try{
          await bulkVoidReceipts(ids);
          toast(`ລົບການຮັບເຂົ້າສຳເລັດ ${ids.length} ໃບ ຄືນສະຕັອກແລ້ວ`);
          renderTab();
        }catch(err){
          toast('ລົບບໍ່ໄດ້: ອາດມີສິນຄ້າຈາກໃບໃດໜຶ່ງທີ່ເລືອກຖືກຂາຍ/ໂອນໄປແລ້ວ — ລອງຍົກເລີກການເລືອກໃບນັ້ນແລ້ວລົບໃໝ່');
          deleteBtn.disabled = false;
        }
      });
    }
  }catch(err){
    el.innerHTML = `<div class="empty">ຜິດພາດ: ${err.message}</div>`;
  }
}
async function openReceiptDetail(receiptId, receipt){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><div class="empty">ກຳລັງໂຫລດ...</div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click', (e)=>{ if(e.target === bg) bg.remove(); });
  const canSeeCost = currentRole === 'admin';
  try{
    const items = await getPurchaseReceiptItems(receiptId);
    bg.querySelector('.modal').innerHTML = `
      <h3><svg class="dv-icon"><use href="#i-truck"></use></svg><span class="mono">${receipt.receipt_no || 'ການຮັບເຂົ້າ'}</span></h3>
      <div class="muted" style="font-size:12px;margin-bottom:8px;">
        ${receipt.supplier_name ? 'ຈາກ: '+receipt.supplier_name+'<br>' : ''}${fmtDateDMY(receipt.receipt_date)}<br>
        <svg class="dv-icon" style="width:12px;height:12px;vertical-align:-1px;"><use href="#i-users"></use></svg> ຮັບເຂົ້າໂດຍ: <span style="color:var(--ink);font-weight:600;">${receipt.created_by || '-'}</span>
      </div>
      <hr class="sep">
      ${items.length ? items.map(it=> `
        <div class="row">
          <span>${it.stock_product_models ? it.stock_product_models.name : '-'}${it.serial_no ? (' · <span class="mono">'+it.serial_no+'</span>') : (' × '+it.quantity)}</span>
          ${canSeeCost ? `<span class="mono">${fmtMoney(it.amount)}</span>` : ''}
        </div>`).join('') : '<div class="empty">ບໍ່ມີລາຍລະອຽດ</div>'}
      ${canSeeCost ? `<div class="invoice-total mono">ລວມ: ${fmtMoney(receipt.total_amount)}</div>` : ''}
      ${currentRole==='admin' ? `<button class="btn" id="rcvEditCostBtn" style="margin-top:16px;"><svg class="dv-icon"><use href="#i-pencil"></use></svg>ໃສ່/ແກ້ໄຂຕົ້ນທຶນ</button>` : ''}
      ${currentRole==='admin' ? `<button class="btn danger" id="rcvDeleteBtn" style="margin-top:10px;"><svg class="dv-icon"><use href="#i-trash"></use></svg>ລົບການຮັບເຂົ້ານີ້ (ຄືນສະຕັອກ)</button>` : ''}
      <button class="btn secondary" id="rcvDetailClose">ປິດ</button>
    `;
    if(currentRole==='admin'){
      bg.querySelector('#rcvEditCostBtn').addEventListener('click', ()=>{
        openReceiptCostEditor(bg, receiptId, receipt, items);
      });
      bg.querySelector('#rcvDeleteBtn').addEventListener('click', async ()=>{
        if(!await confirmDelete(`ລົບການຮັບເຂົ້າ ${receipt.receipt_no || ''} ?`, 'ສະຕັອກທີ່ຮັບເຂົ້າຄັ້ງນີ້ຈະຖືກຫັກຄືນ')) return;
        try{
          await voidReceipt(receiptId);
          toast('ລົບການຮັບເຂົ້າສຳເລັດ ຄືນສະຕັອກແລ້ວ');
          bg.remove();
          renderTab();
        }catch(err){
          toast('ລົບບໍ່ໄດ້ (ອາດມີສິນຄ້າຈາກຄັ້ງນີ້ຖືກຂາຍໄປແລ້ວ) — ລົບ/ຍົກເລີກບິນຂາຍທີ່ກ່ຽວຂ້ອງກ່ອນ');
        }
      });
    }
    bg.querySelector('#rcvDetailClose').addEventListener('click', ()=> bg.remove());
  }catch(err){
    bg.querySelector('.modal').innerHTML = `<div class="empty">ຜິດພາດ: ${err.message}</div><button class="btn secondary" id="rcvDetailClose2">ປິດ</button>`;
    bg.querySelector('#rcvDetailClose2').addEventListener('click', ()=> bg.remove());

}
/* ໃສ່/ແກ້ໄຂຕົ້ນທຶນຫຼັງຮັບເຂົ້າ (ສຳລັບກໍລະນີພະນັກງານຮັບເຂົ້າມາໂດຍຍັງບໍ່ໃສ່ຕົ້ນທຶນ ແອດມິນມາໃສ່ທີ່ຫຼັງ)
   ອັບເດດ: 1) ລາຍການຮັບເຂົ້າ (unit_cost/amount/ສະກຸນ) 2) ຕົ້ນທຶນ cost_lak ຂອງໜ່ວຍທີ່ມີເລກເຄື່ອງ
   3) ຍອດລວມຂອງໃບຮັບເຂົ້າ 4) ຕົ້ນທຶນອ້າງອິງຂອງຮຸ່ນສິນຄ້າ (ໃຫ້ຄັ້ງໜ້າດຶງມາເຕີມ) */
async function openReceiptCostEditor(bg, receiptId, receipt, items){
  bg.querySelector('.modal').innerHTML = `
    <h3><svg class="dv-icon"><use href="#i-pencil"></use></svg>ໃສ່/ແກ້ໄຂຕົ້ນທຶນ · <span class="mono">${receipt.receipt_no||''}</span></h3>
    <div class="muted" style="font-size:12px;margin-bottom:8px;">ໃສ່ຕົ້ນທຶນຕໍ່ໜ່ວຍຂອງແຕ່ລະລາຍການ. ຖ້າຊື້ເປັນເງິນບາດ ໃຫ້ປ່ຽນສະກຸນເປັນ ບາດ ແລ້ວໃສ່ອັດຕາແລກປ່ຽນ.</div>
    <hr class="sep">
    ${items.map((it, idx)=> {
      const isThb = it.cost_currency === 'THB';
      const initCost = isThb ? (it.unit_cost_thb||0) : (it.unit_cost||0);
      const label = (it.stock_product_models ? it.stock_product_models.name : '-') + (it.serial_no ? (' · '+it.serial_no) : (' × '+it.quantity));
      return `
      <div style="padding:8px 0;border-bottom:1px solid var(--line);">
        <div style="font-weight:600;font-size:13px;margin-bottom:6px;">${idx+1}. ${label}</div>
        <div class="grid2">
          <div>
            <label style="font-size:11px;" id="ec_cost_lbl_${idx}">ຕົ້ນທຶນ/ໜ່ວຍ (${isThb?'ບາດ':'ກີບ'})</label>
            <input id="ec_cost_${idx}" type="text" value="${Number(initCost).toLocaleString('en-US').replace(/,/g,'.')}">
          </div>
          <div>
            <label style="font-size:11px;">ສະກຸນ</label>
            <select id="ec_cur_${idx}">
              <option value="LAK" ${isThb?'':'selected'}>ກີບ (LAK)</option>
              <option value="THB" ${isThb?'selected':''}>ບາດ (THB)</option>
            </select>
          </div>
        </div>
        <div id="ec_rateBlock_${idx}" style="display:${isThb?'block':'none'};margin-top:6px;">
          <label style="font-size:11px;">ອັດຕາແລກປ່ຽນ (1 ບາດ = ? ກີບ)</label>
          <input id="ec_rate_${idx}" type="text" value="${it.exchange_rate||''}">
          <div class="muted" id="ec_preview_${idx}" style="font-size:11px;margin-top:3px;"></div>
        </div>
      </div>`;
    }).join('')}
    <button class="btn" id="ec_save" style="margin-top:16px;"><svg class="dv-icon"><use href="#i-check-circle"></use></svg>ບັນທຶກຕົ້ນທຶນ</button>
    <button class="btn secondary" id="ec_cancel">ຍົກເລີກ</button>
  `;
  items.forEach((it, idx)=>{
    attachMoneyInput('ec_cost_'+idx, undefined);
    const curSel = document.getElementById('ec_cur_'+idx);
    const rateBlock = document.getElementById('ec_rateBlock_'+idx);
    const costLbl = document.getElementById('ec_cost_lbl_'+idx);
    const preview = ()=>{
      const p = document.getElementById('ec_preview_'+idx);
      if(!p) return;
      const cost = moneyValue('ec_cost_'+idx);
      const rate = Number((document.getElementById('ec_rate_'+idx).value||'').replace(/[^\d.]/g,''));
      if(cost && rate) p.textContent = `≈ ${fmtMoney(cost*rate)} ກີບ/ໜ່ວຍ (ລ໋ອກຕົ້ນທຶນນີ້ໄວ້)`;
      else p.textContent = 'ໃສ່ອັດຕາແລກປ່ຽນເພື່ອລ໋ອກຕົ້ນທຶນເປັນກີບ';
    };
    curSel.addEventListener('change', ()=>{
      const thb = curSel.value === 'THB';
      rateBlock.style.display = thb ? 'block' : 'none';
      costLbl.textContent = thb ? 'ຕົ້ນທຶນ/ໜ່ວຍ (ບາດ)' : 'ຕົ້ນທຶນ/ໜ່ວຍ (ກີບ)';
      preview();
    });
    document.getElementById('ec_cost_'+idx).addEventListener('input', preview);
    document.getElementById('ec_rate_'+idx).addEventListener('input', preview);
  });
  document.getElementById('ec_cancel').addEventListener('click', ()=>{ bg.remove(); openReceiptDetail(receiptId, receipt); });
  document.getElementById('ec_save').addEventListener('click', async ()=>{
    const saveBtn = document.getElementById('ec_save');
    /* ຄິດຄ່າແຕ່ລະລາຍການກ່ອນ (ກວດອັດຕາແລກປ່ຽນ) — ຖ້າຜິດ ໃຫ້ຢຸດ ບໍ່ບັນທຶກຄ້າງໆ */
    const computed = [];
    for(let idx=0; idx<items.length; idx++){
      const it = items[idx];
      const currency = document.getElementById('ec_cur_'+idx).value;
      const input = moneyValue('ec_cost_'+idx);
      let unitCost = input, unitCostThb = null, exchangeRate = null;
      if(currency === 'THB'){
        exchangeRate = Number((document.getElementById('ec_rate_'+idx).value||'').replace(/[^\d.]/g,''));
        if(!exchangeRate){ toast(`ລາຍການທີ ${idx+1}: ໃສ່ອັດຕາແລກປ່ຽນ (1 ບາດ = ? ກີບ)`); return; }
        unitCostThb = input;
        unitCost = Math.round(input * exchangeRate); /* ລ໋ອກເປັນກີບ */
      }
      computed.push({ it, currency, unitCost, unitCostThb, exchangeRate, amount: unitCost * Number(it.quantity||1) });
    }
    saveBtn.disabled = true;
    saveBtn.textContent = 'ກຳລັງບັນທຶກ...';
    try{
      const reqs = [];
      const costPatchByModel = {};
      const totalAmount = computed.reduce((s,c)=> s + c.amount, 0);
      for(const c of computed){
        reqs.push(sb(`stock_purchase_receipt_items?id=eq.${c.it.id}`, { method:'PATCH', body:{
          unit_cost: c.unitCost, amount: c.amount, cost_currency: c.currency,
          unit_cost_thb: c.unitCostThb, exchange_rate: c.exchangeRate
        }}));
        /* ໜ່ວຍທີ່ມີເລກເຄື່ອງ: ອັບເດດ cost_lak ໃຫ້ກົງ (ໃຊ້ໃນການຄິດກຳໄລ) */
        if(c.it.serial_no){
          reqs.push(sb(`stock_product_units?serial_no=eq.${encodeURIComponent(c.it.serial_no)}&model_id=eq.${c.it.model_id}`, {
            method:'PATCH', body:{ cost_lak: c.unitCost }
          }));
        }
        /* ຕົ້ນທຶນອ້າງອິງຂອງຮຸ່ນ (ໜຶ່ງຄຳຂໍຕໍ່ 1 ຮຸ່ນ) */
        const patch = costPatchByModel[c.it.model_id] || (costPatchByModel[c.it.model_id] = {});
        patch.cost_price = c.unitCost;
        if(c.currency === 'THB' && c.unitCostThb) patch.cost_price_thb = c.unitCostThb;
      }
      reqs.push(sb(`stock_purchase_receipts?id=eq.${receiptId}`, { method:'PATCH', body:{ total_amount: totalAmount } }));
      for(const [modelId, patch] of Object.entries(costPatchByModel)){
        reqs.push(sb(`stock_product_models?id=eq.${modelId}`, { method:'PATCH', body: patch }));
      }
      await Promise.all(reqs);
      receipt.total_amount = totalAmount;
      toast('ບັນທຶກຕົ້ນທຶນສຳເລັດ');
      bg.remove();
      openReceiptDetail(receiptId, receipt);
      const monthEl = document.getElementById('rcv_month');
      if(monthEl) loadReceiveHistory(monthEl.value);
    }catch(err){
      toast('ບັນທຶກບໍ່ໄດ້: ' + err.message);
      saveBtn.disabled = false;
      saveBtn.textContent = 'ບັນທຶກຕົ້ນທຶນ';
    }
  });
}
/* ລົບການຮັບເຂົ້າ: ຖ້າມີເລກເຄື່ອງທີ່ຂາຍໄປແລ້ວຈາກຄັ້ງນີ້ ຈະລົບບໍ່ໄດ້ (unit ຈະຕິດ FK ກັບບິນຂາຍ) */
async function voidReceipt(receiptId){
  const movements = await sb(`stock_movements?select=id,unit_id&ref_type=eq.purchase&ref_id=eq.${receiptId}`);
  await Promise.all(movements.map(mv=>{
    if(mv.unit_id){
      return sb(`stock_product_units?id=eq.${mv.unit_id}`, { method:'DELETE' });
    }
    return Promise.resolve();
  }));
  await sb(`stock_movements?ref_type=eq.purchase&ref_id=eq.${receiptId}`, { method:'DELETE' });
  await sb(`stock_purchase_receipts?id=eq.${receiptId}`, { method:'DELETE' });
}
/* ລົບໃບຮັບເຂົ້າຫຼາຍໃບພ້ອມກັນ ດ້ວຍ 4 request ລວມ (ບໍ່ວ່າຈະເລືອກຈັກໃບ) ແທນທີ່ຈະລົບເທື່ອລະໃບ (ໄວກວ່າຫຼາຍເມື່ອເລືອກຫຼາຍໆໃບ) — ຕ້ອງລົບ unit ກ່ອນ movement ຄືເກົ່າ ເພື່ອໃຫ້ FK ກວດ "ຂາຍໄປແລ້ວບໍ່ໃຫ້ລົບ" ຍັງເຮັດວຽກຄືເດີມ */
async function bulkVoidReceipts(ids){
  const idList = ids.join(',');
  const movements = await sb(`stock_movements?select=unit_id&ref_type=eq.purchase&ref_id=in.(${idList})`);
  const unitIds = [...new Set(movements.filter(m=> m.unit_id).map(m=> m.unit_id))];
  if(unitIds.length){
    await sb(`stock_product_units?id=in.(${unitIds.join(',')})`, { method:'DELETE' });
  }
  await sb(`stock_movements?ref_type=eq.purchase&ref_id=in.(${idList})`, { method:'DELETE' });
  await sb(`stock_purchase_receipts?id=in.(${idList})`, { method:'DELETE' });
}

/* ============================================================
   ຊຸດສິນຄ້າ (BUNDLE) — ສິນຄ້າທີ່ຂາຍແລ້ວມີອຸປະກອນມາພ້ອມ (ຕັດສະຕັອກໃຫ້ ບໍ່ຄິດເງິນເພີ່ມ)
   ຈັບຄູ່ດ້ວຍ "ຊື່ສິນຄ້າ" ຕ້ອງກົງກັບຊື່ໃນໜ້າສິນຄ້າ. ເພີ່ມຊຸດໃໝ່ = ເພີ່ມ 1 ວົງເລັບ { } ໃນ array
   ============================================================ */
const PRODUCT_BUNDLES = [
  { parent: 'ໂຄງ 4ເກຍ', components: [
    { name: 'ຄາດ 4ເກຍ', qty: 1 },
    { name: 'ຕີນເຫຼັກ ຊ້າຍ-ຂວາ', qty: 1 },
    { name: 'ແກັດອຸປະກອນ', qty: 1 },
  ]},
];
const BUNDLE_TAG = 'ຢູ່ໃນຊຸດ'; /* ໝາຍໃນ variant_note ບອກວ່າລາຍການນີ້ເປັນອຸປະກອນທີ່ແຖມມາໃນຊຸດ (ບໍ່ຄິດເງິນ) */
function findBundleForModel(model){
  if(!model) return null;
  const name = (model.name||'').trim();
  return PRODUCT_BUNDLES.find(b=> b.parent.trim() === name) || null;
}

let sellCart = [];
let sellPayments = [];
/* ບໍ່ null = ກຳລັງແກ້ໄຂບິນເກົ່າ (ບໍ່ແມ່ນອອກບິນໃໝ່): { id, inv, originalItems } */
let editingInvoice = null;
/* ແປງລາຍການສິນຄ້າຈາກ DB ໃຫ້ຢູ່ໃນຮູບແບບຂອງ sellCart ເພື່ອໃສ່ຄືນຕອນແກ້ໄຂ */
function invoiceItemsToCart(items){
  return (items||[]).map(it=> ({
    model_id: it.model_id,
    model_name: it.stock_product_models ? it.stock_product_models.name : '-',
    unit_id: it.unit_id,
    variant_note: it.variant_note,
    quantity: it.quantity,
    unit_price: it.unit_price,
    amount: it.amount,
    groupId: null, bundleParent: false,
    bundleComponent: it.variant_note === BUNDLE_TAG
  }));
}
/* ເລີ່ມແກ້ໄຂບິນເກົ່າ: ໃສ່ຂໍ້ມູນລູກຄ້າ/ລາຍການ/ການຈ່າຍ ຄືນເຂົ້າຟອມອອກບິນ ແລ້ວໄປແທັບ "ອອກບິນຂາຍ" */
function startInvoiceEdit(invoiceId, inv, items, payments){
  editingInvoice = { id: invoiceId, inv, originalItems: items || [] };
  sellCart = invoiceItemsToCart(items);
  sellPayments = (payments||[]).map(p=> ({
    method: p.method, currency: p.currency, amount: Number(p.amount)||0,
    exchange_rate: p.exchange_rate, converted_amount: Number(p.converted_amount)||0
  }));
  tabDrafts.sell = {};
  activeTab = 'sell';
  buildNav();
  renderTab();
}

      if(!uOpt || !uOpt.value){ toast('ບໍ່ມີໜ່ວຍໃນສະຕັອກ'); return; }
      sellCart.push({ model_id: opt.value, model_name: opt.textContent, unit_id: uOpt.value,
        variant_note: uOpt.dataset.serial, quantity:1, unit_price: price, amount: price,
        groupId, bundleParent: !!bundle });
    } else {
      parentQty = Number(document.getElementById('s_qty').value)||1;
      sellCart.push({ model_id: opt.value, model_name: opt.textContent, unit_id:null,
        variant_note:null, quantity: parentQty, unit_price: price, amount: parentQty*price,
        groupId, bundleParent: !!bundle });
    }
    /* ຖ້າສິນຄ້ານີ້ເປັນ "ຊຸດ" ໃຫ້ເພີ່ມອຸປະກອນທີ່ມາພ້ອມເຂົ້າໄປອັດຕະໂນມັດ: ຕັດສະຕັອກ + ໂຊວ໌ໃນບິນ + ບໍ່ຄິດເງິນ (amount 0) */
    if(bundle){
      const billCur = document.getElementById('s_currency').value;
      const missing = [];
      bundle.components.forEach(c=>{
        const cm = models.find(m=> (m.name||'').trim() === c.name.trim());
        if(!cm){ missing.push(c.name); return; }
        const dispPrice = billCur === 'THB' ? Number(cm.sale_price_thb||0) : Number(cm.sale_price||0);
        sellCart.push({ model_id: cm.id, model_name: cm.name, unit_id:null,
          variant_note: BUNDLE_TAG, quantity: (c.qty||1) * parentQty, unit_price: dispPrice, amount: 0,
          groupId, bundleComponent: true });
      });
      if(missing.length) toast('ຫາອຸປະກອນໃນຊຸດບໍ່ພົບ (ກວດຊື່ໃນໜ້າສິນຄ້າ): ' + missing.join(', '));
    }
    document.getElementById('s_cartList').innerHTML = renderSellCart();
    bindSellCartRemove();
    updateSellTotals();
    toast(`ເພີ່ມ ${opt.textContent} ເຂົ້າບິນແລ້ວ`);
  });
  bindEnterKey(['s_qty','s_price'], 's_addItem');
  document.getElementById('s_discount').addEventListener('input', updateSellTotals);
  bindEnterAdvance(['s_name','s_phone','s_village','s_district','s_province'], 's_model_search');
  bindSellCartRemove();
  /* ປຸ່ມ ເງິນສົດ / ໂອນ ຕັ້ງຄ່າໃສ່ select ທີ່ເຊື່ອງໄວ້ ໂຄ້ດທີ່ອ່ານ s_pay_method.value ຈຶ່ງບໍ່ຕ້ອງແກ້ */
  const payChips = document.getElementById('s_pay_methodChips');
  payChips.addEventListener('click', (e)=>{
    const b = e.target.closest('button[data-method]');
    if(!b) return;
    document.getElementById('s_pay_method').value = b.dataset.method;
    payChips.querySelectorAll('button').forEach(x=> x.setAttribute('aria-pressed', String(x === b)));
  });

  /* ຍອດທີ່ຍັງຄ້າງ (ສະກຸນຂອງບິນ) */
  function sellRemainAmount(){
    const subtotal = sellCart.reduce((s,i)=>s+i.amount,0);
    const discount = Math.min(moneyValue('s_discount'), subtotal);
    const paid = sellPayments.reduce((s,p)=>s+p.converted_amount,0);
    return Math.max(subtotal - discount - paid, 0);
  }
  /* ປຸ່ມລັດ: ຕື່ມຍອດຄ້າງທັງໝົດໃສ່ຊ່ອງຈຳນວນ ຖ້າຈ່າຍຄົນລະສະກຸນກັບບິນ ຕ້ອງແປງກັບດ້ວຍອັດຕາກ່ອນ */
  document.getElementById('s_pay_fillRest').addEventListener('click', ()=>{
    const remain = sellRemainAmount();
    if(!remain){ toast('ບໍ່ມີຍອດຄ້າງແລ້ວ'); return; }
    const invCurrency = document.getElementById('s_currency').value;
    const payCurrency = document.getElementById('s_pay_currency').value;
    let fill = remain;
    if(payCurrency !== invCurrency){
      const rate = Number((document.getElementById('s_pay_rate').value||'').replace(/,/g,''));
      if(!rate){ toast('ໃສ່ອັດຕາແລກປ່ຽນກ່ອນ'); return; }
      fill = invCurrency === 'LAK' ? remain / rate : remain * rate;
    }
    const el = document.getElementById('s_pay_amount');
    el.value = fmtMoney(fill);
    el.dispatchEvent(new Event('input', {bubbles:true}));
  });

  /* ຄືນຄ່າ true ຖ້າເພີ່ມສຳເລັດ ໃຫ້ຜູ້ເອີ້ນຮູ້ວ່າຄວນໄປຕໍ່ ຫຼື ຢຸດ */
  function addSellPayment(){
    const amt = moneyValue('s_pay_amount');
    if(!amt){ toast('ໃສ່ຈຳນວນເງິນ'); return false; }
    const method = document.getElementById('s_pay_method').value;
    const invCurrency = document.getElementById('s_currency').value;
    const payCurrency = document.getElementById('s_pay_currency').value;
    let rate = null, convertedAmt = amt;
    if(payCurrency !== invCurrency){
      rate = Number((document.getElementById('s_pay_rate').value||'').replace(/,/g,''));
      if(!rate){ toast('ໃສ່ອັດຕາແລກປ່ຽນເພື່ອກວດຍອດຊຳລະ'); return false; }
      convertedAmt = invCurrency === 'LAK' ? amt * rate : amt / rate;
    }
    sellPayments.push({ method, currency: payCurrency, amount: amt, exchange_rate: rate, converted_amount: convertedAmt });
    document.getElementById('s_pay_amount').value = '';
    renderPaymentList();
    updateSellTotals();
    return true;
  }
  document.getElementById('s_addPayment').addEventListener('click', ()=>{
    if(addSellPayment()) toast('ເພີ່ມການຈ່າຍແລ້ວ');
  });
  /* ── ປັອບອັບຮັບເງິນ: ໃສ່ຈຳນວນແຕ່ລະສະກຸນ ແລ້ວກົດ ສົດ/ໂອນ (ຄືສາຂາເມືອງຮຸນ) ── */
  const pmBg = document.getElementById('pm_bg');
  function pmOpen(){
    if(!sellCart.length){ toast('ຍັງບໍ່ມີລາຍການ'); return; }
    pmBg.style.display = 'flex';
    updateSellTotals();
    const first = pmBg.querySelector('.pm-amt');
    if(first) setTimeout(()=> first.focus(), 60);
  }
  function pmClose(){ pmBg.style.display = 'none'; }
  document.getElementById('s_openPay').addEventListener('click', pmOpen);
  document.getElementById('pm_close').addEventListener('click', pmClose);
  /* ກົດພື້ນນອກປັອບອັບ ບໍ່ປິດ — ຕ້ອງກົດ "ກັບຄືນ" ເທົ່ານັ້ນ ກັນກົດຜິດແລ້ວຍອດຫາຍ */
  /* ໃສ່ຈຸດຫຼັກພັນໃຫ້ຊ່ອງຈຳນວນໃນປັອບອັບ ອ່ານງ່າຍ */
  pmBg.querySelectorAll('.pm-amt').forEach(el=>{
    el.addEventListener('input', ()=>{
      const n = Number((el.value||'').replace(/[^\d]/g,''));
      el.value = n ? fmtMoney(n) : '';
    });
  });
  /* ເຕີມ = ໃສ່ຍອດຄ້າງທັງໝົດຂອງສະກຸນນັ້ນ (ໃຊ້ logic ເດີມ ລວມທັງກວດອັດຕາແລກປ່ຽນ) */
  pmBg.querySelectorAll('.pm-fill').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.getElementById('s_pay_currency').value = btn.dataset.cur;
      document.getElementById('s_pay_amount').value = '';
      document.getElementById('s_pay_fillRest').click();
      const v = document.getElementById('s_pay_amount').value;
      if(v) pmBg.querySelector(`.pm-amt[data-cur="${btn.dataset.cur}"]`).value = v;
    });
  });
  /* ສົດ / ໂອນ = ເກັບເງິນຈຳນວນນັ້ນເຂົ້າບິນ ດ້ວຍຊ່ອງທາງທີ່ເລືອກ */
  pmBg.querySelectorAll('.pm-b:not(.pm-fill)').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const row = pmBg.querySelector(`.pm-amt[data-cur="${btn.dataset.cur}"]`);
      if(!row || !Number((row.value||'').replace(/[^\d]/g,''))){ toast('ໃສ່ຈຳນວນເງິນກ່ອນ'); return; }
      document.getElementById('s_pay_currency').value = btn.dataset.cur;
      document.getElementById('s_pay_method').value = btn.dataset.m;
      const amtEl = document.getElementById('s_pay_amount');
      amtEl.value = row.value;
      amtEl.dispatchEvent(new Event('input', {bubbles:true}));
      if(addSellPayment()){ row.value = ''; toast('ຮັບເງິນແລ້ວ'); }
    });
  });
  document.getElementById('s_pay_amount').addEventListener('keydown', (e)=>{
    /* ຖ້າພິມຈຳນວນເງິນໄວ້ + Enter = ເພີ່ມການຈ່າຍ, ຖ້າຊ່ອງນີ້ຍັງຫວ່າງ + Enter = ຢືນຢັນອອກບິນເລີຍ */
    if(e.key !== 'Enter') return;
    e.preventDefault();
    if(moneyValue('s_pay_amount')){ document.getElementById('s_addPayment').click(); }
    else { document.getElementById('s_submit').click(); }
  });
  /* ໂໝດແກ້ໄຂ: ໃສ່ຂໍ້ມູນລູກຄ້າ/ສະກຸນເງິນ/ສ່ວນຫຼຸດຄືນ (ລາຍການ & ການຈ່າຍ ໃສ່ຈາກ sellCart/sellPayments ແລ້ວ) */
  if(editingInvoice){
    const ei = editingInvoice.inv;
    document.getElementById('s_name').value = ei.customer_name || '';
    document.getElementById('s_phone').value = ei.customer_phone || '';
    document.getElementById('s_village').value = ei.village || '';
    document.getElementById('s_district').value = ei.district || '';
    document.getElementById('s_province').value = ei.province || '';
    document.getElementById('s_currency').value = ei.currency || 'LAK';
    syncPayCurrencyDefault();
    attachMoneyInput('s_discount', Number(ei.discount_amount||0));
    document.getElementById('s_cartList').innerHTML = renderSellCart();
    bindSellCartRemove();
    const cancelBtn = document.getElementById('s_cancelEdit');
    if(cancelBtn) cancelBtn.addEventListener('click', cancelInvoiceEdit);
  }
  renderPaymentList();
  updateSellTotals();
  document.getElementById('s_submit').addEventListener('click', async (e)=>{
    if(!sellCart.length){ toast('ຍັງບໍ່ມີລາຍການ'); return; }
    /* ພິມຈຳນວນເງິນໄວ້ແຕ່ລືມກົດ "ເພີ່ມການຈ່າຍ" — ເກັບໃຫ້ເລີຍ ຢ່າໃຫ້ຍອດຫາຍງຽບໆ
       ຖ້າເພີ່ມບໍ່ໄດ້ (ຂາດອັດຕາແລກປ່ຽນ) ຢຸດໄວ້ ຢ່າອອກບິນທັບຍອດຜິດ */
    if(moneyValue('s_pay_amount') && !addSellPayment()) return;
    const btn = e.currentTarget;
    if(btn.disabled) return; // กันกดซ้ำระหว่างกำลังบันทึก
    btn.disabled = true;
    /* ໂໝດແກ້ໄຂ: ບັນທຶກທັບບິນເກົ່າ (ຄືນສະຕັອກເກົ່າ → ຕັດໃໝ່) ແທນການອອກບິນໃໝ່ */
    if(editingInvoice){
      try{ await saveInvoiceEdit(); }
      catch(err){ toast('ຜິດພາດ: '+err.message); btn.disabled = false; }
      return;
    }
    try{
      const invoiceId = uid();
      const subtotal = sellCart.reduce((s,i)=>s+i.amount,0);
      const discount = Math.min(moneyValue('s_discount'), subtotal);
      const total = subtotal - discount;
      const paid = sellPayments.reduce((s,p)=>s+p.converted_amount,0);
      const currency = document.getElementById('s_currency').value;
      const status = paid <= 0 ? 'unpaid' : (paid >= total ? 'paid' : 'partial');
      const invNo = await nextInvoiceNo();
      await sb('sales_invoices', { method:'POST', body:{
        id: invoiceId, invoice_no: invNo,
        customer_name: document.getElementById('s_name').value.trim(),
        customer_phone: document.getElementById('s_phone').value.trim(),
        village: document.getElementById('s_village').value.trim(),
        district: document.getElementById('s_district').value.trim(),
        province: document.getElementById('s_province').value.trim(),
        invoice_date: todayStr(),
        total_amount: total,
        discount_amount: discount,
        currency,
        paid_amount: paid,
        payment_status: status,
        created_by: currentUsername
      }});
      /* ບັນທຶກລາຍການ/ການເຄື່ອນໄຫວ/ການຈ່າຍເງິນທັງໝົດເປັນຊຸດດຽວ (bulk insert) ແທນການສົ່ງທີລະລາຍການ ໃຫ້ໄວຂຶ້ນຫຼາຍ ໂດຍສະເພາະເມື່ອບິນມີຫຼາຍລາຍການ ຫຼືເນັດຊ້າ */
      const soldAt = todayStr();
      const itemsBody = sellCart.map(item=> ({
        id: uid(), invoice_id: invoiceId, model_id: item.model_id, unit_id: item.unit_id,
        variant_note: item.variant_note, quantity: item.quantity, unit_price: item.unit_price, amount: item.amount
      }));
      const movementsBody = sellCart.map(item=> ({
        id: uid(), model_id: item.model_id, unit_id: item.unit_id, movement_type:'out',
        quantity: item.quantity, ref_type:'sale', ref_id: invoiceId, created_by: currentUsername
      }));
      const soldUnitIds = sellCart.filter(item=> item.unit_id).map(item=> item.unit_id);
      const paymentsBody = sellPayments.map(p=> ({
        id: uid(), invoice_id: invoiceId, payment_date: soldAt,
        method: p.method, currency: p.currency, amount: p.amount,
        exchange_rate: p.exchange_rate, converted_amount: p.converted_amount, created_by: currentUsername
      }));
      await Promise.all([
        sb('sales_invoice_items', { method:'POST', body: itemsBody }),
        sb('stock_movements', { method:'POST', body: movementsBody }),
        soldUnitIds.length ? sb(`stock_product_units?id=in.(${soldUnitIds.join(',')})`, { method:'PATCH', body:{ status:'sold', sold_at: soldAt } }) : Promise.resolve(),
        paymentsBody.length ? sb('sales_payments', { method:'POST', body: paymentsBody }) : Promise.resolve()
      ]);
      toast(`ອອກບິນ ${invNo} ສຳເລັດ · ${fmtMoney(total)}`);
      /* ຖາມພິມບິນທັນທີ — ດຶງບິນຄືນຈາກ DB ເພື່ອໃຫ້ໃບພິມກົງກັບທີ່ບັນທຶກຈິງ */
      askPrint(`ອອກບິນ ${invNo} ສຳເລັດ`, `${fmtMoney(total)} ${currency==='THB'?'ບາດ':'ກີບ'} · ພິມບິນຂາຍ A5 ໃຫ້ລູກຄ້າບໍ່?`,
        (w)=> printInvoiceById(invoiceId, w));
      sellCart = [];
      sellPayments = [];
      tabDrafts.sell = {};
      renderTab();
    }catch(err){ toast('ຜິດພາດ: '+err.message); btn.disabled = false; }
  });
}

/* ບັນທຶກການແກ້ໄຂບິນ: ຄືນສະຕັອກ+ລົບລາຍການ/ການຈ່າຍ/ການເຄື່ອນໄຫວເກົ່າ ແລ້ວສ້າງໃໝ່ຕາມ cart/payments ປັດຈຸບັນ
   ໃຊ້ invoice_id ເກົ່າ (ເລກບິນ/ຜູ້ອອກ/ວັນທີ ຄືເກົ່າ). ໝາຍເຫດ: REST ບໍ່ແມ່ນ transaction ຖ້າຂາດກາງຄັນ
   ອາດເຫຼືອສະຖານະບໍ່ຄົບ — ແຕ່ລຳດັບ "ຄືນກ່ອນ→ຕັດໃໝ່" ຮັບປະກັນວ່າຈະບໍ່ຕັດສະຕັອກຊ້ຳ */
async function saveInvoiceEdit(){
  const ei = editingInvoice;
  const invoiceId = ei.id;
  const subtotal = sellCart.reduce((s,i)=>s+i.amount,0);
  const discount = Math.min(moneyValue('s_discount'), subtotal);
  const total = subtotal - discount;
  const paid = sellPayments.reduce((s,p)=>s+p.converted_amount,0);
  const currency = document.getElementById('s_currency').value;
  const status = paid <= 0 ? 'unpaid' : (paid >= total ? 'paid' : 'partial');
  const soldAt = ei.inv.invoice_date || todayStr();
  /* 1) ຄືນສະຕັອກເກົ່າ (ເລກເຄື່ອງກັບເປັນ in_stock) + ລົບ movement/ລາຍການ/ການຈ່າຍ ຂອງບິນນີ້ */
  const oldUnitIds = [...new Set((ei.originalItems||[]).filter(it=> it.unit_id).map(it=> it.unit_id))];
  if(oldUnitIds.length){
    await sb(`stock_product_units?id=in.(${oldUnitIds.join(',')})`, { method:'PATCH', body:{ status:'in_stock', sold_at:null } });
  }
  await Promise.all([
    sb(`stock_movements?ref_type=eq.sale&ref_id=eq.${invoiceId}`, { method:'DELETE' }),
    sb(`sales_invoice_items?invoice_id=eq.${invoiceId}`, { method:'DELETE' }),
    sb(`sales_payments?invoice_id=eq.${invoiceId}`, { method:'DELETE' })
  ]);
  /* 2) ສ້າງລາຍການ/ການເຄື່ອນໄຫວ/ການຈ່າຍ ໃໝ່ + ຕັດເລກເຄື່ອງທີ່ຂາຍ + ອັບເດດຫົວບິນ */
  const itemsBody = sellCart.map(item=> ({
    id: uid(), invoice_id: invoiceId, model_id: item.model_id, unit_id: item.unit_id,
    variant_note: item.variant_note, quantity: item.quantity, unit_price: item.unit_price, amount: item.amount
  }));
  const movementsBody = sellCart.map(item=> ({
    id: uid(), model_id: item.model_id, unit_id: item.unit_id, movement_type:'out',
    quantity: item.quantity, ref_type:'sale', ref_id: invoiceId, created_by: currentUsername
  }));
  const newUnitIds = sellCart.filter(item=> item.unit_id).map(item=> item.unit_id);
  const paymentsBody = sellPayments.map(p=> ({
    id: uid(), invoice_id: invoiceId, payment_date: soldAt,
    method: p.method, currency: p.currency, amount: p.amount,
    exchange_rate: p.exchange_rate, converted_amount: p.converted_amount, created_by: currentUsername
  }));
  await Promise.all([
    sb('sales_invoice_items', { method:'POST', body: itemsBody }),
    sb('stock_movements', { method:'POST', body: movementsBody }),

    paymentsBody.length ? sb('sales_payments', { method:'POST', body: paymentsBody }) : Promise.resolve(),

function renderPaymentList(){
  const el = document.getElementById('s_paymentList');
  if(!el) return;
  el.innerHTML = sellPayments.length ? sellPayments.map((p,idx)=> `
    <div class="cart-item">
      <span>${p.method==='cash'?'ເງິນສົດ':'ໂອນ'} · ${p.currency}</span>
      <span>${fmtMoney(p.amount)} ${p.currency==='THB'?'ບາດ':'ກີບ'}${p.exchange_rate ? ' <span class="muted" style="font-size:11px;">(@'+p.exchange_rate+')</span>' : ''} <span class="x" data-pidx="${idx}">✕</span></span>
    </div>`).join('') : '<div class="empty">ຍັງບໍ່ໄດ້ບັນທຶກການຈ່າຍ (ຄ້າງໝົດ)</div>';
  el.querySelectorAll('.x').forEach(x=>{
    x.addEventListener('click', ()=>{
      sellPayments.splice(Number(x.dataset.pidx),1);

      updateSellTotals();

/* ໜ່ວຍເງິນຂອງບິນປັດຈຸບັນ (ຕາມສະກຸນທີ່ລະບົບເລືອກໃຫ້ອັດຕະໂນມັດຕາມສິນຄ້າ) — ໃຊ້ຕໍ່ທ້າຍຍອດທຸກຈຸດ ໃຫ້ຮູ້ວ່າ ກີບ ຫຼື ບາດ */
function sellCurUnit(){
  const el = document.getElementById('s_currency');
  return (el && el.value === 'THB') ? 'ບາດ' : 'ກີບ';
}
function updateSellTotals(){
  const subtotal = sellCart.reduce((s,i)=>s+i.amount,0);
  const discount = Math.min(moneyValue('s_discount'), subtotal);
  const total = subtotal - discount;
  const paid = sellPayments.reduce((s,p)=>s+p.converted_amount,0);
  const remain = total - paid;
  const unit = sellCurUnit();
  const subtotalDisplay = document.getElementById('s_subtotalDisplay');
  if(subtotalDisplay) subtotalDisplay.textContent = fmtMoney(subtotal) + ' ' + unit;
  const totalDisplay = document.getElementById('s_totalDisplay');
  if(totalDisplay) totalDisplay.textContent = fmtMoney(total) + ' ' + unit;
  const st = document.getElementById('s_sumTotal'); if(st) st.textContent = fmtMoney(total) + ' ' + unit;
  const sp = document.getElementById('s_sumPaid'); if(sp) sp.textContent = fmtMoney(paid) + ' ' + unit;
  const sr = document.getElementById('s_sumRemain'); if(sr) sr.textContent = fmtMoney(remain > 0 ? remain : 0) + ' ' + unit;
  /* ຕົວເລກໃນປັອບອັບຮັບເງິນ */
  const pmT = document.getElementById('pm_total'); if(pmT) pmT.textContent = fmtMoney(total) + ' ' + unit;
  const pmP = document.getElementById('pm_paid'); if(pmP) pmP.textContent = fmtMoney(paid) + ' ' + unit;
  const pmR = document.getElementById('pm_remain'); if(pmR) pmR.textContent = fmtMoney(remain > 0 ? remain : 0) + ' ' + unit;
}
function renderSellCart(){
  const head = '<table class="ps-table ps-table-sell"><thead><tr><th class="c">ລຳດັບ</th><th>ຊື່ສິນຄ້າ</th>'+
    '<th class="c">ຈຳນວນ</th><th class="r">ລາຄາ/ໜ່ວຍ</th><th class="r">ຈຳນວນເງິນ</th><th></th></tr></thead><tbody>';
  if(!sellCart.length){
    return head + '<tr class="ps-empty"><td colspan="6">ຍັງບໍ່ມີລາຍການ — ເລືອກສິນຄ້າຂ້າງເທິງ ແລ້ວກົດ + ເພີ່ມ</td></tr></tbody></table>';
  }
  const rows = sellCart.map((it,idx)=> {
    if(it.bundleComponent){
      /* ອຸປະກອນທີ່ມາພ້ອມໃນຊຸດ: ໂຊວ໌ລາຄາປົກກະຕິ (ບໍ່ບວກເຂົ້າຍອດ) */
      return `<tr class="ps-sub"><td class="c"></td>`+
        `<td>↳ ${it.model_name} <span class="muted" style="font-size:11px;">(${BUNDLE_TAG})</span></td>`+
        `<td class="c mono">${it.quantity}</td>`+
        `<td class="r mono">${fmtMoney(it.unit_price)}</td>`+
        `<td class="r">—</td>`+
        `<td class="c"><span class="x" data-idx="${idx}">✕</span></td></tr>`;
    }
    return `<tr><td class="c mono">${idx+1}</td>`+
      `<td>${it.model_name}${it.variant_note?(' · <span class="mono muted">'+it.variant_note+'</span>'):''}</td>`+
      `<td class="c mono">${it.quantity}</td>`+
      `<td class="r mono">${fmtMoney(it.unit_price)}</td>`+
      `<td class="r mono b">${fmtMoney(it.amount)} ${sellCurUnit()}</td>`+
      `<td class="c"><span class="x" data-idx="${idx}">✕</span></td></tr>`;
  }).join('');
  return head + rows + '</tbody></table>';
}
function bindSellCartRemove(){
  document.querySelectorAll('#s_cartList .x').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = Number(el.dataset.idx);
      const it = sellCart[idx];
      if(it && it.bundleParent && it.groupId){
        /* ລຶບຊຸດ: ເອົາອອກທັງໂຄງ ແລະ ອຸປະກອນທີ່ມາພ້ອມທັງໝົດຂອງກຸ່ມນີ້ */
        sellCart = sellCart.filter(x=> x.groupId !== it.groupId);
      } else {
        sellCart.splice(idx,1);
      }
      document.getElementById('s_cartList').innerHTML = renderSellCart();
      bindSellCartRemove();
      updateSellTotals();
    });
  });
}

            <p class="ps-note">ຕັດແຕ່ສະຕັອກ — ບໍ່ນັບເປັນຍອດຂາຍ ແລະ ບໍ່ກະທົບກຳໄລ</p>
            <button class="btn" id="tr_submit"><svg class="dv-icon"><use href="#i-check-circle"></use></svg>ບັນທຶກການໂອນ (ຕັດສະຕັອກ) →</button>

  const modelSel = document.getElementById('tr_model');
  enableSearchableSelect(modelSel);
  /* ພິມຄົ້ນຫາເລກເຄື່ອງໃນລາຍການ (checkbox) — ເຊື່ອງແຖວທີ່ບໍ່ຕົງ ບໍ່ໃຫ້ຕ້ອງເລື່ອນຫາເອງ */
  function filterTransferSerials(){

      : '<div class="empty">ບໍ່ມີເລກເຄື່ອງໃນສະຕັອກສາຂານີ້ (ຫຼືເລືອກໝົດແລ້ວ)</div>';
    filterTransferSerials(); /* ຄົງຄຳຄົ້ນຫາເດີມໄວ້ ຫຼັງໂຫລດລາຍການໃໝ່ */

  /* Enter ในแต่ละช่อง = ไล่ลงช่องถัดไปตามลำดับจริงในฟอร์ม (จำนวน/ไม่มีเลขเครื่อง → หมายเหตุ) พอถึงช่องสุดท้ายค่อยเพิ่มเข้ารายการ แล้วโฟกัสไปที่ปุ่ม "บันทึกโอນสาขา" ให้พร้อมกด Enter อีกครั้งเพื่อบันทึกเลย */
  function getTransferFieldChain(){
    const serialBlock = document.getElementById('tr_serialBlock');
    const isSerialVisible = serialBlock && serialBlock.style.display !== 'none';
    const chain = [];
    if(!isSerialVisible) chain.push('tr_qty');
    chain.push('tr_note');

  }
  function focusTransferField(id){
    const el = document.getElementById(id);

  }
  function handleTransferFieldEnter(currentId){
    const chain = getTransferFieldChain();

    if(idx < chain.length - 1){
      focusTransferField(chain[idx+1]);
    } else {
      document.getElementById('tr_addItem').click();
      /* หน่วงการโฟกัสไปช่วงถัดไปด้วย setTimeout เพื่อไม่ให้คีย์ Enter ตัวเดียวกันไปกระตุ้น click ที่ปุ่มบันทึกซ้ำอีกที (ถ้าโฟกัสปุ่มทันทีในอีเวนต์เดียวกัน บางเบราว์เซอร์จะยิง click ซ้ำตอนปล่อยคีย์) */
      setTimeout(()=>{

        if(submitBtn) submitBtn.focus();
      }, 0);

    });
