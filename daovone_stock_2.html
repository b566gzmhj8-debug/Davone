  bindEnterAdvance(['tr_branch','tr_date'], 'tr_model_search');
  document.getElementById('tr_submit').addEventListener('click', async (e)=>{
    if(!transferCart.length){ toast('ຍັງບໍ່ມີລາຍການ'); return; }
    const branch = document.getElementById('tr_branch').value.trim();
    if(!branch){ toast('ໃສ່ຊື່ສາຂາປາຍທາງກ່ອນ'); return; }
    const btn = e.currentTarget;
    if(btn.disabled) return;
    btn.disabled = true;
    try{
      const note = document.getElementById('tr_note').value.trim();
      const fullNote = `ໂອນໄປ: ${branch}${note ? ' - '+note : ''}`;
      const transferId = uid();
      /* ບັນທຶກທັງໝົດເປັນຊຸດດຽວ (bulk) ແທນທີລະລາຍການ ໃຫ້ໄວຂຶ້ນ */
      const movementsBody = transferCart.map(item=> ({
        id: uid(), model_id: item.model_id, unit_id: item.unit_id, movement_type:'out',
        quantity: item.quantity, ref_type:'transfer', ref_id: transferId, note: fullNote, created_by: currentUsername
      }));
      const transferredUnitIds = transferCart.filter(item=> item.unit_id).map(item=> item.unit_id);
      /* ໃບໂອນທີ່ສາຂາປາຍທາງຈະເຫັນ ແລະ ກົດຢືນຢັນຮັບເອງ (ບໍ່ຕ້ອງຄີຍ໌ໃໝ່) */
      const models = await sb(`stock_product_models?select=id,code,name,unit,cost_price&id=in.(${[...new Set(transferCart.map(i=> i.model_id))].join(',')})`);
      const modelById = {};
      (models||[]).forEach(m=> { modelById[m.id] = m; });
      const transferDoc = {
        id: transferId,
        transfer_no: 'TR-'+Date.now().toString().slice(-8),
        from_branch: 'ສາຂາຫຼັກ',
        to_branch: branch,
        note: note || null,
        status: 'sent',
        created_by: currentUsername
      };
      const transferItems = transferCart.map(item=> {
        const m = modelById[item.model_id] || {};
        return {
          id: uid(), transfer_id: transferId, model_id: item.model_id, unit_id: item.unit_id || null,
          code: m.code || null, name: m.name || item.model_name, unit: m.unit || null,
          serial_no: item.serial_no || null, quantity: item.quantity,
          cost_price: m.cost_price != null ? m.cost_price : null, cost_currency: 'LAK'
        };
      });
      await Promise.all([
        sb('stock_movements', { method:'POST', body: movementsBody }),
        transferredUnitIds.length ? sb(`stock_product_units?id=in.(${transferredUnitIds.join(',')})`, { method:'PATCH', body:{ status:'transferred', note: fullNote } }) : Promise.resolve()
      ]);
      await sb('stock_branch_transfers', { method:'POST', body: transferDoc });
      await sb('stock_branch_transfer_items', { method:'POST', body: transferItems });
      toast(`ໂອນສາຂາສຳເລັດ · ${transferCart.length} ລາຍການ`);
      /* ຖາມພິມໃບໂອນທັນທີ — ໃຊ້ຂໍ້ມູນຊຸດທີ່ຫາກໍບັນທຶກລົງໄປ */
      askPrint(`ອອກໃບໂອນ ${transferDoc.transfer_no} ສຳເລັດ`, `ໂອນໄປ ${branch} · ${transferItems.length} ລາຍການ · ພິມໃບໂອນ A5 ໃຫ້ຜູ້ນຳສົ່ງບໍ່?`,
        (w)=> printTransferDoc({
          transfer_no: transferDoc.transfer_no,
          from_branch: transferDoc.from_branch,
          to_branch: transferDoc.to_branch,
          note: transferDoc.note,
          created_by: transferDoc.created_by,
          date: todayStr()
        }, transferItems, { win: w }));
      transferCart = [];
      tabDrafts.transfer = {};
      renderTab();
    }catch(err){ toast('ຜິດພາດ: '+err.message); btn.disabled = false; }
  });
}
function renderTransferCart(){
  const head = '<table class="ps-table ps-table-tr"><thead><tr><th class="c">ລຳດັບ</th><th>ຊື່ສິນຄ້າ</th>'+
    '<th>ເລກເຄື່ອງ</th><th class="c">ຈຳນວນ</th><th></th></tr></thead><tbody>';
  if(!transferCart.length){
    return head + '<tr class="ps-empty"><td colspan="5">ຍັງບໍ່ມີລາຍການ — ເລືອກສິນຄ້າຂ້າງເທິງ ແລ້ວກົດ + ເພີ່ມ</td></tr></tbody></table>';
  }
  const rows = transferCart.map((it,idx)=>
    `<tr><td class="c mono">${idx+1}</td><td>${it.model_name}</td>`+
    `<td class="mono muted">${it.serial_no || '—'}</td>`+
    `<td class="c mono b">${it.quantity}</td>`+
    `<td class="c"><span class="x" data-idx="${idx}">✕</span></td></tr>`).join('');
  return head + rows + '</tbody></table>';
}
/* ຕົວເລກໃນແຖບລຸ່ມສຸດ (ຈຳນວນທີ່ໂອນ / ຈຳນວນລາຍການ) */
function updateTransferCount(){
  const big = document.getElementById('tr_bigCount');
  if(!big) return;
  const qty = transferCart.reduce((s,i)=> s + (Number(i.quantity)||0), 0);
  big.textContent = fmtMoney(qty);
  const line = document.getElementById('tr_lineCount');
  if(line) line.textContent = transferCart.length;
}
function bindTransferCartRemove(){
  updateTransferCount();
  document.querySelectorAll('#tr_cartList .x').forEach(el=>{
    el.addEventListener('click', ()=>{
      transferCart.splice(Number(el.dataset.idx),1);
      document.getElementById('tr_cartList').innerHTML = renderTransferCart();
      bindTransferCartRemove();
    });
  });
}
async function loadTransferHistory(month){
  const el = document.getElementById('tr_history');
  if(!el) return;
  const isAdmin = currentRole === 'admin';
  try{
    const start = month + '-01';
    const endDate = new Date(start); endDate.setMonth(endDate.getMonth()+1);
    const end = endDate.toISOString().slice(0,10);
    const rows = await sb(`stock_movements?select=*,stock_product_models(name,unit,code),stock_product_units(serial_no)&ref_type=eq.transfer&created_at=gte.${start}&created_at=lt.${end}&order=created_at.desc`);
    const groups = {};
    rows.forEach(r=>{
      const key = r.ref_id || r.id;
      if(!groups[key]) groups[key] = { key, note: r.note, date: r.created_at, created_by: r.created_by, items: [] };
      groups[key].items.push(r);
    });
    const groupList = Object.values(groups);
    el.innerHTML = `
      ${isAdmin && groupList.length ? `
        <div class="row" style="padding:6px 0;">
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);margin:0;">
            <input type="checkbox" id="tr_selectAll" style="width:17px;height:17px;margin:0;">ເລືອກທັງໝົດ
          </label>
          <button class="btn danger" id="tr_deleteSelected" style="display:none;padding:6px 12px;font-size:12px;"><svg class="dv-icon"><use href="#i-trash"></use></svg>ລົບທີ່ເລືອກ (<span id="tr_selectedCount">0</span>)</button>
        </div>
      ` : ''}
      ${groupList.length ? groupList.map(g=> `
      <div class="row clickable" data-trgroup="${g.key}">
        <span style="display:flex;align-items:center;gap:10px;">
          ${isAdmin ? `<input type="checkbox" class="tr-check" value="${g.key}" style="width:17px;height:17px;flex:none;margin:0;" onclick="event.stopPropagation()">` : ''}
          <span>
            <div>${g.note || 'ໂອນສາຂາ'}</div>
            <div class="muted" style="font-size:11px;">${fmtDateDMY((g.date||'').slice(0,10))} · ${g.items.length} ລາຍການ</div>
          </span>
        </span>
      </div>`).join('') : '<div class="empty">ບໍ່ມີການໂອນສາຂາໃນເດືອນນີ້</div>'}`;
    el.querySelectorAll('.row[data-trgroup]').forEach(row=>{
      row.addEventListener('click', (e)=>{
        if(e.target.closest('.tr-check')) return;
        openTransferDetail(groups[row.dataset.trgroup]);
      });
    });
    if(isAdmin && groupList.length){
      const selectAllEl = document.getElementById('tr_selectAll');
      const deleteBtn = document.getElementById('tr_deleteSelected');
      const countEl = document.getElementById('tr_selectedCount');
      const checks = ()=> Array.from(el.querySelectorAll('.tr-check'));
      function refreshSelection(){
        const selected = checks().filter(c=> c.checked);
        countEl.textContent = selected.length;
        deleteBtn.style.display = selected.length ? 'inline-flex' : 'none';
        selectAllEl.checked = selected.length === checks().length;
      }
      selectAllEl.addEventListener('change', ()=>{
        checks().forEach(c=> c.checked = selectAllEl.checked);
        refreshSelection();
      });
      checks().forEach(c=> c.addEventListener('change', refreshSelection));
      deleteBtn.addEventListener('click', async ()=>{
        const keys = checks().filter(c=> c.checked).map(c=> c.value);
        if(!keys.length) return;
        if(!await confirmDelete(`ລົບການໂອນສາຂາ ${keys.length} ລາຍການທີ່ເລືອກ?`, 'ສະຕັອກທີ່ໂອນອອກໄປຈະຖືກຄືນກັບມາ')) return;
        if(deleteBtn.disabled) return;
        deleteBtn.disabled = true;
        try{
          await bulkVoidTransferGroups(keys.map(k=> groups[k]));
          toast(`ລົບການໂອນສາຂາສຳເລັດ ${keys.length} ລາຍການ ຄືນສະຕັອກແລ້ວ`);
          renderTab();
        }catch(err){
          toast('ລົບບໍ່ໄດ້: '+err.message);
          deleteBtn.disabled = false;
        }
      });
    }
  }catch(err){
    el.innerHTML = `<div class="empty">ຜິດພາດ: ${err.message}</div>`;
  }
}
/* ລາຍລະອຽດການໂອນ: ໂຊວ໌ເປັນ "ໃບໂອນ A5" ແບບດຽວກັນກັບທີ່ພິມອອກມາ (ດຶງເລກທີ່ໃບໂອນ/ສາຂາປາຍທາງຈາກ DB ກ່ອນ) */
async function openTransferDetail(group){
  if(!group) return;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><div class="empty">ກຳລັງໂຫລດ...</div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click', (e)=>{ if(e.target === bg) bg.remove(); });
  let doc;
  try{
    doc = await loadTransferDoc(group);
  }catch(err){
    bg.querySelector('.modal').innerHTML = `<div class="empty">ຜິດພາດ: ${err.message}</div><button class="btn secondary" id="trErrClose">ປິດ</button>`;
    bg.querySelector('#trErrClose').addEventListener('click', ()=> bg.remove());
    return;
  }
  bg.querySelector('.modal').innerHTML = `
    ${paperHtml(transferDocBody(doc.t, doc.items))}
    <button class="btn secondary" id="trPrintBtn" style="margin-top:16px;"><svg class="dv-icon"><use href="#i-printer"></use></svg>ພິມໃບໂອນ (A5)</button>
    ${currentRole==='admin' ? `<button class="btn danger" id="trDeleteBtn" style="margin-top:8px;"><svg class="dv-icon"><use href="#i-trash"></use></svg>ລົບການໂອນນີ້ (ຄືນສະຕັອກ)</button>` : ''}
    <button class="btn secondary" id="trDetailClose">ປິດ</button>
  `;
  bg.querySelector('#trPrintBtn').addEventListener('click', ()=>{
    const w = openPrintWindow();
    if(w) printTransferDoc(doc.t, doc.items, { win: w });
  });
  bg.querySelector('#trDetailClose').addEventListener('click', ()=> bg.remove());
  if(currentRole==='admin'){
    const delBtn = bg.querySelector('#trDeleteBtn');
    delBtn.addEventListener('click', async ()=>{
      if(!await confirmDelete('ລົບການໂອນສາຂານີ້?', 'ສິນຄ້າທີ່ມີເລກເຄື່ອງຈະຄືນເປັນສະຕັອກຄົງເຫຼືອ')) return;
      if(delBtn.disabled) return;
      delBtn.disabled = true;
      try{
        await voidTransfer(group);
        toast('ລົບການໂອນສາຂາສຳເລັດ ຄືນສະຕັອກແລ້ວ');
        bg.remove();
        renderTab();
      }catch(err){ toast('ຜິດພາດ: '+err.message); delBtn.disabled = false; }
    });
  }
}
/* ລົບການໂອນສາຂາ: ຄືນສະຕັອກ (ເຄື່ອງທີ່ມີເລກເຄື່ອງກັບເປັນ in_stock) ແລ້ວລົບ movement ທັງໝົດຂອງການໂອນຄັ້ງນີ້ */
async function voidTransfer(group){
  const unitIds = group.items.filter(it=> it.unit_id).map(it=> it.unit_id);
  const movementIds = group.items.map(it=> it.id);
  await Promise.all([
    unitIds.length ? sb(`stock_product_units?id=in.(${unitIds.join(',')})`, { method:'PATCH', body:{ status:'in_stock', note: null } }) : Promise.resolve(),
    movementIds.length ? sb(`stock_movements?id=in.(${movementIds.join(',')})`, { method:'DELETE' }) : Promise.resolve()
  ]);
  await recallBranchTransfers([group.key]);
}
/* ດຶງໃບໂອນຄືນຈາກກ່ອງຮັບເຄື່ອງຂອງສາຂາປາຍທາງ ເມື່ອລົບການໂອນຢູ່ສາຂາຫຼັກ
   ລົບສະເພາະໃບທີ່ຍັງ status=sent ເທົ່ານັ້ນ — ຖ້າປາຍທາງກົດຮັບເຄື່ອງໄປແລ້ວ ໃບຈະຄ້າງໄວ້ເປັນປະຫວັດ */
async function recallBranchTransfers(groupKeys){
  const ids = (groupKeys||[]).filter(Boolean);
  if(!ids.length) return;
  try{
    await sb(`stock_branch_transfers?id=in.(${ids.join(',')})&status=eq.sent`, { method:'DELETE' });
  }catch(err){ /* ລົບ movement ສຳເລັດແລ້ວ ຢ່າໃຫ້ການລົບໃບໂອນລົ້ມທັງໝົດ */ }
}
/* ລົບການໂອນສາຂາຫຼາຍລາຍການພ້ອມກັນ ດ້ວຍ 2 request ລວມ (ຂໍ້ມູນ items ມີຢູ່ໃນໜ້າຈໍແລ້ວ ບໍ່ຕ້ອງໄປດຶງໃໝ່) ໄວກວ່າການລົບເທື່ອລະລາຍການຫຼາຍ */
async function bulkVoidTransferGroups(groupsArr){
  const allItems = groupsArr.flatMap(g=> g.items);
  const unitIds = [...new Set(allItems.filter(it=> it.unit_id).map(it=> it.unit_id))];
  const movementIds = allItems.map(it=> it.id);
  await Promise.all([
    unitIds.length ? sb(`stock_product_units?id=in.(${unitIds.join(',')})`, { method:'PATCH', body:{ status:'in_stock', note: null } }) : Promise.resolve(),
    movementIds.length ? sb(`stock_movements?id=in.(${movementIds.join(',')})`, { method:'DELETE' }) : Promise.resolve()
  ]);
  await recallBranchTransfers(groupsArr.map(g=> g.key));
}

      countEl.textContent = selected.length;
      deleteBtn.style.display = selected.length ? 'inline-flex' : 'none';
      selectAllEl.checked = selected.length === checks().length;
    }
    selectAllEl.addEventListener('change', ()=>{
      checks().forEach(c=> c.checked = selectAllEl.checked);
      refreshSelection();
    });
    checks().forEach(c=> c.addEventListener('change', refreshSelection));
    deleteBtn.addEventListener('click', async ()=>{
      const ids = checks().filter(c=> c.checked).map(c=> c.value);
      if(!ids.length) return;
      if(!await confirmDelete(`ລົບບິນຂາຍ ${ids.length} ໃບທີ່ເລືອກ?`, 'ສະຕັອກທີ່ຫັກໄປຈະຄືນທັງໝົດ')) return;
      if(deleteBtn.disabled) return;
      deleteBtn.disabled = true;
      try{
        await bulkVoidInvoices(ids);
        toast(`ລົບບິນຂາຍສຳເລັດ ${ids.length} ໃບ ຄືນສະຕັອກແລ້ວ`);
        renderTab();
      }catch(err){
        toast('ລົບບໍ່ໄດ້: ອາດມີບິນໃດໜຶ່ງທີ່ເລືອກມີບັນຫາ — ລອງເລືອກຊ້ຳໃໝ່');
        deleteBtn.disabled = false;
      }
    });
  }
}
/* ============================================================
   ສະຫຼຸບປີ — ຂາຍດີ / ບໍ່ໄດ້ຂາຍ ແຍກຕາມປະເພດສິນຄ້າ
   ໃຊ້ວາງແຜນສັ່ງຊື້ປີຕໍ່ໄປ: ປະເພດໃດຂາຍໄດ້ຫຼາຍ, ລຸ້ນໃດຂາຍດີສຸດ, ລຸ້ນໃດຄ້າງບໍ່ໄດ້ຂາຍເລີຍ
   ============================================================ */
const NO_CATEGORY = 'ບໍ່ລະບຸປະເພດ';

/* ຈຳນວນທີ່ຂາຍອອກຂອງແຕ່ລະລຸ້ນ ໃນປີທີ່ເລືອກ (ນັບສະເພາະບິນທີ່ຢືນຢັນແລ້ວ)
   ດຶງ id ບິນກ່ອນ ແລ້ວຄ່ອຍດຶງລາຍການເປັນຊຸດໆ (chunk) ເພາະຖ້າບິນຫຼາຍ URL ຈະຍາວເກີນແລ້ວ error */
async function getYearSoldQty(year){
  const start = `${year}-01-01`;
  const end = `${year+1}-01-01`;
  const invoices = await sb(`sales_invoices?select=id,invoice_date&invoice_date=gte.${start}&invoice_date=lt.${end}&status=eq.confirmed`);
  const qtyByModel = {};
  /* ຈຳນວນບິນແຍກຕາມເດືອນ (index 0 = ມັງກອນ) — ໃຊ້ຕອນກົດກ່ອງ "ຈຳນວນບິນທັງປີ" */
  const invoiceByMonth = new Array(12).fill(0);
  invoices.forEach(inv=>{
    const mo = Number(String(inv.invoice_date||'').slice(5,7));
    if(mo >= 1 && mo <= 12) invoiceByMonth[mo-1]++;
  });
  if(!invoices.length) return { qtyByModel, invoiceCount: 0, invoiceByMonth };
  const ids = invoices.map(i=> i.id);
  const CHUNK = 120;
  for(let i=0; i<ids.length; i+=CHUNK){
    const items = await sb(`sales_invoice_items?select=model_id,quantity&invoice_id=in.(${ids.slice(i,i+CHUNK).join(',')})`);
    items.forEach(it=>{
      if(!it.model_id) return;
      qtyByModel[it.model_id] = (qtyByModel[it.model_id]||0) + (Number(it.quantity)||0);
    });
  }
  return { qtyByModel, invoiceCount: invoices.length, invoiceByMonth };
}

/* ປີທີ່ເລືອກໄດ້: ແຕ່ປີຂອງບິນທຳອິດທີ່ມີໃນລະບົບ ຫາ ປີປັດຈຸບັນ */
async function getInvoiceYears(){
  const thisYear = new Date().getFullYear();
  let firstYear = thisYear;
  try{
    const rows = await sb('sales_invoices?select=invoice_date&status=eq.confirmed&order=invoice_date.asc&limit=1');
    if(rows && rows[0] && rows[0].invoice_date){
      const y = Number(String(rows[0].invoice_date).slice(0,4));
      if(y && y <= thisYear) firstYear = y;
    }
  }catch(e){ /* ດຶງບໍ່ໄດ້ ກໍໃຊ້ປີປັດຈຸບັນໄປກ່ອນ */ }
  const years = [];
  for(let y = thisYear; y >= firstYear; y--) years.push(y);
  return years;
}

async function renderYearly(main){
  const year = Number(main.dataset.year) || new Date().getFullYear();
  const [years, models, { qtyByModel, invoiceCount, invoiceByMonth }] = await Promise.all([
    getInvoiceYears(),
    /* ເອົາທຸກລຸ້ນ (ລວມທີ່ປິດການໃຊ້ງານ) ເພື່ອບໍ່ໃຫ້ຍອດຂາຍເກົ່າຫາຍໄປ ແຕ່ຈະບອກໄວ້ວ່າ "ປິດແລ້ວ" */
    sb('stock_product_models?select=id,name,code,category,unit,active&order=name.asc'),
    getYearSoldQty(year)
  ]);
  if(!years.includes(year)) years.unshift(year);

  const modelById = {};
  models.forEach(m=> modelById[m.id] = m);
  /* ລຸ້ນທີ່ຂາຍໄປແລ້ວແຕ່ຖືກລຶບອອກຈາກຕາຕະລາງສິນຄ້າ — ຍັງນັບຍອດ ແຕ່ບອກວ່າບໍ່ພົບຊື່ */
  Object.keys(qtyByModel).forEach(id=>{
    if(!modelById[id]) modelById[id] = { id, name:'(ສິນຄ້າທີ່ຖືກລຶບແລ້ວ)', code:'', category:'', unit:'', active:false, missing:true };
  });

  /* ຈັດກຸ່ມຕາມປະເພດ */
  const groups = {};
  Object.keys(modelById).forEach(id=>{
    const m = modelById[id];
    /* ລຸ້ນທີ່ປິດການໃຊ້ງານ ແລະ ບໍ່ໄດ້ຂາຍໃນປີນີ້ ບໍ່ຕ້ອງໂຊວ໌ (ບໍ່ໄດ້ຈະສັ່ງຊື້ຢູ່ແລ້ວ) */
    const qty = qtyByModel[id] || 0;
    if(!qty && (m.active === false)) return;
    const cat = (m.category || '').trim() || NO_CATEGORY;
    (groups[cat] = groups[cat] || []).push({ m, qty });
  });

  /* ຮຽງພາຍໃນປະເພດ: ຂາຍຫຼາຍ → ໜ້ອຍ, ທີ່ບໍ່ໄດ້ຂາຍ (0) ໄປຢູ່ທ້າຍສຸດ ຮຽງຕາມຊື່ */
  Object.keys(groups).forEach(cat=>{
    groups[cat].sort((a,b)=> (b.qty - a.qty) || (a.m.name||'').localeCompare(b.m.name||''));
  });
  /* ຮຽງປະເພດ: ປະເພດທີ່ຂາຍໄດ້ຫຼາຍລວມສຸດຢູ່ເທິງ */
  const catTotals = {};
  Object.keys(groups).forEach(cat=> catTotals[cat] = groups[cat].reduce((s,r)=> s + r.qty, 0));
  const cats = Object.keys(groups).sort((a,b)=> (catTotals[b] - catTotals[a]) || a.localeCompare(b));

  const allRows = [];
  cats.forEach(cat=> groups[cat].forEach(r=> allRows.push({ cat, ...r })));
  const totalQty = allRows.reduce((s,r)=> s + r.qty, 0);
  const soldRows = allRows.filter(r=> r.qty > 0);
  const deadRows = allRows.filter(r=> r.qty <= 0);
  const topRows = [...soldRows].sort((a,b)=> b.qty - a.qty).slice(0,10);
  const topMax = topRows.length ? topRows[0].qty : 0;

  const nameHtml = (m)=> `${m.name}${m.active === false && !m.missing ? ' <span class="tag">ປິດແລ້ວ</span>' : ''}`;
  const itemHtml = (r, rank, max)=>{
    const pct = max > 0 ? Math.max(2, Math.round(r.qty / max * 100)) : 0;
    const sub = [r.m.code, r.cat].filter(Boolean).join(' · ');
    return `
      <div class="yr-item ${r.qty ? '' : 'zero'}">
        <div class="yr-top">
          <span class="nm">${rank ? `<span class="yr-rank">${rank}.</span>` : ''}${nameHtml(r.m)}${rank === 1 && r.qty > 0 ? ' <span class="tag ok">ຂາຍດີສຸດ</span>' : ''}</span>
          <span class="qt">${r.qty ? r.qty + ' ' + (r.m.unit || 'ໜ່ວຍ') : 'ບໍ່ໄດ້ຂາຍ'}</span>
        </div>
        ${sub ? `<div class="yr-sub mono">${sub}</div>` : ''}
        ${r.qty > 0 ? `<div class="yr-bar"><i style="width:${pct}%"></i></div>` : ''}
      </div>`;
  };

  main.innerHTML = `
    <div class="card">
      <label>ເລືອກປີ</label>
      <select id="yr_year">${years.map(y=> `<option value="${y}" ${y===year?'selected':''}>ປີ ${y}</option>`).join('')}</select>
    </div>
    <div class="stats-row">
      <button type="button" class="stat" data-yr-go="cats"><div class="num mono">${totalQty}</div><div class="lbl">ຂາຍອອກລວມ (ໜ່ວຍ)</div><span class="go">ເບິ່ງແຍກປະເພດ ›</span></button>
      <button type="button" class="stat" data-yr-go="bills"><div class="num mono">${invoiceCount}</div><div class="lbl">ຈຳນວນບິນທັງປີ</div><span class="go">ເບິ່ງແຍກເດືອນ ›</span></button>
      <button type="button" class="stat" data-yr-go="sold"><div class="num mono">${soldRows.length}</div><div class="lbl">ລຸ້ນທີ່ຂາຍໄດ້</div><span class="go">ເບິ່ງລາຍການ ›</span></button>
      <button type="button" class="stat" data-yr-go="dead"><div class="num mono">${deadRows.length}</div><div class="lbl">ລຸ້ນທີ່ບໍ່ໄດ້ຂາຍ</div><span class="go">ເບິ່ງລາຍການ ›</span></button>
    </div>

    <!-- ລາຍການທີ່ເປີດຈາກກ່ອງສະຖິຕິ (ເປີດເທື່ອລະອັນ) -->
    <div id="yr_panel">
      <div class="card" id="yr_p_bills" hidden>
        <h3><svg class="dv-icon"><use href="#i-chart"></use></svg>ຈຳນວນບິນແຍກຕາມເດືອນ · ປີ ${year} <button type="button" class="yr-close" aria-label="ປິດ">✕</button></h3>
        <div class="muted" style="font-size:11px;margin:-4px 0 4px;">ກົດເດືອນເພື່ອເປີດລາຍງານບິນຂອງເດືອນນັ້ນ</div>
        ${(()=>{
          const mx = Math.max(...invoiceByMonth, 1);
          return invoiceByMonth.map((c,i)=> `
          <div class="yr-item link ${c ? '' : 'zero'}" data-yr-month="${year}-${String(i+1).padStart(2,'0')}">
            <div class="yr-top">
              <span class="nm">ເດືອນ ${i+1}/${year}</span>
              <span class="qt">${c ? c + ' ບິນ' : 'ບໍ່ມີບິນ'}</span>
            </div>
            ${c ? `<div class="yr-bar"><i style="width:${Math.max(2, Math.round(c / mx * 100))}%"></i></div>` : ''}
          </div>`).join('');
        })()}
      </div>
      <div class="card" id="yr_p_sold" hidden>
        <h3><svg class="dv-icon"><use href="#i-chart"></use></svg>ລຸ້ນທີ່ຂາຍໄດ້ທັງໝົດ (${soldRows.length}) · ປີ ${year} <button type="button" class="yr-close" aria-label="ປິດ">✕</button></h3>
        ${soldRows.length ? [...soldRows].sort((a,b)=> b.qty - a.qty).map((r,i)=> itemHtml(r, i+1, topMax)).join('') : '<div class="empty">ບໍ່ມີການຂາຍໃນປີນີ້</div>'}
      </div>
      <div class="card" id="yr_p_dead" hidden>
        <h3><svg class="dv-icon"><use href="#i-box"></use></svg>ລຸ້ນທີ່ບໍ່ໄດ້ຂາຍເລີຍ (${deadRows.length}) · ປີ ${year} <button type="button" class="yr-close" aria-label="ປິດ">✕</button></h3>
        ${deadRows.length ? cats.filter(cat=> groups[cat].some(r=> r.qty <= 0)).map(cat=>{
          const dead = groups[cat].filter(r=> r.qty <= 0);
          return `<div class="yr-split">${cat} (${dead.length} ລຸ້ນ)</div>` + dead.map(r=> itemHtml(r, 0, 0)).join('');
        }).join('') : '<div class="empty">ທຸກລຸ້ນຂາຍໄດ້ໝົດ 👍</div>'}
      </div>
    </div>

    <div class="card">
      <h3><svg class="dv-icon"><use href="#i-chart"></use></svg>ຂາຍດີທີ່ສຸດ 10 ອັນດັບ (ທັງຮ້ານ) · ປີ ${year}</h3>
      ${topRows.length ? topRows.map((r,i)=> itemHtml(r, i+1, topMax)).join('') : '<div class="empty">ບໍ່ມີການຂາຍໃນປີນີ້</div>'}
    </div>

    <div class="card" id="yr_cats">
      <h3><svg class="dv-icon"><use href="#i-box"></use></svg>ຍອດຂາຍລວມ ແຍກຕາມປະເພດ</h3>
      ${cats.length ? cats.map(cat=>{
        const max = Math.max(...cats.map(c=> catTotals[c]), 1);
        const pct = Math.max(2, Math.round(catTotals[cat] / max * 100));
        return `
        <div class="yr-item ${catTotals[cat] ? '' : 'zero'}">
          <div class="yr-top">
            <span class="nm">${cat}</span>
            <span class="qt">${catTotals[cat]} ໜ່ວຍ</span>
          </div>
          ${catTotals[cat] > 0 ? `<div class="yr-bar"><i style="width:${pct}%"></i></div>` : ''}
        </div>`;
      }).join('') : '<div class="empty">ຍັງບໍ່ມີສິນຄ້າ</div>'}
    </div>

    ${cats.map(cat=>{
      const rows = groups[cat];
      const sold = rows.filter(r=> r.qty > 0);
      const dead = rows.filter(r=> r.qty <= 0);
      const max = sold.length ? sold[0].qty : 0;
      return `
      <div class="card">
        <h3><svg class="dv-icon"><use href="#i-box"></use></svg>${cat} <span class="muted" style="font-weight:400;font-size:11px;">· ຂາຍໄດ້ ${catTotals[cat]} ໜ່ວຍ</span></h3>
        ${sold.length ? sold.map((r,i)=> itemHtml(r, i+1, max)).join('') : '<div class="empty">ປະເພດນີ້ບໍ່ໄດ້ຂາຍເລີຍໃນປີ ' + year + '</div>'}
        ${dead.length ? `<div class="yr-split">ບໍ່ໄດ້ຂາຍເລີຍໃນປີ ${year} (${dead.length} ລຸ້ນ)</div>` + dead.map(r=> itemHtml(r, 0, 0)).join('') : ''}
      </div>`;
    }).join('')}

    <button class="btn secondary" id="yr_export"><svg class="dv-icon"><use href="#i-chart"></use></svg>ສົ່ງອອກ CSV (ເປີດດ້ວຍ Excel)</button>
  `;

  document.getElementById('yr_year').addEventListener('change', (e)=>{
    main.dataset.year = e.target.value;
    renderTab();
  });

  /* ກົດກ່ອງສະຖິຕິ → ເປີດລາຍການທີ່ກ່ຽວຂ້ອງ ແລ້ວເລື່ອນລົງໄປຫາ; ກົດກ່ອງເດີມອີກເທື່ອ = ປິດ */
  const statBtns = [...main.querySelectorAll('[data-yr-go]')];
  const panels = [...main.querySelectorAll('#yr_panel > .card')];
  const goTo = (el)=>{
    el.scrollIntoView({ behavior:'smooth', block:'start' });
    el.classList.remove('yr-flash'); void el.offsetWidth; el.classList.add('yr-flash');
  };
  const closePanels = ()=>{
    panels.forEach(p=> p.hidden = true);
    statBtns.forEach(b=> b.classList.remove('active'));
  };
  statBtns.forEach(btn=> btn.addEventListener('click', ()=>{
    const key = btn.dataset.yrGo;
    if(key === 'cats'){ closePanels(); goTo(document.getElementById('yr_cats')); return; }
    const panel = document.getElementById('yr_p_' + key);
    const wasOpen = !panel.hidden;
    closePanels();
    if(wasOpen) return;
    panel.hidden = false;
    btn.classList.add('active');
    goTo(panel);
  }));
  main.querySelectorAll('#yr_panel .yr-close').forEach(x=> x.addEventListener('click', ()=>{
    closePanels();
    main.querySelector('.stats-row').scrollIntoView({ behavior:'smooth', block:'center' });
  }));
  /* ກົດເດືອນ → ໄປແທັບລາຍງານຂອງເດືອນນັ້ນ */
  main.querySelectorAll('[data-yr-month]').forEach(row=> row.addEventListener('click', ()=>{
    main.dataset.month = row.dataset.yrMonth;
    activeTab = 'report';
    buildNav();
    renderTab();
    window.scrollTo(0, 0);
  }));

  document.getElementById('yr_export').addEventListener('click', ()=>{
    const header = ['ລຳດັບ','ປະເພດ','ລະຫັດ','ຊື່ສິນຄ້າ','ຈຳນວນທີ່ຂາຍໄດ້','ໜ່ວຍ','ສະຖານະ'];
    const rows = [];
    let n = 0;
    cats.forEach(cat=>{
      groups[cat].forEach(r=>{
        rows.push([++n, cat, r.m.code||'', r.m.name||'', r.qty, r.m.unit||'', r.qty ? 'ຂາຍໄດ້' : 'ບໍ່ໄດ້ຂາຍ']);
      });
    });
    rows.push([]);
    rows.push(['','','','ລວມທັງໝົດ', totalQty, '', `ປີ ${year} · ${invoiceCount} ບິນ`]);
    const esc = v=>{ const s = String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
    const csv = '﻿' + [header, ...rows].map(r=> r.map(esc).join(',')).join('\r\n'); /* BOM ໃຫ້ Excel ອ່ານພາສາລາວຖືກ */
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `yearly-sales-${year}.csv`; /* ຊື່ໄຟລ໌ເປັນ ASCII — Safari ບໍ່ຮັບຊື່ພາສາລາວ */
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 60000);
    toast(`ສົ່ງອອກສະຫຼຸບປີ ${year} ແລ້ວ · ${n} ລາຍການ`);
  });
}

function statusTag(inv){
  if(inv.payment_status === 'paid') return '· <span style="color:var(--ok);font-weight:600;">ຈ່າຍຄົບ</span>';
  const remain = Number(inv.total_amount||0) - Number(inv.paid_amount||0);
  if(inv.payment_status === 'partial') return `· <span class="gold">ຄ້າງ ${fmtMoney(remain)}</span>`;
  return `· <span style="color:var(--danger);font-weight:600;">ຍັງບໍ່ຈ່າຍ</span>`;
}

async function getInvoiceItems(invoiceId){
  return await sb(`sales_invoice_items?select=*,stock_product_models(name,unit,code,cost_price,cost_price_thb),stock_product_units(cost_lak)&invoice_id=eq.${invoiceId}`);
}
async function getInvoicePayments(invoiceId){
  return await sb(`sales_payments?select=*&invoice_id=eq.${invoiceId}&order=payment_date.asc`);
}

async function openInvoiceDetail(invoiceId, inv){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><div class="empty">ກຳລັງໂຫລດ...</div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click', (e)=>{ if(e.target === bg) bg.remove(); });
  await refreshInvoiceDetail(bg, invoiceId, inv);
}

async function refreshInvoiceDetail(bg, invoiceId, inv){
  try{
    const [items, payments] = await Promise.all([getInvoiceItems(invoiceId), getInvoicePayments(invoiceId)]);
    const remain = Number(inv.total_amount||0) - Number(inv.paid_amount||0);
    const invCurrency = inv.currency || 'LAK';
    const { profit: itemProfit, unknownCostCount } = computeInvoiceItemProfit(items, invCurrency);
    const profitByPaid = splitByPaidCurrency(itemProfit, invCurrency, Number(inv.total_amount||0), payments);
    const paidCurrencies = [...new Set(payments.map(p=> p.currency || invCurrency))].filter(c=> c !== invCurrency);
    const discount = Number(inv.discount_amount||0);
    const subtotal = Number(inv.total_amount||0) + discount;
    const address = [inv.village, inv.district, inv.province].filter(Boolean).join(' · ');
    bg.querySelector('.modal').innerHTML = `
      ${paperHtml(invoiceDocBody(inv, items, payments))}
      <!-- ຂໍ້ມູນພາຍໃນຮ້ານ (ກຳໄລ / ປະຫວັດການຈ່າຍ) — ບໍ່ຂຶ້ນເທິງໃບທີ່ພິມໃຫ້ລູກຄ້າ -->
      ${currentRole==='admin' ? `<div class="row" style="font-size:12px;"><span class="gold">ກຳໄລບິນນີ້ (ແອດມິນ)${unknownCostCount ? ' *' : ''}</span><span class="gold mono">${fmtByCurrency(profitByPaid)}</span></div>` : ''}
      ${currentRole==='admin' && unknownCostCount ? `<div class="muted" style="font-size:11px;margin-top:-4px;">* ບໍ່ນັບລວມ ${unknownCostCount} ລາຍການທີ່ຍັງບໍ່ໄດ້ຕັ້ງຕົ້ນທຶນສະກຸນບາດໄວ້ (ໄປຕັ້ງທີ່ໜ້າສິນຄ້າ)</div>` : ''}
      <div class="doc-section-label" style="margin-top:10px;">ການຈ່າຍເງິນ</div>
      ${payments.length ? payments.map(p=> `
        <div class="row" style="font-size:12px;">
          <span>${p.method==='cash'?'ເງິນສົດ':'ໂອນ'} · ${p.currency||inv.currency||'LAK'} · ${fmtDateDMY(p.payment_date)}</span>
          <span class="mono">${fmtMoney(p.amount)}${p.exchange_rate ? ' <span class="muted" style="font-size:11px;">(@'+p.exchange_rate+')</span>' : ''}</span>
        </div>`).join('') : '<div class="empty">ຍັງບໍ່ມີການຈ່າຍບັນທຶກໄວ້</div>'}
      <div class="doc-line" style="font-size:12px;"><svg class="dv-icon"><use href="#i-users"></use></svg>ອອກບິນໂດຍ: <span style="color:var(--ink);font-weight:600;">${inv.created_by || '-'}</span></div>
      <hr class="sep">
      ${remain > 0 ? `
        <div class="row" style="font-size:12px;"><span class="gold">ຍັງຄ້າງ (${inv.currency||'LAK'})</span><span class="gold mono">${fmtMoney(remain)}</span></div>
        <hr class="sep">
        <div class="muted" style="font-size:12px;margin-bottom:4px;">ຮັບຊຳລະເພີ່ມ ​· ຮັບໄດ້ທັງກີບ ຫຼື ບາດ</div>
        <div class="grid2">
          <select id="pay_method">
            <option value="cash">ເງິນສົດ</option>
            <option value="transfer">ໂອນ</option>
          </select>
          <select id="pay_currency">
            <option value="LAK">ກີບ (LAK)</option>
            <option value="THB">ບາດ (THB)</option>
          </select>
        </div>
        <input id="pay_amount" type="text" placeholder="ຈຳນວນ" style="margin-top:8px;">
        <div id="pay_rateBlock" style="display:none;">
          <label>ອັດຕາແລກປ່ຽນມື້ນີ້ (1 ບາດ = ? ກີບ)</label>
          <input id="pay_rate" type="text" placeholder="ເຊັ່ນ 620">
        </div>
        <button class="btn secondary" id="pay_submit"><svg class="dv-icon"><use href="#i-wallet"></use></svg>ບັນທຶກການຈ່າຍ</button>
      ` : ''}
      <button class="btn secondary" id="invPrintBtn" style="margin-top:16px;"><svg class="dv-icon"><use href="#i-printer"></use></svg>ພິມບິນຂາຍ (A5)</button>
      ${(currentRole==='admin'||currentRole==='staff') ? `<button class="btn secondary" id="invEditBtn" style="margin-top:8px;"><svg class="dv-icon"><use href="#i-pencil"></use></svg>ແກ້ໄຂບິນ (ລາຍການ/ຈຳນວນ/ການຈ່າຍ)</button>` : ''}
      ${currentRole==='admin' ? `<button class="btn danger" id="invDeleteBtn" style="margin-top:8px;"><svg class="dv-icon"><use href="#i-trash"></use></svg>ລົບບິນນີ້ (ຄືນສະຕັອກ)</button>` : ''}
      <button class="btn ${remain>0?'secondary':''}" id="invDetailClose">ປິດ</button>
    `;
    if(remain > 0){
      attachMoneyInput('pay_amount', '');
      bindEnterKey(['pay_amount'], 'pay_submit');
      const invCurrency = inv.currency || 'LAK';
      document.getElementById('pay_currency').value = invCurrency;
      document.getElementById('pay_currency').addEventListener('change', ()=>{
        document.getElementById('pay_rateBlock').style.display =
          document.getElementById('pay_currency').value !== invCurrency ? 'block' : 'none';
      });
      bg.querySelector('#pay_submit').addEventListener('click', async ()=>{
        const amt = moneyValue('pay_amount');
        if(!amt){ toast('ໃສ່ຈຳນວນເງິນ'); return; }
        const payCurrency = document.getElementById('pay_currency').value;
        let rate = null, convertedAmt = amt;
        if(payCurrency !== invCurrency){
          rate = Number((document.getElementById('pay_rate').value||'').replace(/,/g,''));
          if(!rate){ toast('ໃສ່ອັດຕາແລກປ່ຽນເພື່ອກວດຍອດຊຳລະ'); return; }
          /* rate = 1 THB ເປັນຈຳນວນກີບ ສະເໝີ, ໃຊ້ແປງໃຫ້ຢູ່ໃນສະກຸນຂອງບິນເພື່ອກວດຍອດຄ້າງເທົ່ານັ້ນ (ຈຳນວນທີ່ຮັບແທ້ໆເກັບໄວ້ຄືເດີມ) */
          convertedAmt = invCurrency === 'LAK' ? amt * rate : amt / rate;
        }
        try{
          await sb('sales_payments', { method:'POST', body:{
            id: uid(), invoice_id: invoiceId, payment_date: todayStr(),
            method: bg.querySelector('#pay_method').value, currency: payCurrency,
            amount: amt, exchange_rate: rate, converted_amount: convertedAmt, created_by: currentUsername
          }});
          const newPaid = Number(inv.paid_amount||0) + convertedAmt;
          const newStatus = newPaid >= Number(inv.total_amount||0) ? 'paid' : 'partial';
          await sb(`sales_invoices?id=eq.${invoiceId}`, { method:'PATCH', body:{ paid_amount: newPaid, payment_status: newStatus } });
          inv.paid_amount = newPaid;
          inv.payment_status = newStatus;
          toast('ບັນທຶກການຈ່າຍສຳເລັດ');
          await refreshInvoiceDetail(bg, invoiceId, inv);
          renderTab();
        }catch(err){ toast('ຜິດພາດ: '+err.message); }
      });
    }
    if(currentRole==='admin'){
      bg.querySelector('#invDeleteBtn').addEventListener('click', async ()=>{
        if(!await confirmDelete(`ລົບບິນຂາຍ ${inv.invoice_no || ''} ?`, 'ສະຕັອກທີ່ຫັກໄປຈະຄືນທັງໝົດ')) return;
        try{
          await voidInvoice(invoiceId, items);
          toast('ລົບບິນສຳເລັດ ຄືນສະຕັອກແລ້ວ');
          bg.remove();
          renderTab();
        }catch(err){ toast('ຜິດພາດ: '+err.message); }
      });
    }
    /* ເປີດໜ້າຕ່າງພິມຈາກການກົດປຸ່ມໂດຍກົງ (ຂໍ້ມູນບິນມີຢູ່ໃນມືແລ້ວ ບໍ່ຕ້ອງໂຫລດຊ້ຳ) */
    bg.querySelector('#invPrintBtn').addEventListener('click', ()=>{
      const w = openPrintWindow();
      if(w) printInvoiceDoc(inv, items, payments, { win: w });
    });
    const invEditBtn = bg.querySelector('#invEditBtn');
    if(invEditBtn) invEditBtn.addEventListener('click', ()=>{ bg.remove(); startInvoiceEdit(invoiceId, inv, items, payments); });
    bg.querySelector('#invDetailClose').addEventListener('click', ()=> bg.remove());
  }catch(err){
    bg.querySelector('.modal').innerHTML = `<div class="empty">ຜິດພາດ: ${err.message}</div><button class="btn secondary" id="invDetailClose2">ປິດ</button>`;
    bg.querySelector('#invDetailClose2').addEventListener('click', ()=> bg.remove());
  }
}

/* ລົບບິນຂາຍ: ຄືນສະຕັອກທັງໝົດ (ເຄື່ອງທີ່ມີເລກເຄື່ອງກັບເປັນ in_stock, ລົບ movement ຂາອອກ) ແລ້ວຄ່ອຍລົບບິນ (cascade ລົບ items/payments ໃຫ້ອັດຕະໂນມັດ) */
async function voidInvoice(invoiceId, items){
  await Promise.all(items.map(it=>{
    if(it.unit_id){
      return sb(`stock_product_units?id=eq.${it.unit_id}`, { method:'PATCH', body:{ status:'in_stock', sold_at:null } });
    }
    return Promise.resolve();
  }));
  await sb(`stock_movements?ref_type=eq.sale&ref_id=eq.${invoiceId}`, { method:'DELETE' });
  await sb(`sales_invoices?id=eq.${invoiceId}`, { method:'DELETE' });
}
/* ລົບບິນຂາຍຫຼາຍໃບພ້ອມກັນ ດ້ວຍ 3 request ລວມ (ບໍ່ວ່າຈະເລືອກຈັກໃບ) ແທນທີ່ຈະດຶງ/ລົບເທື່ອລະໃບ ໄວກວ່າຫຼາຍເມື່ອເລືອກຫຼາຍໆໃບ */
async function bulkVoidInvoices(ids){
  const idList = ids.join(',');
  const items = await sb(`sales_invoice_items?select=unit_id&invoice_id=in.(${idList})`);
  const unitIds = [...new Set(items.filter(it=> it.unit_id).map(it=> it.unit_id))];
  await Promise.all([
    unitIds.length ? sb(`stock_product_units?id=in.(${unitIds.join(',')})`, { method:'PATCH', body:{ status:'in_stock', sold_at:null } }) : Promise.resolve(),
    sb(`stock_movements?ref_type=eq.sale&ref_id=in.(${idList})`, { method:'DELETE' })
  ]);
  await sb(`sales_invoices?id=in.(${idList})`, { method:'DELETE' });
}

if(savedSession){
  try{
    const s = JSON.parse(savedSession);
    currentRole = s.role; currentUsername = s.username; currentUserFullName = s.name;
    enterApp();
  }catch(e){ sessionStorage.removeItem('dv_stock_session'); }
}
</script>
