<html lang="lo">
<head>

<!-- ══ HUB AUTH GUARD — ຕ້ອງ login ຜ່ານ hub.html ແລະ ບັນຊີຕ້ອງມີສິດ module "stock" ══ -->
<script>
(function(){
  var MODULE='stock';
  var u=null;
  try{ u=JSON.parse(sessionStorage.getItem('daovone_hub_user')||'null'); }catch(e){}
  var ok = u && Array.isArray(u.modules) && u.modules.indexOf(MODULE)!==-1;
  if(!ok){
    try{ (window.top||window).location.replace('hub.html'); }
    catch(e){ location.replace('hub.html'); }
  }
})();
</script>
<title>Davone Shop - ລະບົບສະຕັອກ &amp; ບິນຂາຍ</title>
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=3">
<link rel="apple-touch-icon" sizes="192x192" href="assets/icon-192.png?v=3">
<link rel="apple-touch-icon" sizes="512x512" href="assets/icon-512.png?v=3">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=3">
<link rel="shortcut icon" href="assets/favicon.ico?v=3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Lao:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F3ED; --panel:#FFFFFF; --panel2:#EFEAE0; --border:#DBD2C0;
    --orange:#B8471C; --orange-soft:#B8471C; --ink:#2A241E; --muted:#7C7266;
    --danger:#A23327; --ok:#3E7A52;
    --font-body:'Noto Serif Lao','Source Serif 4',Georgia,serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--ink);min-height:100vh;}
  #app{width:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
  .narrow{max-width:520px;margin:0 auto;width:100%;}

  /* ---- Login ---- */
  #loginScreen{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;}
  .brand{text-align:center;margin-bottom:28px;}
  .brand .name{font-size:22px;letter-spacing:1px;color:var(--orange-soft);font-weight:600;}
  .brand .sub{font-size:13px;color:var(--muted);margin-top:4px;}
  .login-form{width:100%;max-width:300px;display:flex;flex-direction:column;gap:12px;margin-top:6px;}
  .login-input{width:100%;padding:13px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--ink);font-size:15px;font-family:var(--font-body);outline:none;}
  .login-input:focus{border-color:var(--orange);}
  .login-btn{width:100%;padding:13px;border:none;border-radius:8px;background:var(--orange);color:#fff;font-weight:600;font-size:14px;letter-spacing:.03em;font-family:var(--font-body);margin-top:2px;}
  .login-btn:active{filter:brightness(.92);}
  .loginErr{color:var(--danger);font-size:13px;min-height:18px;margin-top:2px;text-align:center;}

  /* ---- Header / Nav ---- */
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;gap:10px;}
  .head-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .seal-mark{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;border-radius:50%;border:1.4px solid var(--orange);color:var(--orange);}
  .seal-mark::before{content:'';position:absolute;inset:3px;border:1px dashed var(--orange);border-radius:50%;}
  .seal-mark .dv-icon{width:15px;height:15px;}
  header .title{font-size:15px;color:var(--orange-soft);font-weight:700;line-height:1.2;}
  header .role{font-size:11px;color:var(--muted);}
  header .logout{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:6px 10px;font-size:12px;display:inline-flex;align-items:center;gap:5px;font-family:var(--font-body);}

  nav{display:flex;overflow-x:auto;background:var(--panel2);border-bottom:1px solid var(--border);}
  nav button{flex:1;min-width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);padding:8px 4px 7px;font-size:10.5px;border-bottom:2px solid transparent;white-space:nowrap;font-family:var(--font-body);}
  nav button.active{color:var(--orange-soft);border-bottom:2px solid var(--orange);font-weight:600;}

  main{flex:1;padding:14px 14px 90px;overflow-y:auto;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
  .card h3{margin:0 0 10px;font-size:14px;color:var(--orange-soft);border-bottom:1px solid var(--border);padding-bottom:8px;display:flex;align-items:center;gap:7px;}
  .card h3 .dv-icon{color:var(--orange);}
  .row{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:flex-start;gap:10px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .row>span:first-child{flex:1 1 auto;min-width:0;}
  .row>span:last-child{flex:none;white-space:nowrap;text-align:right;}
  .row>span:only-child{flex:1 1 auto;white-space:normal;text-align:left;}
  .muted{color:var(--muted);}
  .gold{color:var(--orange-soft);}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;}
  input,select,textarea{width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-size:14px;}
  input:focus,select:focus,textarea:focus{outline:1px solid var(--orange);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--orange);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:600;width:100%;margin-top:10px;font-family:var(--font-body);}
  .btn.secondary{background:none;border:1px solid var(--orange);color:var(--orange-soft);}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.small{width:auto;padding:6px 10px;font-size:12px;margin-top:0;}
  .btn .dv-icon{width:15px;height:15px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--panel2);border-radius:10px;padding:12px;text-align:center;}
  .stat .num{font-size:19px;color:var(--orange-soft);font-weight:700;font-variant-numeric:tabular-nums;}
  .stat .num.money{font-size:15px;}
  .stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;}
  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:12px;}
  /* ຈໍໃຫຍ່: ແຕ່ລະສະກຸນຂຶ້ນແຖວໃໝ່ ຄືກັບ <br> ເກົ່າ (ຢ່າປ່ຽນໜ້າຕາ desktop) */
  .cur-stack{display:inline-block;}
  .cur-line{display:block;white-space:nowrap;}
  .cur-unit{margin-left:5px;}
  .tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--border);color:var(--muted);white-space:nowrap;vertical-align:middle;}
  .tag.ok{border-color:var(--ok);color:var(--ok);}
  .tag.sold{border-color:var(--danger);color:var(--danger);}
  .list-item{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .list-item:last-child{border-bottom:none;}
  .list-item>span:first-child,.list-item>div:first-child{flex:1 1 auto;min-width:0;}
  .list-item>span:last-child,.list-item>div:last-child{flex:none;white-space:nowrap;text-align:right;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:20px 0;}
  /* ---- ສະຫຼຸບປີ (ຂາຍດີ / ບໍ່ໄດ້ຂາຍ ແຍກປະເພດ) ---- */
  .yr-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .yr-item:last-child{border-bottom:none;}
  .yr-top{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:baseline;gap:10px;}
  .yr-top .nm{flex:1 1 auto;min-width:0;}
  .yr-top .qt{flex:none;white-space:nowrap;font-weight:700;color:var(--orange-soft);font-variant-numeric:tabular-nums;}
  .yr-rank{color:var(--muted);font-weight:600;margin-right:3px;font-variant-numeric:tabular-nums;}
  .yr-bar{height:6px;background:var(--panel2);border-radius:4px;margin-top:6px;overflow:hidden;}
  .yr-bar i{display:block;height:100%;background:var(--orange);border-radius:4px;}
  .yr-item.zero .qt{color:var(--muted);font-weight:600;}
  .yr-item.zero .nm{color:var(--muted);}
  .yr-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .yr-split{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin:10px 0 2px;padding-top:8px;border-top:1px dashed var(--border);}
  /* ກ່ອງສະຖິຕິທີ່ກົດໄດ້ → ເປີດລາຍການ ແລ້ວເລື່ອນລົງໄປຫາ */
  button.stat{font:inherit;color:inherit;border:1px solid transparent;width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s,background .15s;}
  button.stat:hover{border-color:var(--orange);}
  button.stat.active{border-color:var(--orange);background:#F6E3D6;}
  button.stat .go{display:block;font-size:10px;color:var(--orange-soft);margin-top:3px;opacity:.8;}
  #yr_panel .card, #yr_cats{scroll-margin-top:70px;}
  .yr-flash{animation:yrFlash 1.2s ease-out;}
  @keyframes yrFlash{0%{box-shadow:0 0 0 3px var(--orange);}100%{box-shadow:0 0 0 3px transparent;}}
  .yr-item.link{cursor:pointer;}
  .yr-item.link:hover .nm{color:var(--orange-soft);}
  .yr-close{margin-left:auto;background:none;border:none;color:var(--muted);font-size:18px;line-height:1;padding:0 4px;cursor:pointer;}
  .cart-item{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;}
  .cart-item .x{color:var(--danger);font-size:16px;padding:0 6px;}
  .rcv-seq{color:var(--muted);font-weight:600;margin-right:2px;font-variant-numeric:tabular-nums;}
  .rcv-count-badge{display:inline-block;background:var(--orange-soft);color:#fff;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;vertical-align:middle;margin-left:6px;}
  .rcv-count-badge:empty{display:none;}
  .search-box{position:relative;margin-bottom:8px;}
  .picker-list{max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;margin-top:6px;}
  .picker-row{padding:9px 10px;border-bottom:1px solid var(--border);font-size:13px;}
  .picker-row:last-child{border-bottom:none;}
  .picker-row .n{color:var(--ink);}
  .picker-row .p{color:var(--orange-soft);font-size:12px;}
  .toast-container{position:fixed;left:0;right:0;top:calc(66px + env(safe-area-inset-top));z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none;}
  .toast{background:var(--ink);border:none;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);text-align:center;max-width:440px;animation:toastIn .18s ease-out;display:flex;align-items:center;gap:7px;justify-content:center;font-family:var(--font-body);}
  .toast .dv-icon{color:#8fd0a0;width:15px;height:15px;flex:none;}
  @keyframes toastIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:50;}
  .modal{background:var(--panel);border-top:1px solid var(--border);border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:520px;margin:0 auto;max-height:85vh;overflow-y:auto;}
  .modal h3{margin-top:0;color:var(--orange-soft);display:flex;align-items:center;gap:7px;}
  .invoice-total{font-size:20px;color:var(--orange-soft);font-weight:700;text-align:right;margin-top:10px;font-variant-numeric:tabular-nums;}

  /* ---- Document-style card (receipt / transfer note), mimics printed receipt layout ---- */
  .doc-card{margin:-16px -16px 14px;border-radius:16px 16px 0 0;overflow:hidden;background:var(--panel);border:1px solid var(--border);border-top:none;}
  .doc-head{background:linear-gradient(135deg,var(--orange),#D9752F);color:#fff;padding:16px 18px 14px;}
  .doc-head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .doc-brand{display:flex;align-items:center;gap:8px;min-width:0;}
  .doc-brand .seal-mark{width:32px;height:32px;border-color:#fff;color:#fff;flex:none;}
  .doc-brand .seal-mark::before{border-color:rgba(255,255,255,.6);}
  .doc-brand-name{font-weight:700;font-size:14px;letter-spacing:.4px;white-space:nowrap;}
  .doc-head-title{text-align:right;flex:none;}
  .doc-head-title h3{margin:0;color:#fff;font-size:14px;justify-content:flex-end;font-family:var(--font-mono);}
  .doc-head-meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:9px;font-size:11px;}
  .doc-tag{font-size:11px;font-weight:700;border:1.3px solid rgba(255,255,255,.9);border-radius:6px;padding:3px 8px;color:#fff;white-space:nowrap;background:rgba(0,0,0,.18);text-shadow:0 1px 2px rgba(0,0,0,.35);}
  .doc-tag.solid{background:rgba(0,0,0,.36);border-color:transparent;}
  .doc-tag.solid, .doc-tag.solid *{color:#fff !important;}
  .doc-body{padding:14px 18px 2px;}
  .doc-box{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:flex-start;}
  .doc-avatar{width:38px;height:38px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
  .doc-avatar .dv-icon{width:18px;height:18px;}
  .doc-box-info{flex:1;min-width:0;}
  .doc-line{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);margin-top:4px;}
  .doc-line:first-child{margin-top:0;}
  .doc-line .dv-icon{width:13px;height:13px;color:var(--orange-soft);flex:none;}
  .doc-section-label{font-size:11px;font-weight:700;color:var(--orange-soft);letter-spacing:.02em;margin:2px 0 6px;}
  .doc-table-head{display:flex;flex-wrap:nowrap;justify-content:space-between;gap:10px;background:var(--orange);color:#fff;font-size:11px;font-weight:700;padding:7px 12px;border-radius:8px 8px 0 0;}
  .doc-table-body{border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;padding:0 12px;margin-bottom:12px;}
  .doc-table-body .row{font-size:12.5px;}
  .doc-total-band{background:var(--orange);color:#fff;border-radius:9px;padding:10px 14px;display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:center;gap:10px;font-size:16px;font-weight:700;margin:6px 0 14px;}
  .doc-total-band span:last-child{white-space:nowrap;flex:none;}
  .doc-footer{padding:12px 18px;border-top:1px solid var(--border);background:var(--panel2);text-align:center;font-size:11px;color:var(--muted);}
  /* ---- ກະດາດຕົວຢ່າງໃນແອັບ: ໜ້າຕາອັນດຽວກັນກັບໃບ A5 ທີ່ພິມອອກມາ (ເຫັນແນວໃດ ພິມແນວນັ້ນ) ---- */
  .paper{background:#E6DFD0;padding:12px;border-radius:14px;margin:-16px -16px 14px;}
  .paper-sheet{background:#FFFFFF;color:#22211d;border-radius:8px;padding:16px 16px 20px;overflow-x:auto;
    font-family:'Lao MN','Lao Sangam MN','Noto Sans Lao','Phetsarath OT',Arial,sans-serif;font-size:13px;line-height:1.5;
    box-shadow:0 10px 26px -14px rgba(0,0,0,.6);}
  .paper .shop-header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:linear-gradient(135deg,#0d1c44 0%,#1b3068 55%,#12224f 100%);color:#fff;}
  .paper .shop-logo{width:46px;height:46px;flex:none;border-radius:50%;overflow:hidden;background:#000;box-shadow:0 0 0 2px #d9b85c;}
  .paper .shop-logo img{width:100%;height:100%;display:block;object-fit:cover;}
  .paper .shop-id{flex:1;min-width:0;}
  .paper .shop-name{font-size:14.5px;font-weight:700;margin:0;line-height:1.45;color:#fff;}
  .paper .shop-branch{display:block;font-size:13px;font-weight:700;color:#f0d28a;margin:2px 0 0;line-height:1.4;}
  .paper .shop-meta{font-size:11px;color:rgba(255,255,255,.78);line-height:1.6;margin:3px 0 0;}
  .paper .shop-rule{height:4px;border-radius:3px;margin:7px 0 0;background:linear-gradient(90deg,#a8801f,#f0d28a 45%,#a8801f);}
  .paper h1{font-size:19px;font-weight:700;margin:22px 0 4px;text-align:center;color:#14265c;display:block;font-family:inherit;}
  .paper .sub{font-size:11.5px;color:#6b6a63;margin:0;text-align:center;}
  .paper .sub::after{content:"";display:block;width:96px;height:4px;border-radius:2px;margin:12px auto 0;background:linear-gradient(90deg,#d9b85c,#a8801f);}
  .paper .cust{margin:16px 0;padding:12px 14px;background:#FBF6EA;border-left:4px solid #d9b85c;border-radius:8px;font-size:12.5px;line-height:1.85;color:#2a2a2a;}
  .paper .cust-split{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;}
  .paper .cust-info{flex:1;min-width:0;}
  .paper .cust-pay{font-size:12px;font-weight:700;color:#8a6a1e;text-align:right;max-width:55%;}
  .paper .meta-row{text-align:left;}
  .paper .meta-row b{color:#14265c;margin-right:6px;}
  .paper table{width:100%;border-collapse:separate;border-spacing:0;margin-top:12px;}
  .paper thead{display:table-header-group;}
  .paper thead th{background:#14265c;color:#fff;font-size:11.5px;font-weight:700;padding:8px;text-align:left;}
  .paper thead th:first-child{border-radius:8px 0 0 8px;}
  .paper thead th:last-child{border-radius:0 8px 8px 0;}
  .paper tbody td{padding:9px 8px;border-bottom:1px solid #E4DCC8;text-align:left;font-size:12.5px;color:#22211d;font-weight:500;}
  .paper tbody td:first-child{width:1%;white-space:nowrap;font-weight:700;color:#14265c;}
  .paper th.num,.paper td.num{text-align:right;white-space:nowrap;width:1%;padding-left:12px;}
  .paper tr{break-inside:avoid;page-break-inside:avoid;}
  .paper .sub-total{display:flex;justify-content:space-between;padding:4px 2px;font-size:13px;color:#2a2a2a;}
  .paper table + .sub-total{margin-top:10px;}
  .paper .grand{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding:13px 16px;border-radius:10px;background:linear-gradient(135deg,#0d1c44,#1b3068);color:#fff;font-size:17px;font-weight:700;}
  .paper .grand span:last-child{color:#f0d28a;text-align:right;white-space:nowrap;}
  .paper .signs{display:flex;gap:28px;margin-top:44px;break-inside:avoid;page-break-inside:avoid;}
  .paper .sign{flex:1;text-align:center;}
  .paper .sign-line{height:46px;border-bottom:1px dotted #9a9488;margin-bottom:6px;}
  .paper .sign-label{font-size:12.5px;font-weight:700;color:#14265c;margin:0;}
  .paper .sign-sub{font-size:11.5px;color:#6b6a63;margin:2px 0 0;}
  .paper .thanks{text-align:center;margin-top:26px;font-size:13px;font-weight:700;color:#14265c;}
  .paper .sheet-bar{height:4px;border-radius:3px;margin-top:18px;background:linear-gradient(90deg,#a8801f,#f0d28a 45%,#a8801f);}
  .paper .c{color:#8B8677;font-size:11px;font-weight:500;}
  .paper .note{font-size:11.5px;color:#3A382F;margin:8px 0 0;}
  @media (min-width:860px){
    .paper{margin:-28px -32px 16px;}
    .paper-sheet{max-width:640px;margin:0 auto;padding:24px 26px 28px;}
  }
  @media (min-width:860px){
    .doc-card{margin:-28px -32px 16px;border-radius:16px;}
  }
  /* ================= ມືຖືເທົ່ານັ້ນ (ຈໍໃຫຍ່ເລີ່ມທີ່ 860px ຈຶ່ງບໍ່ຖືກກະທົບ) ================= */
  @media (max-width:859px){
    /* ມີ 7 ແທັບແລ້ວ — ຫຍໍ້ຄວາມກວ້າງລົງໜ້ອຍໜຶ່ງ ໃຫ້ພໍດີໜ້າຈໍມືຖື ບໍ່ຕ້ອງເລື່ອນຫາ */
    nav button{min-width:54px;font-size:10px;padding-left:2px;padding-right:2px;}
    /* ກ່ອງສະຖິຕິ: ວາງເປັນແຖວລະອັນ ປ້າຍຊ້າຍ ຕົວເລກຂວາ ຈຶ່ງບໍ່ຫັກແຖວເມື່ອຕົວເລກຍາວ */
    .stats-row{grid-template-columns:1fr;gap:6px;}
    .stat{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:10px 12px;}
    .stat .lbl{order:-1;margin-top:0;font-size:12px;flex:0 0 auto;}
    .stat .num{text-align:right;min-width:0;}
    /* ກ່ອງທີ່ກົດໄດ້ເທິງມືຖື: ຊ່ອນຂໍ້ຄວາມ "ເບິ່ງ..." ໃສ່ລູກສອນ › ທາງຂວາແທນ */
    button.stat .go{display:none;}
    button.stat .num{margin-left:auto;}
    button.stat::after{content:'›';color:var(--orange-soft);font-size:18px;line-height:1;flex:none;}
    /* ຈຳນວນເງິນຊິດຂວາ ໜ່ວຍ (ກີບ/ບາດ) ກວ້າງເທົ່າກັນ ຈຶ່ງຕົງເປັນຖັນ ບໍ່ວ່າຕົວເລກຈະຍາວເທົ່າໃດ */
    .cur-stack{display:block;}
    .cur-line{display:flex;justify-content:flex-end;align-items:baseline;gap:6px;}
    .cur-amt{text-align:right;}
    .cur-unit{margin-left:0;flex:0 0 2.6em;text-align:left;}
    /* iOS ບໍ່ຍອມໃຫ້ input[type=date/month] ຫົດຕາມກ່ອງ ຈຶ່ງລົ້ນອອກນອກຂອບ ຕ້ອງປິດ appearance ແລະ ປົດ min-width */
    input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;height:auto;text-align:left;}
    /* ໜ້າສິນຄ້າ (ມືຖື): ຊື່ຢູ່ແຖວເທິງເຕັມແຖວ (ຕັດຄຳຊື່ຍາວໆໄດ້) ຈຶ່ງບໍ່ທັບລາຄາ ແລ້ວ ລາຄາ+ປຸ່ມ ຢູ່ແຖວລຸ່ມ */
    #prod_list .row{flex-wrap:wrap;align-items:center;}
    #prod_list .row > span:first-child{flex:1 1 100%;min-width:0;overflow-wrap:anywhere;margin-bottom:4px;}
    #prod_list .row .row-actions{flex:1 1 100%;align-items:center;gap:6px;}
    #prod_list .row .row-actions > span:first-child{flex:1 1 auto;min-width:0;text-align:left;}
  }
  /* ປຸ່ມເລືອກຊ່ອງທາງຈ່າຍ (ແທນ dropdown ເກົ່າ) — ເຫັນທຸກທາງເລືອກພ້ອມກັນ ບໍ່ຕ້ອງກົດເປີດ */
  .pay-chips{display:flex;gap:6px;}
  .pay-chips button{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--muted);
    border-radius:20px;padding:9px 4px;font-size:13px;font-family:var(--font-body);cursor:pointer;}
  .pay-chips button[aria-pressed="true"]{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:600;}
  .pay-quick{display:flex;gap:6px;margin-top:6px;}
  .pay-quick button{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--muted);
    border-radius:6px;padding:6px 4px;font-size:11.5px;font-family:var(--font-mono);cursor:pointer;}
  .switch{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0;}
  .icon{width:16px;height:16px;display:inline-block;vertical-align:middle;}
  hr.sep{border:none;border-top:1px solid var(--border);margin:12px 0;}

  .body-row{display:flex;flex-direction:column;flex:1;min-height:0;}
  .card-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  .row-actions{display:flex;gap:8px;align-items:center;}
  .icon-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:5px 9px;font-size:12px;line-height:1;display:inline-flex;align-items:center;gap:4px;font-family:var(--font-body);}
  .icon-btn:hover{color:var(--orange-soft);border-color:var(--orange);}
  .icon-btn .dv-icon{width:12px;height:12px;}

  /* ---- Icons & mono reference codes ---- */
  .dv-icon{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;}
  .mono{font-family:var(--font-mono);letter-spacing:-.01em;}

  /* ===================== DESKTOP / MacBook LAYOUT ===================== */
  @media (min-width:860px){
    body{padding:0;}
    #loginScreen{min-height:100vh;}
    header{padding:16px 28px;}
    header .title{font-size:17px;}
    .body-row{flex-direction:row;align-items:stretch;}
    nav{
      flex-direction:column;overflow-x:visible;width:190px;flex:none;
      border-bottom:none;border-right:1px solid var(--border);
      position:sticky;top:53px;align-self:flex-start;height:calc(100vh - 53px);
    }
    nav button{
      flex:none;width:100%;flex-direction:row;justify-content:flex-start;text-align:left;padding:13px 20px;font-size:13px;
      border-bottom:none;border-left:3px solid transparent;
    }
    nav button .dv-icon{width:16px;height:16px;}
    nav button.active{border-left:3px solid var(--orange);border-bottom:none;background:var(--panel2);}
    main{flex:1;padding:26px 40px 70px;max-width:1560px;}
    .card{padding:18px 22px;}
    .card-grid.cols-2{grid-template-columns:1fr 1fr;}
    .card-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
    .stats-row{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));max-width:1100px;}
    .login-btn:hover{filter:brightness(1.06);cursor:pointer;}
    nav button:hover{color:var(--orange-soft);cursor:pointer;}
    .logout:hover{border-color:var(--orange);cursor:pointer;}
    .list-item, .row{cursor:default;}
    .row.clickable, .list-item.clickable{cursor:pointer;}
    .row.clickable:hover, .list-item.clickable:hover{background:var(--panel2);border-radius:6px;}
    .modal-bg{align-items:center;}
    .modal{border-radius:16px;width:90vw;max-width:900px;max-height:88vh;padding:28px 32px;}
    .modal input, .modal select, .modal textarea{padding:11px 13px;font-size:15px;}
    .modal label{font-size:13px;margin:12px 0 5px;}
    .icon-btn{padding:7px 13px;font-size:13px;}
    .btn.small{padding:8px 15px;font-size:13px;}
  }
  /* ຊ່ອງຄົ້ນຫາສິນຄ້າ (ພິມຊື່/ລະຫັດເພື່ອກັ່ນຕອງ ແທນການເລື່ອນລິດຢາວໆ) */
  .model-search-wrap{position:relative;}
  .model-search-dropdown{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--border);border-radius:8px;max-height:260px;overflow-y:auto;z-index:60;box-shadow:0 10px 24px -8px rgba(0,0,0,.3);}
  .model-search-item{padding:10px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--border);}
  .model-search-item:last-child{border-bottom:none;}
  .model-search-meta{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:2px;}
  .model-search-item:hover,.model-search-item.active{background:var(--panel2);}
  .model-search-empty{padding:10px 12px;font-size:13px;color:var(--muted);}
  /* ══════════ HUB THEME — ແບບສະຫວ່າງ (ນ້ຳເງິນເຂັ້ມ + ທອງ ເທິງພື້ນຄີມ) ══════════
     ໂທນດຽວກັບ ສາຂາເມືອງຮຸນ · ປ່ຽນແຕ່ໜ້າຈໍ; ໃບບິນ/ໃບໂອນ ຕົວຢ່າງກະດາດ ແລະ ຕອນພິມ ຍັງເປັນເຈ້ຍຂາວຄືເກົ່າ */
  @media screen{
  :root{
    --bg:#f2eee4; --panel:#fffdf8; --panel2:#f8f3e9; --border:#e4ddcd;
    --orange:#a57a36; --orange-soft:#8a6224; --ink:#1b2437; --muted:#57607a;
    --danger:#b3382a; --ok:#2f7d57;
    --font-body:'Lao MN','Noto Sans Lao','Lao Sangam MN',-apple-system,sans-serif;
    --hub-navy:linear-gradient(170deg,#0b1a3d,#16284f 60%,#0b1a3d);
    --hub-grad:linear-gradient(135deg,#f6dc9c,#d4a85a 55%,#a57a36);
  }
  html,body{background:var(--bg);}
  body{color:var(--ink);}
  #app{background:transparent;}
  input,select,textarea{border-radius:9px;background:#fffdf8;border-color:#ded6c4;}
  input::placeholder,textarea::placeholder{color:#a9a294;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#a57a36;box-shadow:0 0 0 3px rgba(165,122,54,.15);}

  /* ── ຫົວ + ເມນູ = ນ້ຳເງິນເຂັ້ມ ຕັດເສັ້ນທອງ ── */
  header{background:var(--hub-navy);border-bottom:2px solid #d4a85a;box-shadow:0 2px 14px rgba(11,26,61,.18);}
  .shop-logo{width:38px;height:38px;flex:none;border-radius:50%;overflow:hidden;background:#000;
    box-shadow:0 0 0 2px #e9c27a,0 0 14px 2px rgba(255,190,90,.45);}
  .shop-logo img{width:100%;height:100%;display:block;transform:scale(1.15);}
  header .title{font-size:16px;font-weight:800;letter-spacing:.02em;
    background:linear-gradient(100deg,#b8893f,#f6dc9c 30%,#fff3cf 40%,#e2b466 55%,#b8893f 75%,#f6dc9c);background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-filter:drop-shadow(0 0 7px rgba(255,218,150,.55)) drop-shadow(0 0 18px rgba(212,168,90,.35));
    filter:drop-shadow(0 0 7px rgba(255,218,150,.55)) drop-shadow(0 0 18px rgba(212,168,90,.35));
    animation:hubShine 6s linear infinite;}
  @keyframes hubShine{to{background-position:-250% 0;}}
  header .role{color:rgba(243,234,210,.7);}
  header .logout{border-radius:10px;border-color:rgba(243,217,155,.4);color:#f3ead2;background:rgba(255,255,255,.07);}
  nav{background:var(--hub-navy);border-bottom:2px solid #d4a85a;}
  nav button{color:rgba(243,234,210,.78);}
  nav button.active{color:#f6dc9c;border-bottom-color:#d4a85a;}
  nav button:hover{color:#fff;}
  @media (min-width:900px){
    nav{border-bottom:none;border-right:2px solid #d4a85a;box-shadow:4px 0 22px rgba(11,26,61,.14);}
    nav button.active{border-left:3px solid #d4a85a;background:rgba(243,217,155,.14);color:#f6dc9c;}
  }
  .brand .name{background:linear-gradient(100deg,#b8893f,#f6dc9c 30%,#fff3cf 40%,#e2b466 60%,#b8893f);
    -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;}
  .seal-mark{border-color:#a57a36;color:#8a6224;}
  .seal-mark::before{border-color:rgba(165,122,54,.4);}

  /* ── ກາດ / ສະຖິຕິ ── */
  .card{background:var(--panel);border-radius:14px;box-shadow:0 4px 16px rgba(27,36,55,.07);}
  .card h3{color:#0b1a3d;border-bottom-color:#eee5d3;}
  .stat{background:#fffdf8;border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 10px rgba(27,36,55,.05);}
  .stat b,.stat .num{color:#0b1a3d;}
  button.stat.active{background:#f7efdc;border-color:#d4a85a;}
  .yr-bar{background:#f0e9db;}
  .yr-bar i{background:var(--hub-grad);}

  /* ── ປຸ່ມ ── */
  .btn,.login-btn{background:var(--hub-grad);color:#1a1405;border-radius:11px;box-shadow:0 6px 16px rgba(165,122,54,.26);}
  .btn:hover,.login-btn:hover{filter:brightness(1.05);}
  .btn.secondary{background:#fffdf8;border:1px solid #d9cdb0;color:#8a6224;box-shadow:none;}
  .btn.secondary:hover{border-color:#a57a36;color:#6f4e1c;}
  .btn.danger{background:#fbeae7;border:1px solid #e3b5ac;color:#a4301f;box-shadow:none;}
  .icon-btn{border-radius:10px;border-color:#ded6c4;color:#57607a;}
  .icon-btn:hover{border-color:#a57a36;color:#8a6224;}
  .pay-chips button,.pay-quick button{background:#fffdf8;border-color:#ded6c4;}
  .pay-chips button[aria-pressed="true"]{background:var(--hub-grad);color:#1a1405;border-color:transparent;}
  .rcv-count-badge{background:var(--hub-grad);color:#1a1405;}
  .cart-item{background:#faf6ec;border:1px solid #eee3cc;border-radius:12px;}
  .tag.ok{background:#e8f2ec;color:#2f7d57;}
  .tag.sold{background:#f8eae7;color:#b3382a;}

  /* ── ປັອບອັບ / ແຈ້ງເຕືອນ / ລາຍການເລືອກ ── */
  .modal-bg{background:rgba(11,26,61,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
  .modal{background:#fffdf8;border:1px solid #e8dfc9;box-shadow:0 24px 60px rgba(27,36,55,.25);}
  .model-search-dropdown{background:#fffdf8;box-shadow:0 12px 26px rgba(27,36,55,.14);}
  .toast{background:linear-gradient(135deg,#0b1a3d,#1c3264);border:1px solid #d4a85a;color:#f3ead2;}

  /* ── ການ໌ດເອກະສານ (ໃບໂອນ ຯລຯ) ໃນແອັບ → ນ້ຳເງິນ+ທອງ ຄືໃບຮັບເງິນ ── */
  .doc-card{background:#fffdf8;border-color:#e8dfc9;}
  .doc-head{background:linear-gradient(135deg,#0b1a3d,#1c3264);border-bottom:3px solid #d4a85a;}
  .doc-head-title h3{color:#f3d99b;}
  .doc-brand .seal-mark{border-color:#d4a85a;color:#f3d99b;}
  .doc-tag{border-color:rgba(243,217,155,.7);}
  .doc-avatar{background:var(--hub-grad);color:#1a1405;}
  .doc-table-head{background:#0f1f45;color:#f3d99b;border:1px solid rgba(15,31,69,.3);border-bottom:none;}
  .doc-total-band{background:linear-gradient(135deg,#0b1a3d,#1c3264);color:#f3d99b;border:1px solid rgba(15,31,69,.3);}
  .doc-footer{background:#faf6ec;}
  /* ຕົວຢ່າງກະດາດ: ພື້ນຮອງຄີມ, ແຜ່ນເຈ້ຍຍັງຂາວ */
  .paper{background:#eae3d3;border:1px solid #ded6c4;}
  }

  /* ══════════ POS SHEET — ໜ້າອອກບິນຂາຍ / ໂອນສາຂາ ໃຫ້ຄືກັບ ສາຂາເມືອງຮຸນ ══════════ */
  @media screen{
  .ps-seg{display:flex;gap:8px;margin-bottom:12px;}
  .ps-seg button{flex:1;max-width:230px;padding:11px 14px;border-radius:11px;border:1px solid #ded6c4;
    background:#fffdf8;color:#57607a;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;}
  .ps-seg button.on{background:var(--hub-grad);border-color:transparent;color:#1a1405;font-weight:700;}
  .ps-sheet{padding:0;overflow:hidden;display:flex;flex-direction:column;}
  .ps-editbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;
    background:#fbf1de;border-bottom:1px solid #e8dfc9;color:#8a6224;font-weight:700;font-size:13px;}
  .ps-editbar .btn{width:auto;margin:0;padding:6px 14px;}
  .ps-head{display:grid;grid-template-columns:1fr 1fr 1.5fr auto;gap:10px;align-items:center;
    padding:14px 16px;background:#faf6ed;border-bottom:1px solid #eee5d3;}
  .ps-head input{margin:0;}
  .ps-addr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .ps-head-tr{grid-template-columns:1.4fr 1.4fr 170px auto;}
  .ps-meta{text-align:right;font-size:12px;color:#57607a;line-height:1.7;white-space:nowrap;}
  .ps-meta b{color:#8a6224;}
  .ps-meta span{display:block;}
  .ps-entry{padding:14px 16px 10px;border-bottom:1px solid #eee5d3;}
  .ps-entry-row{display:flex;flex-wrap:wrap;gap:12px;align-items:end;}
  .ps-entry-row .f-model{flex:1 1 300px;min-width:0;}
  .ps-entry-row .f-unit{flex:0 0 180px;}
  .ps-entry-row .f-qp{flex:0 0 230px;}
  .ps-entry-row .f-qty{flex:0 0 130px;}
  .ps-entry-row .f-add{flex:0 0 140px;}
  .ps-entry-row .f-add .btn{width:100%;}
  .ps-entry .f label{display:block;margin:0 0 4px;font-size:12.5px;color:#57607a;}
  .ps-entry .f-qp{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end;}
  .ps-entry .f input,.ps-entry .f select{margin:0;}
  .ps-entry .btn{margin:0;}
  #s_model,#tr_model{font-size:16px;padding:12px;}
  .tr-serials{max-height:210px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;
    padding:8px;background:#fffdf8;margin-top:6px;}
  .ps-list-head{padding:12px 16px 0;font-size:14px;font-weight:700;color:#0b1a3d;}
  .ps-table-wrap{padding:4px 16px 10px;flex:1;min-height:150px;overflow:auto;}
  .ps-table{width:100%;border-collapse:collapse;}
  .ps-table th{padding:8px 6px;border-bottom:1px solid #e8dfc9;font-size:12px;font-weight:700;
    color:#8a8fa2;text-align:left;white-space:nowrap;}
  .ps-table td{padding:9px 6px;border-bottom:1px solid #f2ebdd;font-size:14px;color:#1b2437;vertical-align:middle;}
  .ps-table tr:last-child td{border-bottom:none;}
  .ps-table .c{text-align:center;}
  .ps-table .r{text-align:right;white-space:nowrap;}
  .ps-table .b{font-weight:700;color:#0b1a3d;}
  .ps-table .x{cursor:pointer;color:#b3382a;font-weight:700;padding:2px 6px;}
  .ps-table .ps-empty td{padding:36px 6px;text-align:center;color:#8a8fa2;font-size:13px;border-bottom:none;}

  /* ແຖບລຸ່ມ: ຊ້າຍ = ບລ໊ອກຍອດເງິນ · ຂວາ = ສະຫຼຸບ + ປຸ່ມ (ຄືສາຂາເມືອງຮຸນ) */

/* ============================================================
   SUPABASE REST HELPER (fetch ตรงๆ, ไม่ใช้ supabase-js เพื่อความเข้ากันได้กับ iOS Safari)
   ============================================================ */
async function sb(path, options={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method: options.method || 'GET',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || 'return=representation',
      ...(options.headers||{})
    },
    body: options.body ? JSON.stringify(options.body) : undefined
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`Supabase error ${res.status}: ${t}`);
  }
  if(res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function uid(){ return crypto.randomUUID(); }

/* ເລກບິນຮຽງລຳດັບ INV-1, INV-2, INV-3 ...
   ຮຽງດ້ວຍ SQL (order=invoice_no.desc&limit=1) ບໍ່ໄດ້ ເພາະ invoice_no ເປັນ text ຈຶ່ງທຽບແບບຕົວອັກສອນ
   (INV-9 > INV-10) ຕ້ອງດຶງທັງໝົດມາແປງເປັນຕົວເລກແລ້ວຫາຄ່າສູງສຸດເອງ */
async function nextInvoiceNo(){
  const rows = await sb('sales_invoices?select=invoice_no');
  let max = 0;
  (rows||[]).forEach(r=>{
    const m = /^INV-(\d+)$/.exec(r.invoice_no || '');
    if(m) max = Math.max(max, Number(m[1]));
  });
  return 'INV-' + (max + 1);
}

/* ເລກໃບບິນຮັບເຂົ້າຮຽງລຳດັບ RCV-1, RCV-2, RCV-3 ...
   ໃຊ້ວິທີດຽວກັບ nextInvoiceNo(): receipt_no ເປັນ text ຮຽງດ້ວຍ SQL ບໍ່ໄດ້
   ຕ້ອງດຶງທັງໝົດມາແປງເປັນຕົວເລກແລ້ວຫາຄ່າສູງສຸດເອງ ແລ້ວ +1 */
async function nextReceiptNo(){
  const rows = await sb('stock_purchase_receipts?select=receipt_no');
  let max = 0;
  (rows||[]).forEach(r=>{
    const m = /^RCV-(\d+)$/.exec(r.receipt_no || '');
    if(m) max = Math.max(max, Number(m[1]));
  });
  return 'RCV-' + (max + 1);
}
function fmtMoney(n){ return (Math.round(n||0)).toLocaleString('en-US').replace(/,/g,'.'); }

/* ยอดกีบกับยอดบาทเป็นคนละสกุลเงิน เอามาบวกรวมกันตรงๆ ไม่ได้ (จะได้ตัวเลขที่ไม่มีความหมาย) ฟังก์ชันนี้เลยรวมแยกตามสกุลเงินแทน แล้วโชว์ทีละบรรทัด */
function sumByCurrency(rows, amountField){
  const out = {};
  rows.forEach(r=>{
    const c = r.currency || 'LAK';
    out[c] = (out[c]||0) + Number(r[amountField]||0);
  });
  return out;
}
/* ແຍກຈຳນວນເງິນກັບໜ່ວຍອອກເປັນຄົນລະ span ເພື່ອໃຫ້ຈັດແຖວ ກີບ/ບາດ ໃຫ້ຕົງກັນໄດ້ໃນຈໍມືຖື
   ຢູ່ຈໍໃຫຍ່ .cur-line ເປັນ block ຈຶ່ງເຫັນຄືເກົ່າ (ຂຶ້ນແຖວໃໝ່ແຕ່ລະສະກຸນ) */
function fmtByCurrency(obj){
  const parts = Object.keys(obj).filter(c=> obj[c]).map(c=> ({ amt: fmtMoney(obj[c]), unit: c==='THB' ? 'ບາດ' : 'ກີບ' }));
  const list = parts.length ? parts : [{ amt: fmtMoney(0), unit: 'ກີບ' }];
  return `<span class="cur-stack">${list.map(p=>
    `<span class="cur-line"><span class="cur-amt">${p.amt}</span><span class="cur-unit">${p.unit}</span></span>`
  ).join('')}</span>`;
}

/* ป้อนตัวเลขเงิน ให้ขึ้นจุดคั่นหลักพันอัตโนมัติ (ตามธรรมเนียมบิลลาว เช่น 1.550.000) */
function attachMoneyInput(id, initial){
  const el = document.getElementById(id);
  if(!el) return;
  el.setAttribute('inputmode','numeric');
  el.setAttribute('autocomplete','off');
  if(initial !== undefined && initial !== null && initial !== ''){
    const n = Number(initial)||0;
    el.value = n.toLocaleString('en-US').replace(/,/g,'.');
  }
  if(!el.dataset.moneyBound){
    el.dataset.moneyBound = '1';
    el.addEventListener('input', ()=>{
      const raw = el.value.replace(/[^\d]/g,'');
      el.value = raw ? Number(raw).toLocaleString('en-US').replace(/,/g,'.') : '';
    });
  }
}
function moneyValue(id){
  const el = document.getElementById(id);
  if(!el) return 0;
  return Number((el.value||'').replace(/[^\d]/g,'')) || 0;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
/* ปรับวันที่จาก YYYY-MM-DD (รูปแบบมาตรฐานที่เก็บในฐานข้อมูล/ช่อง input date) ให้แสดงผลเป็น วัน-เดือน-ปี ตามที่ผู้ใช้ต้องการเห็น (ใช้แค่ตอนแสดงผล ไม่กระทบข้อมูลที่เก็บจริง) */
function fmtDateDMY(dateStr){
  if(!dateStr) return '';
  const d = String(dateStr).slice(0,10);
  const parts = d.split('-');
  if(parts.length !== 3) return d;
  const [y,m,day] = parts;
  return `${day}-${m}-${y}`;
}

/* ============================================================
   ເອກະສານ A5 — ບິນຂາຍ ແລະ ໃບໂອນສາຂາ (ຮູບແບບດຽວກັນກັບເອກະສານຂອງສາຂາ)
   ໃຊ້ໂຄງດຽວກັນທັງ "ໜ້າຈໍ" ແລະ "ໜ້າພິມ": ສ້າງເນື້ອໃນເທື່ອດຽວ (invoiceDocBody / transferDocBody)
   ແລ້ວເອົາໄປວາງໃນກະດາດຕົວຢ່າງເທິງໜ້າຈໍ ຫຼື ສົ່ງເຂົ້າໜ້າຕ່າງພິມ — ເຫັນແນວໃດ ພິມອອກມາແນວນັ້ນ
   ຊື່ຮ້ານ / ສາຂາ / ເບີໂທ / ທີ່ຢູ່ ແກ້ບ່ອນນີ້ບ່ອນດຽວ ແລ້ວປ່ຽນທຸກໃບ
   ============================================================ */
const SHOP_INFO = {
  name:    'ບໍລິສັດດາວອນ ພັດທະນາກະສິກຳ ຂາອອກ-ຂາເຂົ້າ ຈຳກັດ ຜູ້ດຽວ',
  branch:  'ສາຂາຫຼັກ ເມືອງໄຊ',
  tel:     'Tel: 030 4949927, 020 5693 9546, 020 5659 3242',
  address: 'ບ້ານນາເລົາ, ເມືອງໄຊ, ແຂວງອຸດົມໄຊ'
};
const PRINT_FROM_BRANCH = 'ສາຂາຫຼັກ'; /* ຊື່ສາຂາຕົ້ນທາງໃນໃບໂອນ (ຄືກັບ from_branch ທີ່ບັນທຶກລົງ DB) */

function escHtml(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function curLabel(c){ return c === 'THB' ? 'ບາດ' : 'ກີບ'; }
function moneyCur(n, c){ return fmtMoney(n) + ' ' + curLabel(c); }

/* ຫົວກະດາດ (ຊື່ຮ້ານ + ສາຂາ + ເບີໂທ + ທີ່ຢູ່) ໃຊ້ຮ່ວມກັນທັງໜ້າຈໍ ແລະ ໜ້າພິມ */
function shopLogoUrl(){
  /* ໜ້າຕ່າງພິມເປັນ about:blank ຕ້ອງໃຊ້ URL ເຕັມ ຮູບໂລໂກ້ຈຶ່ງຈະອອກ */
  try{ return new URL('assets/icon-512.png', location.href).href; }catch(e){ return 'assets/icon-512.png'; }
}
function shopHeaderHtml(){

      '<div class="shop-logo"><img src="' + escHtml(shopLogoUrl()) + '" alt=""></div>' +
      '<div class="shop-id">' +
        '<p class="shop-name">' + escHtml(SHOP_INFO.name) + '</p>' +
        '<p class="shop-branch">(' + escHtml(SHOP_INFO.branch) + ')</p>' +
        '<p class="shop-meta">' + escHtml(SHOP_INFO.tel) + '</p>' +
        '<p class="shop-meta">' + escHtml(SHOP_INFO.address) + '</p>' +

    '</div>' +
    '<div class="shop-rule"></div>';
}
/* ກະດາດຕົວຢ່າງເທິງໜ້າຈໍ — ໜ້າຕາຄືກັບໃບທີ່ຈະພິມອອກມາ */
function paperHtml(bodyHtml){

/* ຕ້ອງເປີດໜ້າຕ່າງພິມທັນທີຕອນຜູ້ໃຊ້ກົດປຸ່ມ ແລ້ວຄ່ອຍຂຽນເນື້ອໃນລົງໄປຫຼັງໂຫລດຂໍ້ມູນເສັດ
   ຖ້າໄປເປີດຫຼັງ await ບຣາວເຊີຈະຖືວ່າບໍ່ໄດ້ມາຈາກການກົດ ແລ້ວບລັອກປັອບອັບຖິ້ມ */
function openPrintWindow(){
  const w = window.open('', '_blank', 'width=460,height=660');

  return w;
}
function closePrintWindow(w){ if(w && !w.closed) w.close(); }

/* ໂຄງເອກະສານ A5 ຮ່ວມກັນຂອງທຸກໃບ: ຫົວກະດາດຮ້ານ + CSS ພິມ, ເນື້ອໃນສົ່ງເຂົ້າມາທາງ bodyHtml */

    '.sub{font-size:11.5px;color:#6b6a63;margin:0;text-align:center;}',
    '.sub::after{content:"";display:block;width:96px;height:4px;border-radius:2px;margin:12px auto 0;background:linear-gradient(90deg,#d9b85c,#a8801f);}',
    '.cust{margin:16px 0;padding:12px 14px;background:#FBF6EA;border-left:4px solid #d9b85c;border-radius:8px;font-size:12.5px;line-height:1.85;color:#2a2a2a;}',
    '.cust-split{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;}',
    '.cust-info{flex:1;min-width:0;}',
    '.cust-pay{font-size:12px;font-weight:700;color:#8a6a1e;text-align:right;max-width:55%;}',
    '.meta-row{text-align:left;}',
    '.meta-row b{color:#14265c;margin-right:6px;}',
    'table{width:100%;border-collapse:separate;border-spacing:0;margin-top:12px;}',
    'thead{display:table-header-group;}',
    'thead th{background:#14265c;color:#fff;font-size:11.5px;font-weight:700;padding:8px;text-align:left;}',
    'thead th:first-child{border-radius:8px 0 0 8px;}',

/* ບ່ອນເຊັນສອງຊ່ອງທ້າຍໃບ */
function printSigns(left, leftSub, right, rightSub){
  const box = (label, sub)=>
    '<div class="sign"><div class="sign-line"></div><p class="sign-label">' + escHtml(label) + '</p>' +
    (sub ? '<p class="sign-sub">' + escHtml(sub) + '</p>' : '') + '</div>';
  return '<div class="signs">' + box(left, leftSub) + box(right, rightSub) + '</div>';
}

/* ---------- ບິນຂາຍ ---------- */
function invoiceDocBody(inv, items, payments){
  const cur = inv.currency || 'LAK';
  const unitOf = (it)=> (it.stock_product_models && it.stock_product_models.unit) || '';
  const nameOf = (it)=> (it.stock_product_models && it.stock_product_models.name) || '-';
  const codeOf = (it)=> (it.stock_product_models && it.stock_product_models.code) || '';
  /* ເຄື່ອງທີ່ມີເລກເຄື່ອງ (variant_note) ໃຫ້ເອົາເລກເຄື່ອງຂຶ້ນຖັນທຳອິດແທນລະຫັດ — ແຍກເຄື່ອງລຸ້ນດຽວກັນອອກຈາກກັນໄດ້ */
  const serialOf = (it)=> (it.variant_note && it.variant_note !== BUNDLE_TAG) ? it.variant_note : '';
  const anySerial = items.some(it=> serialOf(it));
  const firstHead = anySerial ? (items.every(it=> serialOf(it)) ? 'ເລກເຄື່ອງ' : 'ເລກເຄື່ອງ / ລະຫັດ') : 'ລະຫັດສິນຄ້າ';
  const rows = items.map(it=>{
    const bundle = it.variant_note === BUNDLE_TAG;
    const first = serialOf(it) || codeOf(it) || '-';
    return '<tr><td>' + escHtml(bundle ? (codeOf(it) || '-') : first) + '</td>' +
           '<td>' + (bundle ? '↳ ' : '') + escHtml(nameOf(it)) +
             (bundle ? '<div class="c">' + escHtml(BUNDLE_TAG) + ' (ບໍ່ຄິດເງິນ)</div>' : '') + '</td>' +
           '<td class="num">' + fmtMoney(it.quantity) + ' ' + escHtml(unitOf(it)) + '</td>' +
           '<td class="num">' + moneyCur(it.unit_price, cur) + '</td>' +
           '<td class="num">' + (bundle ? '-' : moneyCur(it.amount, cur)) + '</td></tr>';
  }).join('');
  const discount = Number(inv.discount_amount || 0);
  const subtotal = Number(inv.total_amount || 0) + discount;
  const remain = Number(inv.total_amount || 0) - Number(inv.paid_amount || 0);
  const address = [inv.village, inv.district, inv.province].filter(Boolean).join(' · ');
  const howLabel = (m)=> m === 'transfer' ? 'ເງິນໂອນ' : 'ເງິນສົດ';
  const ways = [...new Set((payments || []).map(p=> howLabel(p.method) + ' (' + curLabel(p.currency || cur) + ')'))];
  const payText = ways.length ? 'ຊຳລະດ້ວຍ' + ways.join(' + ') : 'ຍັງບໍ່ໄດ້ຊຳລະ';
  return '<h1>ໃບຮັບເງິນ / ບິນຂາຍ</h1>' +
    '<p class="sub">ເລກທີ ' + escHtml(inv.invoice_no || '-') + ' · ' + escHtml(fmtDateDMY(inv.invoice_date)) + '</p>' +
    '<div class="cust cust-split">' +
      '<div class="cust-info">' +
        '<div class="meta-row"><b>ລູກຄ້າ:</b>' + escHtml(inv.customer_name || 'ລູກຄ້າທົ່ວໄປ') + '</div>' +
        (inv.customer_phone ? '<div class="meta-row"><b>ເບີໂທ:</b>' + escHtml(inv.customer_phone) + '</div>' : '') +
        (address ? '<div class="meta-row"><b>ທີ່ຢູ່:</b>' + escHtml(address) + '</div>' : '') +
      '</div>' +
      '<div class="cust-pay">' + escHtml(payText) + '</div>' +
    '</div>' +
    '<table><thead><tr><th>' + firstHead + '</th><th>ລາຍການ</th><th class="num">ຈຳນວນ</th><th class="num">ລາຄາ/ຫົວໜ່ວຍ</th><th class="num">ລວມ</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>' +
    (discount > 0
      ? '<div class="sub-total"><span>ລວມເປັນເງິນ</span><span>' + moneyCur(subtotal, cur) + '</span></div>' +
        '<div class="sub-total"><span>ສ່ວນຫຼຸດ</span><span>-' + moneyCur(discount, cur) + '</span></div>'
      : '') +
    '<div class="grand"><span>ຍອດລວມທັງໝົດ</span><span>' + moneyCur(inv.total_amount, cur) + '</span></div>' +
    (remain > 0.5 ? '<div class="sub-total"><span>ຈ່າຍແລ້ວ</span><span>' + moneyCur(inv.paid_amount, cur) + '</span></div>' +
                    '<div class="sub-total"><b>ຍັງຄ້າງຊຳລະ</b><b>' + moneyCur(remain, cur) + '</b></div>' : '') +
    printSigns('ຜູ້ຈ່າຍເງິນ ແລະ ຮັບເຄື່ອງ', '(ໄດ້ຮັບເຄື່ອງຄົບແລ້ວ)', 'ຜູ້ຈ່າຍເຄື່ອງ ແລະ ຮັບເງິນ', '') +
    '<p class="thanks">ຂອບໃຈທີ່ມາອຸດໜູນ</p>';
}
function printInvoiceDoc(inv, items, payments, opts){
  printDoc('ບິນ ' + (inv.invoice_no || ''), invoiceDocBody(inv, items, payments), opts);
}

/* ດຶງຂໍ້ມູນບິນຈາກ DB ແລ້ວພິມ — ໃຊ້ຕອນພິມຈາກໜ້າອື່ນທີ່ຍັງບໍ່ມີລາຍລະອຽດຢູ່ໃນມື */
async function printInvoiceById(invoiceId, win){
  try{
    const [invRows, items, payments] = await Promise.all([
      sb(`sales_invoices?select=*&id=eq.${invoiceId}`),
      getInvoiceItems(invoiceId),
      getInvoicePayments(invoiceId)
    ]);
    if(!invRows || !invRows.length) throw new Error('ບໍ່ພົບບິນນີ້');
    printInvoiceDoc(invRows[0], items, payments, { win });
  }catch(err){
    closePrintWindow(win);
    toast('ພິມບໍ່ໄດ້: ' + err.message);
  }
}

/* ---------- ໃບໂອນສາຂາ ---------- */
function transferDocBody(t, items){
  const rows = items.map((it, i)=>
    '<tr><td>' + (i+1) + '</td>' +
    '<td>' + escHtml(it.code || '-') + '</td>' +
    '<td>' + escHtml(it.name || '-') +
      (it.serial_no ? '<div class="c">ເລກເຄື່ອງ ' + escHtml(it.serial_no) + '</div>' : '') + '</td>' +
    '<td class="num">' + fmtMoney(it.quantity) + ' ' + escHtml(it.unit || '') + '</td></tr>'
  ).join('');
  const totalQty = items.reduce((s, it)=> s + (Number(it.quantity) || 0), 0);
  const from = t.from_branch || PRINT_FROM_BRANCH;
  const to = t.to_branch || '-';
  return '<h1>ໃບໂອນສິນຄ້າລະຫວ່າງສາຂາ</h1>' +
    '<p class="sub">ເລກທີ ' + escHtml(t.transfer_no || '-') + ' · ' + escHtml(fmtDateDMY(t.date)) + '</p>' +
    '<div class="cust">' +
      '<div class="meta-row"><b>ຈາກສາຂາ:</b>' + escHtml(from) + '</div>' +

      (t.created_by ? '<div class="meta-row"><b>ຜູ້ອອກໃບໂອນ:</b>' + escHtml(t.created_by) + '</div>' : '') +

    '<p class="note">ໝາຍເຫດ: ໃບນີ້ໃຊ້ຄູ່ກັບການໂອນໃນລະບົບ — ສາຂາປາຍທາງກົດ “ຢືນຢັນຮັບເຂົ້າ” ໃນລະບົບຂອງຕົນເອງ</p>';
}

/* ປະກອບຂໍ້ມູນໃບໂອນຈາກກຸ່ມການເຄື່ອນໄຫວໃນປະຫວັດ: ດຶງໃບໂອນຈິງ (ມີເລກທີ/ສາຂາປາຍທາງ/ລະຫັດສິນຄ້າ) ກ່ອນ
   ຖ້າເປັນການໂອນເກົ່າທີ່ຍັງບໍ່ມີໃນຕາຕະລາງໃບໂອນ ຄ່ອຍຖອຍມາໃຊ້ຂໍ້ມູນຈາກ movement ແທນ */
async function loadTransferDoc(group){
  let doc = null, docItems = null;
  try{
    const [docs, rows] = await Promise.all([
      sb(`stock_branch_transfers?select=*&id=eq.${group.key}`),
      sb(`stock_branch_transfer_items?select=*&transfer_id=eq.${group.key}`)
    ]);
    if(docs && docs.length){ doc = docs[0]; docItems = rows || []; }
  }catch(e){ /* ດຶງບໍ່ໄດ້ ໃຊ້ຂໍ້ມູນຈາກປະຫວັດແທນ */ }
  /* ໝາຍເຫດທີ່ບັນທຶກໄວ້ໃນ movement ມີຮູບແບບ "ໂອນໄປ: ສາຂາ - ໝາຍເຫດ" */
  const noteStr = group.note || '';
  const m = /^ໂອນໄປ:\s*([^-]+?)(?:\s*-\s*([\s\S]*))?$/.exec(noteStr);
  const t = {
    transfer_no: (doc && doc.transfer_no) || '',
    from_branch: (doc && doc.from_branch) || PRINT_FROM_BRANCH,
    to_branch:   (doc && doc.to_branch) || (m ? m[1].trim() : ''),
    note:        (doc && doc.note) || (m ? (m[2] || '').trim() : noteStr),
    created_by:  group.created_by || (doc && doc.created_by) || '',
    date:        (group.date || '').slice(0,10) || ((doc && doc.created_at) || '').slice(0,10)
  };
  const items = (docItems && docItems.length) ? docItems.map(it=> ({
    code: it.code, name: it.name, unit: it.unit, serial_no: it.serial_no, quantity: it.quantity
  })) : (group.items || []).map(it=> ({
    code: (it.stock_product_models && it.stock_product_models.code) || '',
    name: (it.stock_product_models && it.stock_product_models.name) || '-',
    unit: (it.stock_product_models && it.stock_product_models.unit) || '',
    serial_no: (it.stock_product_units && it.stock_product_units.serial_no) || '',
    quantity: it.quantity
  }));
  return { t, items };
}
async function printTransferByGroup(group, win){
  try{
    const { t, items } = await loadTransferDoc(group);
    printTransferDoc(t, items, { win });
  }catch(err){
    closePrintWindow(win);
    toast('ພິມບໍ່ໄດ້: ' + err.message);
  }
}

/* ຖາມຫຼັງອອກບິນ/ອອກໃບໂອນວ່າຈະພິມເລີຍບໍ່ — ຕ້ອງເປີດໜ້າຕ່າງພິມຈາກການກົດປຸ່ມນີ້ ຈຶ່ງບໍ່ຖືກບລັອກ */
function askPrint(title, detail, onPrint){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.style.zIndex = 90;
  bg.innerHTML = `
    <div class="modal" style="max-width:440px;">
      <h3><svg class="dv-icon"><use href="#i-check-circle"></use></svg>${title}</h3>
      <div class="muted" style="font-size:13px;line-height:1.6;margin:6px 0 14px;"></div>
      <div style="display:flex;gap:10px;">
        <button class="btn secondary" data-no>ບໍ່ພິມ</button>
        <button class="btn" data-yes><svg class="dv-icon"><use href="#i-printer"></use></svg>ພິມ</button>
      </div>
    </div>`;
  bg.querySelector('.muted').textContent = detail || '';
  const close = ()=> bg.remove();
  bg.querySelector('[data-no]').addEventListener('click', close);
  bg.querySelector('[data-yes]').addEventListener('click', ()=>{
    const w = openPrintWindow();
    close();
    if(w) onPrint(w);
  });

function toast(msg){
  let c = document.getElementById('toastContainer');
  if(!c){
    c = document.createElement('div');
    c.id = 'toastContainer';
    c.className = 'toast-container';
    document.body.appendChild(c);
  }
  const t = document.createElement('div');
  t.className = 'toast';
  const isWarn = msg.includes('ຜິດພາດ') || msg.includes('ບໍ່ໄດ້');
  const isOk = !isWarn && msg.includes('ສຳເລັດ');
  const iconId = isWarn ? 'i-alert' : (isOk ? 'i-check-circle' : '');
  t.innerHTML = (iconId ? `<svg class="dv-icon"><use href="#${iconId}"></use></svg>` : '') + `<span></span>`;
  t.querySelector('span').textContent = msg;
  if(isWarn) t.querySelector('.dv-icon').style.color = '#e7a494';
  c.appendChild(t);
  setTimeout(()=> t.remove(), 2200);
}

/* ระบบกันลบพลาด: ถามยืนยัน 2 รอบเสมอ ก่อนจะลบอะไรก็ตาม (บิลขาย/โอนสาขา/รับเข้า/สินค้า/เลขเครื่อง)
   รอบที่ 1 = ถามว่าจะลบไหม, รอบที่ 2 = เตือนว่ากู้คืนไม่ได้ + ปุ่มยืนยันจะกดไม่ได้ 3 วินาทีแรก (กันกดรัวทะลุ)
   คืนค่า true เฉพาะตอนผู้ใช้ยืนยันครบทั้งสองรอบเท่านั้น */
function confirmDelete(what, detail){
  const step = (title, body, okText, danger, holdSec)=> new Promise(resolve=>{
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.style.zIndex = 90;
    bg.innerHTML = `
      <div class="modal" style="max-width:440px;">
        <h3><svg class="dv-icon"><use href="#i-alert"></use></svg>${title}</h3>
        <div style="font-size:14px;line-height:1.6;margin:6px 0 4px;white-space:pre-line;"></div>
        <div style="display:flex;gap:10px;">
          <button class="btn secondary" data-no>ຍົກເລີກ</button>
          <button class="btn ${danger ? 'danger' : ''}" data-yes></button>
        </div>
      </div>`;
    bg.querySelector('div[style*="line-height"]').textContent = body;
    const yes = bg.querySelector('[data-yes]');
    const done = (v)=>{ bg.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = (e)=>{ if(e.key === 'Escape') done(false); };
    bg.querySelector('[data-no]').addEventListener('click', ()=> done(false));
    yes.addEventListener('click', ()=>{ if(!yes.disabled) done(true); });
    bg.addEventListener('click', (e)=>{ if(e.target === bg) done(false); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(bg);
    if(holdSec){
      let left = holdSec;
      yes.disabled = true;
      yes.style.opacity = '.55';
      yes.textContent = `${okText} (${left})`;
      const tm = setInterval(()=>{
        left--;
        if(left > 0){ yes.textContent = `${okText} (${left})`; return; }
        clearInterval(tm);
        yes.disabled = false;
        yes.style.opacity = '';
        yes.textContent = okText;
      }, 1000);
    } else {
      yes.textContent = okText;
    }
  });

  return step('ຢືນຢັນການລົບ', what, 'ສືບຕໍ່', false, 0)
    .then(ok1 => ok1 ? step('ແນ່ໃຈບໍ່? (ຄັ້ງສຸດທ້າຍ)', (detail ? detail + '\n\n' : '') + 'ລົບແລ້ວກູ້ຄືນບໍ່ໄດ້ ກົດ "ຢືນຢັນລົບ" ເພື່ອລົບຖາວອນ', 'ຢືນຢັນລົບ', true, 3) : false);
}

/* กด Enter/Return ในช่องพวกนี้ = กดปุ่มเดียวกับปุ่มที่ระบุ (สะดวกเวลาพิมพ์ด้วยคีย์บอร์ด MacBook) */
function bindEnterKey(inputIds, buttonId){
  inputIds.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        const btn = document.getElementById(buttonId);
        if(btn) btn.click();
      }
    });
  });
}
/* กด Enter/Return ในช่องเหล่านี้ = โดดไปโฟกัสช่องถัดไปในลำดับ (ช่องสุดท้ายโดดไป finalId ถ้ามีระบุ) */
function bindEnterAdvance(inputIds, finalId){
  inputIds.forEach((id, idx)=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        const nextId = inputIds[idx+1] || finalId;
        const nextEl = nextId ? document.getElementById(nextId) : null;
        if(nextEl) nextEl.focus();
      }
    });
  });
}

/* ປ່ຽນ <select> ທີ່ມີລາຍການສິນຄ້າຫຼາຍໆໃຫ້ພິມຄົ້ນຫາໄດ້ (ຊື່ ຫຼື ລະຫັດ) ແທນການເລື່ອນຫາເອງ
   ໃຊ້ໄດ້ກັບ select ໃດກໍ່ໄດ້ ໂດຍ select ເກົ່າຍັງຢູ່ໃນ DOM (ເຊື່ອງໄວ້) ເພື່ອບໍ່ໃຫ້ໂຄ້ດອື່ນທີ່ອ້າງອີງ .value / .selectedOptions ພັງ */
function enableSearchableSelect(selectEl, opts){
  if(!selectEl || selectEl.dataset.searchable) return;
  opts = opts || {};
  selectEl.dataset.searchable = 'true';
  const wrap = document.createElement('div');
  wrap.className = 'model-search-wrap';
  selectEl.parentNode.insertBefore(wrap, selectEl);
  wrap.appendChild(selectEl);
  selectEl.style.display = 'none';

  const input = document.createElement('input');
  input.type = 'text';
  input.id = selectEl.id + '_search';
  input.autocomplete = 'off';
  input.placeholder = opts.placeholder || 'ພິມຊື່ / ລະຫັດ / ໝວດໝູ່ ເພື່ອຄົ້ນຫາ...';
  const emptyText = opts.emptyText || 'ບໍ່ພົບສິນຄ້າ';
  wrap.appendChild(input);

  const dropdown = document.createElement('div');
  dropdown.className = 'model-search-dropdown';
  dropdown.style.display = 'none';
  wrap.appendChild(dropdown);

  /* ອ່ານ options ໃໝ່ທຸກຄັ້ງ (ບໍ່ cache) ເພື່ອຮອງຮັບ select ທີ່ຖືກເຕີມຂໍ້ມູນຄືນ ເຊັ່ນ ລາຍການເລກເຄື່ອງ ທີ່ປ່ຽນຕາມສິນຄ້າທີ່ເລືອກ */
  const getOptions = ()=> Array.from(selectEl.options).filter(o=>o.value);
  let highlighted = -1;

  /* ສິນຄ້າຫຼາຍລາຍການຊື່ຊ້ຳກັນ ແຕ່ຄົນລະໝວດໝູ່ ຈຶ່ງຕ້ອງສະແດງລະຫັດ · ໝວດໝູ່ ໃຕ້ຊື່ ບໍ່ດັ່ງນັ້ນເລືອກຜິດໄດ້
     ອ່ານຈາກ data-code / data-cat ຂອງ <option> ຖ້າ select ໃດບໍ່ໄດ້ໃສ່ໄວ້ ກໍ່ສະແດງແຕ່ຊື່ຄືເກົ່າ */
  function optionMeta(o){
    return [o.dataset.code, o.dataset.cat].filter(Boolean).join(' · ');
  }
  function renderList(filter){
    /* ຄົ້ນຫາແບບແຍກຄຳ: ພິມຫຼາຍຄຳ (ເຊັ່ນ ຊື່ + ໝວດໝູ່) ຕ້ອງພົບຄົບທຸກຄຳຈຶ່ງຂຶ້ນ ບໍ່ບັງຄັບຕ້ອງຕິດກັນ */
    const tokens = (filter||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
    const options = getOptions();
    const filtered = tokens.length
      ? options.filter(o=>{ const hay = (o.textContent + ' ' + optionMeta(o)).toLowerCase(); return tokens.every(t=> hay.includes(t)); })
      : options;
    highlighted = -1;
    dropdown.innerHTML = filtered.length
      ? filtered.map(o=>{
          const meta = optionMeta(o);
          return `<div class="model-search-item" data-value="${o.value}">${o.textContent}${meta ? `<div class="model-search-meta">${meta}</div>` : ''}</div>`;
        }).join('')
      : `<div class="model-search-empty">${emptyText}</div>`;
  }
  function openDropdown(){ renderList(input.value); dropdown.style.display = 'block'; }
  function closeDropdown(){ dropdown.style.display = 'none'; }
  function selectOption(value){
    selectEl.value = value;
    const opt = selectEl.selectedOptions[0];
    input.value = opt ? opt.textContent : '';
    closeDropdown();
    selectEl.dispatchEvent(new Event('change', {bubbles:true}));
  }
  function updateHighlight(items){
    items.forEach((it,i)=> it.classList.toggle('active', i===highlighted));
    if(items[highlighted]) items[highlighted].scrollIntoView({block:'nearest'});
  }

  input.addEventListener('focus', openDropdown);
  input.addEventListener('click', openDropdown);
  input.addEventListener('input', openDropdown);
  dropdown.addEventListener('click', (e)=>{
    const item = e.target.closest('.model-search-item');
    if(item && item.dataset.value) selectOption(item.dataset.value);
  });
  input.addEventListener('keydown', (e)=>{
    if(dropdown.style.display === 'none' && (e.key === 'ArrowDown' || e.key === 'Enter')){
      openDropdown();
      if(e.key === 'Enter') return;
    }
    const items = dropdown.querySelectorAll('.model-search-item[data-value]');
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      highlighted = Math.min(highlighted+1, items.length-1);
      updateHighlight(items);
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      highlighted = Math.max(highlighted-1, 0);
      updateHighlight(items);
    } else if(e.key === 'Enter'){
      if(dropdown.style.display !== 'none' && items.length){
        e.preventDefault();
        e.stopPropagation();
        const idx = highlighted >= 0 ? highlighted : 0;
        if(items[idx]) selectOption(items[idx].dataset.value);
      }
    } else if(e.key === 'Escape'){
      closeDropdown();
      input.blur();
    }
  });
  input.addEventListener('blur', ()=>{
    setTimeout(()=>{
      closeDropdown();
      const opt = selectEl.selectedOptions[0];
      input.value = (opt && opt.value) ? opt.textContent : '';
    }, 150);
  });
  document.addEventListener('click', (e)=>{
    if(!wrap.contains(e.target)) closeDropdown();
  });
  /* ຖ້າ options ຖືກເຕີມຄືນ (ເຊັ່ນ ປ່ຽນສິນຄ້າແລ້ວ ໂຫລດເລກເຄື່ອງໃໝ່) ໃຫ້ອັບເດດຊ່ອງພິມ ຕາມຄ່າທີ່ເລືອກປັດຈຸບັນ ແລະ ຮີເຟຣຊລາຍການທີ່ເປີດຢູ່ */
  new MutationObserver(()=>{
    const opt = selectEl.selectedOptions[0];
    input.value = (opt && opt.value) ? opt.textContent : '';
    if(dropdown.style.display !== 'none') renderList('');
  }).observe(selectEl, {childList:true});
}

async function tryLogin(){
  const userEl = document.getElementById('loginUsername');
  const passEl = document.getElementById('loginPassword');
  const errEl = document.getElementById('loginErr');
  const btnEl = document.getElementById('loginBtn');
  const username = userEl.value.trim();
  const password = passEl.value;
  errEl.textContent = '';
  if(!username || !password){
    errEl.textContent = 'ກະລຸນາປ້ອນຊື່ຜູ້ໃຊ້ ແລະ ລະຫັດຜ່ານ';
    return;
  }
  btnEl.disabled = true;
  try{
    const rows = await sb(`hub_accounts?username=eq.${encodeURIComponent(username)}&password=eq.${encodeURIComponent(password)}&active=eq.true&select=*`);
    const account = rows && rows[0];
    const appRole = account ? DB_ROLE_TO_APP_ROLE[account.role] : null;
    if(account && appRole){
      currentRole = appRole;
      currentUsername = account.username;
      currentUserFullName = account.name || account.username;
      sessionStorage.setItem('dv_stock_session', JSON.stringify({ role: appRole, username: currentUsername, name: currentUserFullName }));
      passEl.value = '';
      enterApp();
    } else {
      errEl.textContent = 'ຊື່ຜູ້ໃຊ້ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ';
      passEl.value = '';
    }
  }catch(e){
    errEl.textContent = 'ເຊື່ອມຕໍ່ບໍ່ໄດ້ ລອງໃໝ່';
  }finally{
    btnEl.disabled = false;
  }
}
document.getElementById('loginBtn').addEventListener('click', tryLogin);
/* ຊ່ອງຊື່ຜູ້ໃຊ້ກົດ Enter = ລົງໄປຊ່ອງລະຫັດຜ່ານ ບໍ່ແມ່ນເຂົ້າສູ່ລະບົບເລີຍ (ຍັງບໍ່ທັນໃສ່ລະຫັດ) */

  { id:'products',  label:'ສິນຄ້າ',   icon:'i-box',     roles:['staff','admin','viewer','manager'] },

/* ==== ຮ່າງທີ່ພິມຄ້າງໄວ້ (draft) ====
   ຮັກສາຄ່າໃນຊ່ອງຕ່າງໆ (ຊື່ຜູ້ສະໜອງ/ລູກຄ້າ, ວັນທີ, ຈຳນວນ, ລາຄາ...) ເມື່ອສະຫຼັບແທັບ ບໍ່ໃຫ້ຫາຍ
   ບັນທຶກ (submit) ສຳເລັດຄ່ອຍລ້າງ. ບໍ່ເກັບ: ຊ່ອງເລືອກສິນຄ້າ (auto-fill ລາຄາເອງ), ຊ່ອງຈ່າຍເງິນ (ຊົ່ວຄາວ),
   ຕົວເລືອກເດືອນປະຫວັດ (ຈື່ໄວ້ໃນ dataset ຢູ່ແລ້ວ) */
const tabDrafts = { receive:{}, sell:{}, transfer:{} };
/* ຊ່ອງເງິນ: ໃສ່ຄືນ "ຫຼັງສຸດ" ເພາະ dispatch change ຊ່ອງສະກຸນເງິນ ຈະ auto-fill ຄ່າພວກນີ້ທັບ */
const DRAFT_MONEY_LAST = ['r_cost','r_rate','s_price','s_discount'];
const DRAFT_SKIP = new Set(['r_model','s_model','tr_model','s_unitSelect','rcv_month','tr_month',
  's_pay_amount','s_pay_currency','s_pay_rate','s_pay_method']);
let draftRestoring = false;
function draftSkip(id){
  return !id || DRAFT_SKIP.has(id) || id.endsWith('_search') || id.startsWith('trchk_');
}
function initDraftPersistence(){
  const main = document.getElementById('mainContent');
  if(!main || main.dataset.draftBound) return;
  main.dataset.draftBound = '1';
  /* ໃຊ້ delegated listener ຕິດຄັ້ງດຽວທີ່ mainContent (ບໍ່ຖືກລ້າງຕອນ re-render) */
  const capture = (e)=>{
    if(draftRestoring) return;
    const el = e.target;
    if(!el || !('value' in el) || draftSkip(el.id)) return;
    if(!tabDrafts[activeTab]) return;
    tabDrafts[activeTab][el.id] = el.value;
  };
  main.addEventListener('input', capture, true);
  main.addEventListener('change', capture, true);
}
function restoreTabDraft(tabKey){
  const draft = tabDrafts[tabKey];
  if(!draft) return;
  draftRestoring = true;
  const ids = Object.keys(draft).filter(id=> !draftSkip(id) && document.getElementById(id));
  /* ຮອບ 1: ຊ່ອງທົ່ວໄປ — dispatch ໃຫ້ UI ທີ່ຂຶ້ນກັບມັນ (ເຊັ່ນ ບລັອກອັດຕາແລກປ່ຽນ) ປັບຕາມ */
  ids.filter(id=> !DRAFT_MONEY_LAST.includes(id)).forEach(id=>{
    const el = document.getElementById(id);
    el.value = draft[id];
    el.dispatchEvent(new Event('input', {bubbles:true}));
    el.dispatchEvent(new Event('change', {bubbles:true}));
  });
  /* ຮອບ 2: ຊ່ອງເງິນ — ໃສ່ຄືນຫຼັງສຸດ ບໍ່ໃຫ້ auto-fill ຂອງສະກຸນເງິນມາທັບ */
  ids.filter(id=> DRAFT_MONEY_LAST.includes(id)).forEach(id=>{
    const el = document.getElementById(id);
    el.value = draft[id];
    el.dispatchEvent(new Event('input', {bubbles:true}));
  });
  draftRestoring = false;
}

function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  const main = document.getElementById('mainScreen');
  main.style.display = 'flex';
  document.getElementById('roleLabel').textContent = `${currentUserFullName || ''} · ${ROLE_LABEL[currentRole]}`;
  buildNav();
  renderTab();
}
function buildNav(){
  const nav = document.getElementById('tabNav');
  nav.innerHTML = '';
  TABS.filter(t=> t.roles.includes(currentRole)).forEach(t=>{
    const b = document.createElement('button');
    b.innerHTML = `<svg class="dv-icon"><use href="#${t.icon}"></use></svg><span>${t.label}</span>`;
    b.className = t.id === activeTab ? 'active' : '';
    b.addEventListener('click', ()=>{ activeTab = t.id; buildNav(); renderTab(); });
    nav.appendChild(b);
    /* ແທັບຫຼາຍກວ່າໜ້າຈໍ (ຈໍມືຖືແຄບ) → ເລື່ອນໃຫ້ແທັບທີ່ກຳລັງເປີດຢູ່ເຫັນສະເໝີ */
    if(t.id === activeTab) requestAnimationFrame(()=> b.scrollIntoView({ block:'nearest', inline:'nearest' }));
  });
}

async function renderTab(){
  const main = document.getElementById('mainContent');
  initDraftPersistence();
  main.innerHTML = '<div class="empty">ກຳລັງໂຫລດ...</div>';
  try{
    if(activeTab === 'dashboard') await renderDashboard(main);
    else if(activeTab === 'products') await renderProducts(main);
    else if(activeTab === 'receive') await renderReceive(main);
    else if(activeTab === 'sell') await renderSell(main);
    else if(activeTab === 'transfer') await renderTransfer(main);
    else if(activeTab === 'report') await renderReport(main);
    else if(activeTab === 'yearly') await renderYearly(main);
    /* ໃສ່ຄ່າທີ່ພິມຄ້າງໄວ້ຄືນ ຫຼັງ render + ຕິດ event ຄົບແລ້ວ */
    if(tabDrafts[activeTab]) restoreTabDraft(activeTab);
  }catch(err){
    console.error(err);
    main.innerHTML = `<div class="card"><div class="empty">ເກີດຂໍ້ຜິດພາດ: ${err.message}</div></div>`;
  }
}

async function getModels(){
  return await sb('stock_product_models?select=*&active=eq.true&order=name.asc');
}
async function getBalanceMap(){
  const rows = await sb('stock_balance?select=*');
  const map = {};
  rows.forEach(r=> map[r.model_id] = Number(r.qty)||0);
  return map;
}
async function getInStockUnits(modelId){
  return await sb(`stock_product_units?model_id=eq.${modelId}&status=eq.in_stock&order=received_at.asc`);
}
async function getUnitCountMap(){
  const rows = await sb('stock_product_units?select=model_id,status&status=eq.in_stock');
  const map = {};
  rows.forEach(r=> map[r.model_id] = (map[r.model_id]||0) + 1);
  return map;
}

/* ============================================================
   DASHBOARD
   ============================================================ */
async function renderDashboard(main){
  const today = todayStr();
  const monthStart = today.slice(0,7) + '-01';
  const [todayInv, monthInv, models, balMap, unitMap] = await Promise.all([
    sb(`sales_invoices?select=id,total_amount,currency&invoice_date=eq.${today}&status=eq.confirmed`),
    sb(`sales_invoices?select=id,total_amount,currency&invoice_date=gte.${monthStart}&status=eq.confirmed`),
    getModels(), getBalanceMap(), getUnitCountMap()
  ]);
  const [todayByCur, monthByCur] = await Promise.all([
    sumInvoicesByPaidCurrency(todayInv),
    sumInvoicesByPaidCurrency(monthInv)
  ]);

  const lowStock = models.filter(m=>{
    const qty = m.has_serial ? (unitMap[m.id]||0) : (balMap[m.id]||0);
    const threshold = m.low_stock_threshold!=null ? Number(m.low_stock_threshold) : 1;
    return qty <= threshold;
  }).sort((a,b)=>{
    /* ຮຽງຈາກເຫຼືອໜ້ອຍສຸດ → ຫຼາຍສຸດ; ຖ້າຈຳນວນເທົ່າກັນຈຶ່ງຮຽງຕາມຊື່ ເພື່ອໃຫ້ລຳດັບຄົງທີ່ */
    const qtyA = a.has_serial ? (unitMap[a.id]||0) : (balMap[a.id]||0);
    const qtyB = b.has_serial ? (unitMap[b.id]||0) : (balMap[b.id]||0);
    if(qtyA !== qtyB) return qtyA - qtyB;
    return (a.name||'').localeCompare(b.name||'');
  });

  let profitBlock = '';
  if(canSeeProfit()){
    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
    const monthProfitByCur = await getPeriodProfit(monthStart, tomorrow.toISOString().slice(0,10));
    profitBlock = `<div class="stat"><div class="num mono money">${fmtByCurrency(monthProfitByCur)}</div><div class="lbl">ກຳໄລເດືອນນີ້</div></div>`;
  }

  main.innerHTML = `
    <div class="stats-row">
      <div class="stat"><div class="num mono money">${fmtByCurrency(todayByCur)}</div><div class="lbl">ຍອດຂາຍມື້ນີ້</div></div>
      <div class="stat"><div class="num mono money">${fmtByCurrency(monthByCur)}</div><div class="lbl">ຍອດຂາຍເດືອນນີ້</div></div>
      ${profitBlock}
    </div>
    <div class="card">
      <h3><svg class="dv-icon"><use href="#i-alert"></use></svg>ສິນຄ້າໃກ້ໝົດ / ໝົດແລ້ວ</h3>
      ${lowStock.length ? lowStock.map(m=>{
        const qty = m.has_serial ? (unitMap[m.id]||0) : (balMap[m.id]||0);
        return `<div class="row"><span>${m.name}</span><span style="color:${qty<=0?'var(--danger)':'var(--orange-soft)'};font-weight:600;">ເຫຼືອ ${qty} ${m.unit||''}</span></div>`;
      }).join('') : '<div class="empty">ສະຕັອກຍັງປົກກະຕິ</div>'}
    </div>
  `;
}

/* ต้นทุนที่บันทึกไว้ (cost_lak ของแต่ละเครื่อง / cost_price ของรุ่นสินค้า) เป็นเงินกีบเสมอ ถ้าบิลขายเป็นสกุลบาทต้องเทียบกับ cost_price_thb ของรุ่นสินค้าแทน ไม่งั้นเอากีบไปลบบาทตรงๆ กำไรจะผิดเพี้ยนมหาศาล (ติดลบทั้งที่จริงกำไรอยู่) ถ้าบิลเป็นบาทแต่ยังไม่ได้ตั้ง cost_price_thb ไว้ ให้ถือว่าไม่ทราบต้นทุน (คืนค่า null) แล้วไม่รวมรายการนั้นในการคิดกำไร แทนที่จะโชว์ตัวเลขผิดๆ */
function itemUnitCostForInvoice(it, invCurrency){
  const model = it.stock_product_models || {};
  if(invCurrency === 'THB'){
    return model.cost_price_thb ? Number(model.cost_price_thb) : null;
  }
  if(it.unit_id && it.stock_product_units && it.stock_product_units.cost_lak != null){
    return Number(it.stock_product_units.cost_lak);
  }
  return model.cost_price != null ? (Number(model.cost_price)||0) : 0;
}
/* รวมกำไรของรายการสินค้าทั้งหมดในบิลเดียว คิดเป็นสกุลเงินของบิลนั้น (ยังไม่แปลงเป็นสกุลที่รับจ่ายจริง) */
function computeInvoiceItemProfit(items, invCurrency){
  let unknownCostCount = 0;
  const profit = items.reduce((s,it)=>{
    const unitCost = itemUnitCostForInvoice(it, invCurrency);
    if(unitCost === null){ unknownCostCount++; return s; }
    const cost = unitCost * Number(it.quantity||0);
    return s + (Number(it.amount||0) - cost);
  }, 0);
  return { profit, unknownCostCount };
}
/* ตั้งบิลไว้เป็นสกุลไหน ไม่ได้แปลว่าลูกค้าจ่ายเป็นสกุลนั้นจริงๆ (เช่นตั้งบิลเป็นบาท แต่ลูกค้าโอนมาเป็นกีบ) ยอดขาย/กำไรควรนับตามสกุลเงินที่ร้านได้รับจริงจากการจ่ายเงินแต่ละครั้ง ไม่ใช่สกุลเงินที่ตั้งราคาไว้ตอนออกบิล ฟังก์ชันนี้กระจายมูลค่าของบิล (ที่คิดไว้เป็นสกุลบิล เช่น ยอดขายทั้งบิล หรือ กำไรทั้งบิล) ไปตามสัดส่วนที่แต่ละการจ่ายเงินครอบคลุมยอดบิล แล้วแปลงส่วนนั้นเป็นสกุลเงินที่จ่ายจริง ส่วนที่ยังไม่ได้จ่าย (ค้างชำระ) จะยังนับเป็นสกุลเงินของบิลไปก่อน เพราะยังไม่รู้ว่าสุดท้ายจะได้รับเป็นสกุลไหน
   ถ้าลูกค้าจ่ายเกินยอดบิล (เช่นตั้งบิล 2,200 บาท @700 = 1,540,000 กีบ แต่รับเงินสด 1,600,000 กีบ) ส่วนที่เกิน (60,000 กีบ) จะถูกนับรวมเข้ายอดตามเงินสดที่รับจริง ไม่ตัดทิ้ง ทำให้ยอดขาย/กำไรตรงกับเงินที่ได้รับจริง */
function splitByPaidCurrency(valueInInvCurrency, invCurrency, totalAmount, payments, receivedOnly){
  const out = {};
  payments = payments || [];
  if(!totalAmount){
    /* ບໍ່ຮູ້ຍອດບິນ: ຖ້າມີການຈ່າຍ ໃຫ້ນັບຕາມເງິນສົດທີ່ຮັບຈິງ, ບໍ່ດັ່ງນັ້ນຄືນຄ່າຕາມສະກຸນບິນ */
    if(payments.length){
      payments.forEach(p=>{
        const amt = Number(p.amount)||0;
        if(!amt) return;
        const payCurrency = p.currency || invCurrency;
        out[payCurrency] = (out[payCurrency]||0) + amt;
      });
      return out;
    }
    if(receivedOnly) return out; /* ຍັງບໍ່ໄດ້ຈ່າຍ = ຍັງບໍ່ໄດ້ຮັບເງິນ */
    out[invCurrency] = (out[invCurrency]||0) + valueInInvCurrency;
    return out;
  }
  let coveredInInv = 0; /* ຍອດບິນທີ່ຈ່າຍແລ້ວ ນັບເປັນສະກຸນຂອງບິນ */
  payments.forEach(p=>{
    const amt = Number(p.amount)||0;
    const coveredInInvCurrency = p.converted_amount != null ? Number(p.converted_amount) : amt;
    if(!coveredInInvCurrency) return;
    const payCurrency = p.currency || invCurrency;
    const payPerInv = amt / coveredInInvCurrency; /* 1 ໜ່ວຍສະກຸນບິນ = ? ໜ່ວຍສະກຸນທີ່ຈ່າຍ */
    /* ສ່ວນທີ່ໃຊ້ຫັກຍອດບິນ (ບໍ່ເກີນຍອດຄ້າງ) → ໄດ້ສ່ວນແບ່ງຂອງ value ຕາມສັດສ່ວນ */
    const usableInInv = Math.max(0, Math.min(coveredInInvCurrency, totalAmount - coveredInInv));
    if(usableInInv > 0){
      const valueShare = valueInInvCurrency * (usableInInv / totalAmount);
      out[payCurrency] = (out[payCurrency]||0) + (payCurrency !== invCurrency ? valueShare * payPerInv : valueShare);
      coveredInInv += usableInInv;
    }
    /* ສ່ວນທີ່ຈ່າຍເກີນຍອດບິນ (overpayment) → ນັບເປັນມູນຄ່າເພີ່ມຕາມເງິນສົດທີ່ຮັບຈິງ ບໍ່ຕັດຖິ້ມ */
    const overInInv = coveredInInvCurrency - usableInInv;
    if(overInInv > 0){
      out[payCurrency] = (out[payCurrency]||0) + (payCurrency !== invCurrency ? overInInv * payPerInv : overInInv);
    }
  });
  /* ຍັງຄ້າງຊຳລະ → ນັບເປັນສະກຸນຂອງບິນໄປກ່ອນ ເພາະຍັງບໍ່ຮູ້ວ່າຈະຮັບເປັນສະກຸນໃດ
     ຖ້າ receivedOnly ບໍ່ນັບສ່ວນນີ້ (ຍັງບໍ່ໄດ້ຮັບເງິນ) */
  const remainingInInv = Math.max(0, totalAmount - coveredInInv);
  if(!receivedOnly && remainingInInv > 0){
    out[invCurrency] = (out[invCurrency]||0) + valueInInvCurrency * (remainingInInv / totalAmount);
  }
  return out;
}
/* รวมยอดขาย (total_amount) ของบิลหลายใบ แยกตามสกุลเงินที่รับจ่ายจริง (ไม่ใช่สกุลเงินที่ตั้งบิลไว้เฉยๆ) ต้องมี id ในแต่ละแถวของ invoices */
async function sumInvoicesByPaidCurrency(invoices){
  const out = {};
  if(!invoices.length) return out;
  const ids = invoices.map(i=>i.id).join(',');
  const payments = await sb(`sales_payments?select=invoice_id,currency,amount,converted_amount&invoice_id=in.(${ids})`);
  const paymentsByInvoice = {};
  payments.forEach(p=> (paymentsByInvoice[p.invoice_id] = paymentsByInvoice[p.invoice_id]||[]).push(p));
  invoices.forEach(inv=>{
    const invCurrency = inv.currency || 'LAK';
    const totalAmount = Number(inv.total_amount||0);
    /* ຍอดขายหน้าหลัก = เงินที่รับจริงเท่านั้น (ไม่รวมยอดค้าง) ໃຫ້ຕົງກັບໜ້າລາຍງານ */
    const split = splitByPaidCurrency(totalAmount, invCurrency, totalAmount, paymentsByInvoice[inv.id]||[], true);
    Object.keys(split).forEach(c=>{ out[c] = (out[c]||0) + split[c]; });
  });
  return out;
}
/* ຄິດຍອດຮັບຈິງແຍກຕາມສະກຸນເງິນ ຂອງແຕ່ລະບິນ (perInvoice) ພ້ອມຍອດລວມ (total)
   ໃຊ້ສະແດງໃນລາຍການບິນ ໃຫ້ໂຊວ໌ "ເງິນທີ່ຮັບຈິງ" ຂອງແຕ່ລະໃບ ແທນ "ລາຄາສິນຄ້າ/ຍອດບິນ" */
async function getReceivedByInvoice(invoices){
  const perInvoice = {};
  const total = {};
  if(!invoices.length) return { perInvoice, total };
  const ids = invoices.map(i=>i.id).join(',');
  const payments = await sb(`sales_payments?select=invoice_id,currency,amount,converted_amount&invoice_id=in.(${ids})`);
  const paymentsByInvoice = {};
  payments.forEach(p=> (paymentsByInvoice[p.invoice_id] = paymentsByInvoice[p.invoice_id]||[]).push(p));
  invoices.forEach(inv=>{
    const invCurrency = inv.currency || 'LAK';
    const totalAmount = Number(inv.total_amount||0);
    /* ຍอดขายในรายงาน = เงินที่รับจริงเท่านั้น (ไม่รวมยอดค้าง ซึ่งโชว์แยกที่ ຄ້າງຊຳລະ) */
    const split = splitByPaidCurrency(totalAmount, invCurrency, totalAmount, paymentsByInvoice[inv.id]||[], true);
    perInvoice[inv.id] = split;
    Object.keys(split).forEach(c=>{ total[c] = (total[c]||0) + split[c]; });
  });
  return { perInvoice, total };
}
/* คำนวณกำไร (ยอดขาย - ต้นทุน) ของບິນທັງໝົດในช่วงวันที่ที่กำหนด ใช้ต้นทุนปัจจุบันของสินค้า (ไม่ได้เก็บ snapshot ต้นทุน ณ วันขาย) แล้วนับกำไรตามสกุลเงินที่รับจ่ายจริงของแต่ละบิล ไม่ใช่สกุลเงินที่ตั้งบิลไว้ */
async function getPeriodProfit(start, end){
  const invoices = await sb(`sales_invoices?select=id,currency,total_amount&invoice_date=gte.${start}&invoice_date=lt.${end}&status=eq.confirmed`);
  if(!invoices.length) return {};
  const ids = invoices.map(i=>i.id).join(',');
  const [items, payments] = await Promise.all([
    sb(`sales_invoice_items?select=amount,quantity,unit_id,invoice_id,stock_product_models(cost_price,cost_price_thb),stock_product_units(cost_lak)&invoice_id=in.(${ids})`),
    sb(`sales_payments?select=invoice_id,currency,amount,converted_amount&invoice_id=in.(${ids})`)
  ]);
  const itemsByInvoice = {};
  items.forEach(it=> (itemsByInvoice[it.invoice_id] = itemsByInvoice[it.invoice_id]||[]).push(it));
  const paymentsByInvoice = {};
  payments.forEach(p=> (paymentsByInvoice[p.invoice_id] = paymentsByInvoice[p.invoice_id]||[]).push(p));
  const profitByCurrency = {};
  invoices.forEach(inv=>{
    const invCurrency = inv.currency || 'LAK';
    const { profit } = computeInvoiceItemProfit(itemsByInvoice[inv.id]||[], invCurrency);
    /* กำไร = เฉพาะส่วนที่ได้รับเงินจริงแล้ว (บิลที่ยังค้างไม่นับกำไรจนกว่าจะจ่าย) */
    const perCurrency = splitByPaidCurrency(profit, invCurrency, Number(inv.total_amount||0), paymentsByInvoice[inv.id]||[], true);
    Object.keys(perCurrency).forEach(c=>{
      profitByCurrency[c] = (profitByCurrency[c]||0) + perCurrency[c];
    });
  });
  return profitByCurrency;
}

        btn.addEventListener('click', (e)=>{
          e.stopPropagation();

          if(!model) return;
          /* ມີເລກເຄື່ອງ: ລົບເລກເຄື່ອງທີ່ເພີ່ມຜິດເປັນຊິ້ນ (ໃນ units modal) ບໍ່ມີເລກເຄື່ອງ: ຕັ້ງຈຳນວນທີ່ຖືກຕ້ອງ */

          else openAdjustStockModal(model, balMap[model.id]||0);

      main.querySelectorAll('[data-edit]').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          const model = models.find(m=> m.id === btn.dataset.edit);

        });

          if(!await confirmDelete(`ລົບ "${model.name}" ອອກຈາກລາຍການສິນຄ້າ?`, `ຖ້າສິນຄ້ານີ້ມີປະຫວັດຮັບເຂົ້າ/ຂາຍໄປແລ້ວ ຈະລົບບໍ່ໄດ້ (ໃຫ້ໃຊ້ "ແກ້ໄຂ" ແລ້ວປິດການໃຊ້ງານແທນ)`)) return;

            toast('ລົບບໍ່ໄດ້ (ອາດມີປະຫວັດຮັບເຂົ້າ/ຂາຍແລ້ວ) — ລອງ "ແກ້ໄຂ" ແລ້ວປິດການໃຊ້ງານແທນ');
